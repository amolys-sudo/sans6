<style>

    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100dvh;
    background: #000000;
    color: #ffffff;
    font-family: 'Courier New', 'Malgun Gothic', monospace;
    overflow: hidden;
    position: fixed;
    inset: 0;
    touch-action: none;
  }
  #app-root {
    width: 100vw;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    background: #000000;
  }
  #top-bar {
    position: fixed;
    top: env(safe-area-inset-top, 4px);
    left: 50%;
    transform: translateX(-50%);
    width: min(98vw, 800px);
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 4px;
    padding: 3px 6px;
    background: rgba(8, 8, 14, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.28);
    border-radius: 6px;
    backdrop-filter: blur(2px);
  }
  .brand-tag {
    font-size: 11px;
    font-weight: bold;
    color: #e6f7ff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .top-btns {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-shrink: 0;
  }
  .hud-btn {
    background: rgba(0, 0, 0, 0.85);
    color: #ffffff;
    border: 1.5px solid #ffffff;
    border-radius: 4px;
    padding: 3px 7px;
    font-family: inherit;
    font-size: 10px;
    font-weight: bold;
    cursor: pointer;
  }
  .hud-btn:hover, .hud-btn:active {
    background: #ffe629;
    color: #000000;
    border-color: #ffe629;
  }
  .hud-btn.hard-btn {
    border-color: #ff3344;
    color: #ff5566;
  }
  .hud-btn.hard-btn.active, .hud-btn.hard-btn:hover {
    background: #ff2a2a;
    color: #ffffff;
    border-color: #ff2a2a;
  }
  #canvas-stage {
    width: 100vw;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: 28px;
  }
  canvas#game {
    background: #000000;
    border: 2px solid #ffffff;
    box-shadow: 0 0 24px rgba(38, 153, 255, 0.25);
    image-rendering: pixelated;
    display: block;
    touch-action: none;
  }
  /* 모바일/터치용 작고 희미하게 겹쳐지는 반투명 오버레이 키 */
  #mobile-overlay-pad {
    position: fixed;
    left: 0;
    right: 0;
    bottom: max(8px, env(safe-area-inset-bottom, 8px));
    padding: 0 12px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    pointer-events: none;
    z-index: 30;
    opacity: 0.34;
    transition: opacity 0.15s ease;
  }
  #mobile-overlay-pad:active {
    opacity: 0.62;
  }
  #mobile-overlay-pad.hidden {
    display: none;
  }
  .dpad-cluster {
    pointer-events: auto;
    display: grid;
    grid-template-columns: repeat(3, 35px);
    grid-template-rows: repeat(3, 35px);
    gap: 3px;
  }
  .ov-key {
    background: rgba(20, 22, 34, 0.72);
    border: 1.5px solid rgba(255, 255, 255, 0.75);
    border-radius: 7px;
    color: #ffffff;
    font-size: 13px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    touch-action: none;
  }
  .ov-key.pressed {
    background: rgba(255, 230, 41, 0.85);
    color: #000000;
    border-color: #ffe629;
  }
  .action-cluster {
    pointer-events: auto;
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 6px;
  }
  .ov-act {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(20, 22, 34, 0.72);
    border: 1.5px solid rgba(255, 165, 40, 0.85);
    color: #ffbb55;
    font-family: inherit;
    font-size: 11px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }
  .ov-act.z-act {
    border-color: rgba(44, 230, 75, 0.85);
    color: #66ff88;
  }
  .ov-act.pressed {
    background: rgba(255, 230, 41, 0.88);
    color: #000000;
    border-color: #ffe629;
  }

    <div class="dpad-cluster">
      <div></div>

      <div></div>
      <button class="ov-key" data-key="ArrowLeft">◀</button>
      <div></div>

      <div></div>
      <button class="ov-key" data-key="ArrowDown">▼</button>

      <button class="ov-act" data-key="KeyX">X</button>

    </div>
  </div>
</div>

    let drawH = vw / ratio;
    if (drawH > vh) {
      drawH = vh;
      drawW = vh * ratio;
    }
    canvas.style.width = `${Math.floor(drawW)}px`;
    canvas.style.height = `${Math.floor(drawH)}px`;

    ".........#WWWW######WW######WWWW#.........",
    "..........#WWWW####WWWW####WWWW#..........",
    "...........#WWWW##WWWWWW##WWWW#...........",
    "............#WWWWWWWWWWWWWWWW#............",
    ".............#WWWWWWWWWWWWWW#.............",
    "..............#WWWWWWWWWWWW#..............",
    "...............#WWWWWWWWWW#...............",
    "................#WWWWWWWW#................",
    ".................########................."
  ];

  // 71행 x 54열 원본 스프라이트를 3배 정수 스케일(162 x 213) 오프스크린 캔버스에 렌더링
  const SANS_ROWS = SANS_SPRITE_71x54.length;    // 71
  const SANS_COLS = SANS_SPRITE_71x54[0].length; // 54
  const SANS_SCALE = 3;
  const sansCanvas = document.createElement('canvas');
  sansCanvas.width = SANS_COLS * SANS_SCALE;  // 162
  sansCanvas.height = SANS_ROWS * SANS_SCALE; // 213
  const sctx = sansCanvas.getContext('2d');
  sctx.imageSmoothingEnabled = false;

  (function buildSansOffscreen() {
    // 검은 외투 외곽선이 순수 검은 배경과 구분되도록 미세 흰색 외곽 하이라이트 부여
    sctx.fillStyle = 'rgba(255, 255, 255, 0.24)';
    for (let r = 23; r < 64; r++) {
      const row = SANS_SPRITE_71x54[r];
      for (let c = 0; c < SANS_COLS; c++) {
        if (row[c] === 'B') {
          if (c === 0 || row[c - 1] === '.') {
            sctx.fillRect((c - 0.45) * SANS_SCALE, r * SANS_SCALE, 1.8, SANS_SCALE);
          }
          if (c === SANS_COLS - 1 || row[c + 1] === '.') {
            sctx.fillRect((c + 1) * SANS_SCALE, r * SANS_SCALE, 1.8, SANS_SCALE);
          }
        }
      }
    }
    for (let r = 0; r < SANS_ROWS; r++) {
      const row = SANS_SPRITE_71x54[r];
      for (let c = 0; c < SANS_COLS; c++) {
        const ch = row[c];
        if (ch === '.') continue;
        sctx.fillStyle = ch === 'W' ? '#ffffff' : '#000000';
        sctx.fillRect(c * SANS_SCALE, r * SANS_SCALE, SANS_SCALE, SANS_SCALE);
      }
    }
  })();

  const GB_SCALE = 2;
  function createBlasterCanvas(pupilAccent) {
    const cnv = document.createElement('canvas');
    cnv.width = 42 * GB_SCALE;
    cnv.height = 36 * GB_SCALE;
    const g = cnv.getContext('2d');
    g.imageSmoothingEnabled = false;
    for (let r = 0; r < 36; r++) {
      const row = GASTER_BLASTER_42x36[r];
      for (let c = 0; c < 42; c++) {
        const ch = row[c];
        if (ch === '.') continue;
        if (ch === 'W') g.fillStyle = '#ffffff';
        else if (ch === 'E') g.fillStyle = pupilAccent;
        else g.fillStyle = '#000000';
        g.fillRect(c * GB_SCALE, r * GB_SCALE, GB_SCALE, GB_SCALE);
      }
    }
    return cnv;
  }

  class ChiptuneAudio {
    constructor() {
      this.ctx = null;
      this.bgmOn = true;
      this.sfxOn = true;
      this.bgmTimer = 0;
      this.step = 0;
      this.bpm = 148;
    }
    init() {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) this.ctx = new AC();
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume();
      }
    }
    tone(freq, dur, type = 'square', vol = 0.08, delay = 0, slideTo = null) {
      if (!this.sfxOn || !this.ctx) return;
      const t = this.ctx.currentTime + delay;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      if (slideTo) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
      }
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(0.0008, t + dur);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + dur);
    }
    play(name) {
      this.init();
      if (!this.sfxOn || !this.ctx) return;
      switch (name) {
        case 'select':
          this.tone(660, 0.06, 'square', 0.07);
          break;
        case 'confirm':
          this.tone(880, 0.09, 'square', 0.08);
          break;
        case 'voice':
          this.tone(132 + Math.random() * 24, 0.042, 'square', 0.06);
          break;
        case 'soulSwitch':
          this.tone(520, 0.08, 'triangle', 0.11, 0, 980);
          this.tone(780, 0.12, 'sine', 0.09, 0.05, 1180);
          break;
        case 'slam':
          this.tone(140, 0.18, 'sawtooth', 0.15, 0, 42);
          break;
        case 'warn':
          this.tone(980, 0.08, 'square', 0.08);
          break;
        case 'clang':
          this.tone(1320, 0.06, 'triangle', 0.10, 0, 1760);
          break;
        case 'shoot':
          this.tone(920, 0.06, 'square', 0.07, 0, 460);
          break;
        case 'break':
          this.tone(320, 0.12, 'sawtooth', 0.10, 0, 95);
          break;
        case 'bomb':
          this.tone(160, 0.24, 'sawtooth', 0.16, 0, 38);
          this.tone(680, 0.14, 'square', 0.11, 0, 120);
          break;
        case 'blasterFire':
          this.tone(180, 0.32, 'sawtooth', 0.16, 0, 48);
          this.tone(95, 0.35, 'square', 0.13, 0, 36);
          break;
        case 'absorb':
          this.tone(360, 0.16, 'sine', 0.09, 0, 880);
          break;
        case 'hurt':
          this.tone(175, 0.14, 'sawtooth', 0.15, 0, 62);
          break;
        case 'miss':
          this.tone(440, 0.12, 'triangle', 0.08, 0, 290);
          break;
        case 'hit':
          this.tone(210, 0.18, 'sawtooth', 0.16, 0, 55);
          this.tone(620, 0.10, 'square', 0.10, 0.04, 140);
          break;
        case 'heal':
          this.tone(523, 0.09, 'triangle', 0.09, 0);
          this.tone(659, 0.09, 'triangle', 0.09, 0.08);
          this.tone(784, 0.16, 'triangle', 0.10, 0.16);
          break;
        case 'phaseUp':
          [330, 440, 554, 659, 880].forEach((f, i) => {
            this.tone(f, 0.16, 'sawtooth', 0.10, i * 0.07);
          });
          break;
      }
    }
    updateBgm(dt, active, phase, ultStage) {
      if (!this.bgmOn || !this.ctx || !active) return;
      const track = BGM_TRACKS[phase] || BGM_TRACKS[1];
      const targetBpm = ultStage > 0 ? track.bpm + 14 : track.bpm;
      this.bpm += (targetBpm - this.bpm) * Math.min(1, dt * 4);
      const stepDur = 60 / this.bpm / 4;
      this.bgmTimer += dt;
      if (this.bgmTimer < stepDur) return;
      this.bgmTimer -= stepDur;

      const idx = this.step % track.lead.length;
      if (track.lead[idx] > 0) {
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = ultStage > 0 || phase >= 2 ? 'sawtooth' : 'square';
        osc.frequency.setValueAtTime(track.lead[idx], t);
        g.gain.setValueAtTime(0.028, t);
        g.gain.exponentialRampToValueAtTime(0.0005, t + stepDur * 0.92);
        osc.connect(g);
        g.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + stepDur * 0.95);
      }
      if (track.bass[idx] > 0) {
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(track.bass[idx], t);
        g.gain.setValueAtTime(0.042, t);
        g.gain.exponentialRampToValueAtTime(0.0005, t + stepDur * 1.4);
        osc.connect(g);
        g.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + stepDur * 1.45);
      }
      this.step++;
    }
  }

  function consumePress(codes) {
    for (let i = 0; i < codes.length; i++) {
      const c = codes[i];
      if (justPressed[c]) {
        justPressed[c] = false;
        return true;
      }
    }
    return false;
  }

  function isHeld(codes, bufferMs = 0) {
    const now = performance.now();
    for (let i = 0; i < codes.length; i++) {
      const c = codes[i];
      if (keys[c]) return true;
      if (bufferMs > 0 && releaseBuffer[c] && (now - releaseBuffer[c]) < bufferMs) return true;
    }
    return false;
  }

      if (pressed) {
        sfx.init();
        if (!keys[code]) justPressed[code] = true;
        keys[code] = true;
        btn.classList.add('pressed');
      } else {
        keys[code] = false;
        releaseBuffer[code] = performance.now();
        btn.classList.remove('pressed');
      }
    };
    btn.addEventListener('touchstart', (e) => { e.preventDefault(); setActive(true); }, { passive: false });
    btn.addEventListener('touchend', (e) => { e.preventDefault(); setActive(false); }, { passive: false });
    btn.addEventListener('touchcancel', (e) => { e.preventDefault(); setActive(false); }, { passive: false });
    btn.addEventListener('mousedown', (e) => { e.preventDefault(); setActive(true); });
    btn.addEventListener('mouseup', (e) => { e.preventDefault(); setActive(false); });

  let canvasDragActive = false;

  function toCanvasCoords(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (clientX - rect.left) * (W / rect.width),
      y: (clientY - rect.top) * (H / rect.height)
    };
  }

  function handleCanvasPointerDown(clientX, clientY) {
    sfx.init();
    const { x: mx, y: my } = toCanvasCoords(clientX, clientY);
    lastTouchCanvasX = mx;
    lastTouchCanvasY = my;

    if (state.screen === 'TITLE') {
      if (my >= 412 && my <= 486) startNewGame(true);
      else startNewGame(false);
      return;
    }

    if (
      state.screen === 'DIALOGUE' ||
      state.screen === 'ATTACK_BAR' ||
      state.screen === 'GAMEOVER' ||
      state.screen === 'VICTORY'
    ) {
      justPressed['KeyZ'] = true;
      return;
    }

    if (state.screen === 'MENU') {
      if (my >= 584 && my <= 632) {
        for (let idx = 0; idx < 4; idx++) {
          const bx = 80 + idx * 165;
          if (mx >= bx && mx <= bx + 145) {
            state.menuIdx = idx;
            state.subMenuOpen = false;
            justPressed['KeyZ'] = true;
            return;
          }
        }
      } else if (state.subMenuOpen) {
        const list = state.menuIdx === 1 ? state.actOptions : state.items;
        for (let idx = 0; idx < list.length; idx++) {
          const yy = state.box.y + 44 + idx * 32;
          if (my >= yy - 22 && my <= yy + 10) {
            state.subIdx = idx;
            justPressed['KeyZ'] = true;
            return;
          }
        }
      }
      return;
    }

    if (state.screen === 'DODGE') {
      canvasDragActive = true;
      const s = state.soul;
      if (s.mode === 'GREEN' || s.mode === 'TWIN_GREEN') {
        const cx = s.mode === 'TWIN_GREEN' ? (s.twinL.x + s.twinR.x) / 2 : s.x;
        const cy = s.mode === 'TWIN_GREEN' ? (s.twinL.y + s.twinR.y) / 2 : s.y;
        s.shieldAngle = Math.atan2(my - cy, mx - cx);
      } else if (s.mode === 'BLUE' || s.mode === 'HYBRID_BY') {
        if (my < s.y - 16) justPressed['ArrowUp'] = true;
        if (s.mode === 'HYBRID_BY') keys['KeyZ'] = true;
      } else if (s.mode === 'YELLOW') {
        keys['KeyZ'] = true;
      }
    }
  }

  function handleCanvasPointerMove(clientX, clientY) {
    if (!canvasDragActive || state.screen !== 'DODGE') return;
    const { x: mx, y: my } = toCanvasCoords(clientX, clientY);
    const dx = mx - lastTouchCanvasX;
    const dy = my - lastTouchCanvasY;
    lastTouchCanvasX = mx;
    lastTouchCanvasY = my;

    const s = state.soul;
    const b = state.box;
    if (s.mode === 'GREEN' || s.mode === 'TWIN_GREEN') {
      const cx = s.mode === 'TWIN_GREEN' ? (s.twinL.x + s.twinR.x) / 2 : s.x;
      const cy = s.mode === 'TWIN_GREEN' ? (s.twinL.y + s.twinR.y) / 2 : s.y;
      s.shieldAngle = Math.atan2(my - cy, mx - cx);
      return;
    }
    if (s.mode === 'PURPLE' || s.mode === 'HYBRID_PG') {
      s.x = Math.max(b.x + 14, Math.min(b.x + b.w - 14, s.x + dx));
      if (Math.abs(dy) > 14) {
        s.railRow = Math.max(0, Math.min(2, s.railRow + (dy > 0 ? 1 : -1)));
      }
      if (s.mode === 'HYBRID_PG' && Math.abs(dx) > 2) {
        s.shieldAngle = dx > 0 ? 0 : Math.PI;
      }
      return;
    }
    if (s.mode === 'BLUE' || s.mode === 'HYBRID_BY') {
      s.x = Math.max(b.x + 11, Math.min(b.x + b.w - 11, s.x + dx));
      if (dy < -12 && s.grounded) {
        s.vy = -345;
        s.grounded = false;
      }
      return;
    }
    const inv = state.reverseControls ? -1 : 1;
    s.x = Math.max(b.x + 11, Math.min(b.x + b.w - 11, s.x + dx * inv));
    s.y = Math.max(b.y + 11, Math.min(b.y + b.h - 11, s.y + dy * inv));
    if (s.mode === 'HYBRID_RG' && (Math.abs(dx) > 1.5 || Math.abs(dy) > 1.5)) {
      s.shieldAngle = Math.atan2(dy * inv, dx * inv);
    }
  }

  // =========================================================================
  // 5. PIXEL-PERFECT SANS RENDERER (71x54 원본 유지 & 눈동자 색깔만 변경)
  // =========================================================================
  function drawSans() {
    const s = state.sans;
    const sx = Math.round(s.x + s.dodgeOffset + (s.shake > 0 ? (Math.random() - 0.5) * s.shake : 0));
    const sy = Math.round(s.y + (s.shake > 0 ? (Math.random() - 0.5) * s.shake : 0));

    const drawW = sansCanvas.width;   // 162
    const drawH = sansCanvas.height;  // 213
    const ox = Math.round(sx - drawW / 2);
    const oy = Math.round(sy - drawH / 2);

    ctx.save();
    ctx.imageSmoothingEnabled = false;

    // 강화 버전 붉은 살기 오라
    if (state.enhancedMode) {
      const pulse = 0.28 + Math.sin(performance.now() * 0.008) * 0.12;
      ctx.save();
      ctx.strokeStyle = `rgba(255, 42, 68, ${pulse + 0.3})`;
      ctx.lineWidth = 3;
      ctx.shadowColor = '#ff2244';
      ctx.shadowBlur = 18;
      ctx.strokeRect(ox + 16, oy + 4, drawW - 32, drawH - 12);
      ctx.restore();
    }

    // 3페이즈 또는 필살기3/종합필살기: 빨강을 제외한 6개 영혼 회전 연출
    if (state.phase === 3 || state.ultimateStage >= 3) {
      const t = performance.now() * 0.001;
      const sixSoulColors = ['#ff8800', '#ffe629', '#2ce64b', '#33ffff', '#2699ff', '#b84dff'];
      for (let i = 0; i < 6; i++) {
        const ang = t * 2.1 + (i * Math.PI * 2) / 6;
        const hx = sx + Math.cos(ang) * 114;
        const hy = sy - 10 + Math.sin(ang) * 34;
        ctx.save();
        ctx.globalAlpha = 0.88;
        ctx.shadowColor = sixSoulColors[i];
        ctx.shadowBlur = 10;
        drawMiniHeart(hx, hy, 6.2, sixSoulColors[i]);
        ctx.restore();
      }
    }

    // 원본 71x54 샌즈 도트 스프라이트 렌더링
    ctx.drawImage(sansCanvas, ox, oy);

    // 2페이즈 이상 또는 필살기 중 가슴 대각선 베인 상처 표시
    if (state.phase >= 2 || state.ultimateStage > 0) {
      ctx.strokeStyle = '#ff1a2b';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(ox + 19 * SANS_SCALE, oy + 31 * SANS_SCALE);
      ctx.lineTo(ox + 35 * SANS_SCALE, oy + 44 * SANS_SCALE);
      ctx.stroke();
    }

    // 샌즈의 눈: 네모로 변하지 않고 원본 71x54 스프라이트의 기존 눈동자 픽셀(2x2) 색깔만 변경!
    // 원본 행 13~14: 왼쪽 눈동자 열 19~20, 오른쪽 눈동자 열 33~34
    if (state.screen === 'DODGE') {
      const meta = SOUL_META[state.soul.mode] || SOUL_META.RED;
      const t = performance.now() * 0.001;
      let activeEyeColor = meta.eye1;
      if (meta.eye2) {
        activeEyeColor = Math.floor(t * 10) % 2 === 0 ? meta.eye1 : meta.eye2;
      }

      // 왼쪽 눈동자는 어둡게 비우고, 오른쪽 눈동자 2x2 픽셀의 색깔만 영혼 색깔로 변경
      ctx.fillStyle = '#000000';
      ctx.fillRect(ox + 19 * SANS_SCALE, oy + 13 * SANS_SCALE, 2 * SANS_SCALE, 2 * SANS_SCALE);

      ctx.fillStyle = activeEyeColor;
      ctx.fillRect(ox + 33 * SANS_SCALE, oy + 13 * SANS_SCALE, 2 * SANS_SCALE, 2 * SANS_SCALE);

      // 쌍둥이 방패 필살기 / 필살기 3 / 종합필살기 / 강화 버전일 때는 양쪽 눈동자 모두 발광 색상 적용
      if (
        state.soul.mode === 'TWIN_GREEN' ||
        state.ultimateStage >= 3 ||
        state.enhancedMode
      ) {
        const leftCol = state.enhancedMode && !meta.eye2 ? '#ff2a2a' : (meta.eye2 || activeEyeColor);
        ctx.fillStyle = leftCol;
        ctx.fillRect(ox + 19 * SANS_SCALE, oy + 13 * SANS_SCALE, 2 * SANS_SCALE, 2 * SANS_SCALE);
      }
    } else if (state.enhancedMode) {
      // 강화 버전 메뉴/대화 상태에서도 양쪽 눈동자 2x2 픽셀이 붉은빛으로 점멸
      const blinkCol = Math.floor(performance.now() * 0.008) % 2 === 0 ? '#ff2a2a' : '#ffe629';
      ctx.fillStyle = blinkCol;
      ctx.fillRect(ox + 19 * SANS_SCALE, oy + 13 * SANS_SCALE, 2 * SANS_SCALE, 2 * SANS_SCALE);
      ctx.fillRect(ox + 33 * SANS_SCALE, oy + 13 * SANS_SCALE, 2 * SANS_SCALE, 2 * SANS_SCALE);
    }

    // 땀방울 연출
    if (s.sweat > 0 || state.phase >= 2 || state.exhausted) {
      const dropOffset = Math.floor((performance.now() * 0.025) % 14);
      ctx.fillStyle = '#66eeff';
      ctx.fillRect(ox + 12 * SANS_SCALE, oy + 8 * SANS_SCALE + dropOffset, 3, 6);
      if (state.exhausted || state.phase === 3) {
        ctx.fillRect(ox + 41 * SANS_SCALE, oy + 10 * SANS_SCALE + ((dropOffset + 7) % 14), 3, 6);
      }
    }

    ctx.restore();
  }

  // =========================================================================
  // 6. HEART, SHIELD, BONE, BLASTER & TEXT WRAPPING HELPERS
  // =========================================================================
  function drawMiniHeart(x, y, r, color, upsideDown = false, splitColor2 = null) {
    ctx.save();
    ctx.translate(x, y);
    if (upsideDown) ctx.scale(1, -1);

    const heartPath = () => {
      ctx.beginPath();
      ctx.moveTo(0, r * 0.85);
      ctx.bezierCurveTo(-r * 1.25, r * 0.1, -r * 1.25, -r * 0.85, 0, -r * 0.35);
      ctx.bezierCurveTo(r * 1.25, -r * 0.85, r * 1.25, r * 0.1, 0, r * 0.85);
      ctx.closePath();
    };

    if (!splitColor2) {
      ctx.fillStyle = color;
      heartPath();
      ctx.fill();
    } else {
      ctx.save();
      ctx.beginPath();
      ctx.rect(-r * 2, -r * 2, r * 2, r * 4);
      ctx.clip();
      ctx.fillStyle = color;
      heartPath();
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.beginPath();
      ctx.rect(0, -r * 2, r * 2, r * 4);
      ctx.clip();
      ctx.fillStyle = splitColor2;
      heartPath();
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  function drawGreenShield(cx, cy, angle, radius = 23, arcSpan = Math.PI * 0.58) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.strokeStyle = 'rgba(44, 230, 75, 0.28)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = '#2ce64b';
    ctx.lineWidth = 4.5;
    ctx.shadowColor = '#2ce64b';
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(0, 0, radius, angle - arcSpan / 2, angle + arcSpan / 2);
    ctx.stroke();
    ctx.restore();
  }

  function drawBone(x, y, w, h, color = '#ffffff') {
    ctx.fillStyle = color;
    if (h >= w) {
      const shaftX = x + 3;
      const shaftW = Math.max(4, w - 6);
      ctx.fillRect(shaftX, y + 3, shaftW, Math.max(2, h - 6));
      ctx.fillRect(x, y, w, 5);
      ctx.fillRect(x, y + h - 5, w, 5);
    } else {
      const shaftY = y + 3;
      const shaftH = Math.max(4, h - 6);
      ctx.fillRect(x + 3, shaftY, Math.max(2, w - 6), shaftH);
      ctx.fillRect(x, y, 5, h);
      ctx.fillRect(x + w - 5, y, 5, h);
    }
  }

  function drawBlaster(gb) {
    ctx.save();
    ctx.translate(gb.x, gb.y);
    ctx.rotate(gb.angle);

    const scale = gb.scale || 1;
    const recoil = gb.active ? Math.min(8, (gb.timer - gb.chargeTime) * 45) : 0;

    if (gb.active) {
      const beamLen = gb.beamLen || (gb.centerSpinner ? 220 : 680);
      const beamW = (gb.centerSpinner ? 14 : 24) * scale;
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = gb.doubleDmg ? '#ff2255' : '#2699ff';
      ctx.shadowBlur = 20;
      ctx.fillRect(18 * scale - recoil, -beamW / 2, beamLen, beamW);
      ctx.fillStyle = gb.doubleDmg ? '#ff3366' : '#2699ff';
      ctx.fillRect(18 * scale - recoil, -beamW / 4, beamLen, beamW / 2);
      ctx.shadowBlur = 0;
    } else {
      ctx.strokeStyle = gb.doubleDmg ? 'rgba(255, 42, 85, 0.55)' : 'rgba(38, 153, 255, 0.50)';
      ctx.setLineDash([6, 6]);
      ctx.beginPath();
      ctx.moveTo(18 * scale, 0);
      ctx.lineTo(290, 0);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    // 첨부 이미지 기반 42x36 도트 가스터 블래스터 렌더링 (포구 방향 = +X축 회전 보정)
    ctx.save();
    ctx.translate(-recoil, 0);
    ctx.rotate(-Math.PI / 2);
    ctx.scale(scale, scale);

    const activeCanvas = gb.doubleDmg ? gbCanvasDouble : gbCanvasNormal;
    const bw = activeCanvas.width;   // 84
    const bh = activeCanvas.height;  // 72
    const splitY = 28 * GB_SCALE;    // 56 (상단 두개골 28행 / 하단 턱 8행 분리)
    const jawOpen = gb.active ? 10 : Math.min(5, (gb.timer / Math.max(0.05, gb.chargeTime)) * 5);

    ctx.drawImage(activeCanvas, 0, splitY, bw, bh - splitY, -bw / 2, -bh / 2 + splitY + jawOpen, bw, bh - splitY);
    ctx.drawImage(activeCanvas, 0, 0, bw, splitY, -bw / 2, -bh / 2, bw, splitY);

    ctx.restore();
    ctx.restore();
  }

  function drawWrappedBoxText(text, x, y, maxWidth, lineHeight) {
    const paragraphs = text.split('\n');
    let curY = y;
    for (let p = 0; p < paragraphs.length; p++) {
      const para = paragraphs[p];
      let line = '';
      for (let i = 0; i < para.length; i++) {
        const ch = para[i];
        const testLine = line + ch;
        if (ctx.measureText(testLine).width > maxWidth && line.length > 0) {
          ctx.fillText(line, x, curY);
          line = ch;
          curY += lineHeight;
        } else {
          line = testLine;
        }
      }
      if (line.length > 0) {
        ctx.fillText(line, x, curY);
        curY += lineHeight;
      }
    }
  }

  function startPlayerAttack() {
    state.screen = 'ATTACK_BAR';
    state.atkBarX = state.box.x + 16;

  }

  function resolvePlayerAttack() {
    const center = state.box.x + state.box.w / 2;
    const dist = Math.abs(state.atkBarX - center);
    const accuracy = Math.max(0.25, 1 - dist / (state.box.w / 2));

    // 종합필살기 생존 후 최후의 일격
    if (state.exhausted) {
      state.bossHp = 0;
      sfx.play('hit');
      state.sans.shake = 22;
      state.screenShake = 14;
      state.dmgPopup = { text: '9999999', color: '#ff2233', x: state.sans.x, y: state.sans.y - 35, timer: 1.5 };
      startDialogue('* ...9999999 데미지.\n* 결국... 네 의지가 내 영혼 지배력과 종합필살기마저 넘어섰군...', () => {
        state.screen = 'VICTORY';
      });
      return;
    }

    // 필살기 2 생존 후 [전투] 선택 시 -> 1 HP에서 필살기 3 발동!
    if (state.ult2Survived && !state.ult3Survived) {
      state.provoked = false;
      sfx.play('hit');
      state.sans.shake = 18;
      state.screenShake = 12;
      state.bossHp = 1;
      state.bossDisplayHp = 1;
      state.dmgPopup = { text: '-3999 (1 HP 생존!)', color: '#ff2255', x: state.sans.x, y: state.sans.y - 35, timer: 1.4 };
      startDialogue(
        '* 크윽... 체력이 딱 1 남았나...!\n* 그렇다면 전체 화면으로 너의 영혼을 빨아들이는 [필살기 3]을 보여주마!',
        () => beginBossTurn(3)
      );
      return;
    }

    if (!state.provoked) {
      sfx.play('miss');
      state.sans.dodgeTimer = 0.55;
      state.dmgPopup = { text: 'MISS', color: '#bbbbbb', x: state.sans.x, y: state.sans.y - 30, timer: 1.1 };
      const lines = [
        '* 뭘 기대한 거야? 내가 그냥 서서 맞아줄 줄 알았어?',
        '* 헛스윙이네. [행동]에서 도발하기를 쓰지 않는 한 절대 안 맞아.',
        '* 느려. 영혼을 조종하는 자 앞에서 정직한 공격은 안 통해.'
      ];
      startDialogue(lines[Math.floor(Math.random() * lines.length)], () => beginBossTurn(0));
    } else {
      state.provoked = false;
      // 플레이어 데미지 50% 감소 적용 (525 ~ 800)
      const dmg = Math.round((1050 + accuracy * 550) * 0.5);
      state.bossHp = Math.max(0, state.bossHp - dmg);
      sfx.play('hit');
      state.sans.shake = 18;
      state.screenShake = 12;
      state.dmgPopup = { text: `-${dmg}`, color: '#ff2233', x: state.sans.x, y: state.sans.y - 35, timer: 1.25 };

      if (state.bossHp <= 0) {
        if (state.phase < 3) {
          state.phase += 1;
          state.bossMaxHp = getBossHpForPhase(state.phase);
          state.bossHp = 0;
          state.bossDisplayHp = 0;
          state.screen = 'PHASE_TRANSITION';
          state.phaseAnimTimer = 0;
          sfx.play('phaseUp');
          return;
        } else {
          // 3페이즈 4000 HP 소진 -> 1 HP 생존 후 필살기 1 발동!
          state.bossHp = 1;
          state.bossDisplayHp = 1;
          sfx.play('phaseUp');
          startDialogue('* ...하아, 하아... 1 HP 남았나.\n* 그렇다면 내 모든 영혼 지배력을 해방할 수밖에! 첫 번째 필살기다!', () => {
            beginBossTurn(1);
          });
          return;
        }
      }

      startDialogue(`* 크윽...! 방심했군. (${dmg} 데미지!)\n* 하지만 다시는 그렇게 쉽게 맞지 않아.`, () => beginBossTurn(0));
    }
  }

    // 십자 폭발 범위 내의 주변 블록 연쇄 파괴!
    for (let i = state.walls.length - 1; i >= 0; i--) {
      const wl = state.walls[i];

      if (hitH || hitV) {
        state.walls.splice(i, 1);
      }
    }
  }
