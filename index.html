  function spawnTwinShieldArrowWave(idx) {
    const L = state.soul.twinL;
    const R = state.soul.twinR;
    const dirs = [
      { dx: 0, dy: -1 },
      { dx: 0.707, dy: -0.707 },
      { dx: 1, dy: 0 },
      { dx: 0.707, dy: 0.707 },
      { dx: 0, dy: 1 },
      { dx: -0.707, dy: 0.707 },
      { dx: -1, dy: 0 },
      { dx: -0.707, dy: -0.707 }
    ];
    const speedTiers = [
      { speed: 340, color: '#2699ff' },
      { speed: 230, color: '#2ce64b' },
      { speed: 155, color: '#ffe629' }
    ];

    const dL = dirs[(idx * 3 + Math.floor(Math.random() * 3)) % 8];
    const dR = dirs[(idx * 5 + 2 + Math.floor(Math.random() * 3)) % 8];
    const tierL = speedTiers[idx % 3];
    const tierR = speedTiers[(idx + 1 + (idx % 2)) % 3];
    const spawnDist = 175;

    state.projectiles.push({
      type: 'TWIN_ARROW',
      targetSoul: 'L',
      x: L.x + dL.dx * spawnDist,
      y: L.y + dL.dy * spawnDist,
      vx: -dL.dx * tierL.speed,
      vy: -dL.dy * tierL.speed,
      angle: Math.atan2(-dL.dy, -dL.dx),
      color: tierL.color
    });
    state.projectiles.push({
      type: 'TWIN_ARROW',
      targetSoul: 'R',
      x: R.x + dR.dx * spawnDist,
      y: R.y + dR.dy * spawnDist,
      vx: -dR.dx * tierR.speed,
      vy: -dR.dy * tierR.speed,
      angle: Math.atan2(-dR.dy, -dR.dx),
      color: tierR.color
    });
  }

  function updateWaveSpawns(dt) {
    const prevT = state.waveTimer;
    state.waveTimer += dt;
    const t = state.waveTimer;
    const b = state.box;

    // -----------------------------------------------------------------------
    // OMNI FINAL: 종합필살기 (필살기 1 + 2 + 3 + 8방향 중력 + 페이크 천장 + 반전)
    // -----------------------------------------------------------------------
    if (state.wavePattern === 'OMNI_FINAL') {
      // [Stage 0: 0 ~ 7.0s] 필살기 1 쌍둥이 방패
      if (t < 7.0) {
        if (Math.floor(t / 0.85) > Math.floor(prevT / 0.85)) {
          spawnTwinShieldArrowWave(Math.floor(t / 0.85));
        }
        return;
      }
      // [Stage 1: 7.0 ~ 14.5s] 8방향 중력 바닥 뼈 + 페이크 천장 낙하!
      if (prevT < 7.0 && t >= 7.0) {
        clearEntities();
        state.soul.twinSplit = false;
        state.omniStage = 1;
        state.flashAlpha = 0.85;
        state.flashColor = '#2699ff';
        state.box.tx = 210;
        state.box.ty = 250;
        state.box.tw = 380;
        state.box.th = 240;
        setSoulMode('BLUE');
        state.subPhaseLabel = '종합필살기 [2/5]: 8방향 중력 바닥 뼈 & 페이크 천장 낙하!';
        triggerGravitySlam('DOWN');
        return;
      }
      if (t >= 7.0 && t < 14.5) {
        const subT = t - 7.0;
        const prevSub = prevT - 7.0;
        if (Math.floor(subT / 1.35) > Math.floor(prevSub / 1.35)) {
          const dirs8 = ['DOWN', 'DOWN_RIGHT', 'RIGHT', 'UP_RIGHT', 'UP', 'UP_LEFT', 'LEFT', 'DOWN_LEFT'];
          const d = dirs8[Math.floor(subT / 1.35) % 8];
          triggerGravitySlam(d);
        }
        if (prevSub < 3.4 && subT >= 3.4) {
          state.fakeCeiling = {
            y: b.y + 4,
            targetY: b.y + 92,
            vy: 0,
            fallen: false,
            timer: 0
          };
          sfx.play('warn');
        }
        if (state.fakeCeiling) {
          const fc = state.fakeCeiling;
          fc.timer += dt;
          if (!fc.fallen && fc.timer >= 0.55) {
            fc.fallen = true;
            sfx.play('slam');
          }
          if (fc.fallen) {
            fc.y = Math.min(fc.targetY, fc.y + 420 * dt);
            if (state.soul.y - 9 < fc.y + 22) {
              damagePlayer(10, 8);
              state.soul.y = fc.y + 34;
            }
          }
        }
        return;
      }

      // [Stage 2: 14.5 ~ 21.5s] 조작 반전(상하좌우 반전) + 혼합영혼 360도 블래스터!
      if (prevT < 14.5 && t >= 14.5) {
        clearEntities();
        state.fakeCeiling = null;
        state.omniStage = 2;
        state.reverseControls = true;
        state.flashAlpha = 0.85;
        state.flashColor = '#ff00ff';
        state.box.tx = 220;
        state.box.ty = 260;
        state.box.tw = 360;
        state.box.th = 220;
        setSoulMode('HYBRID_RG');
        state.soul.x = 400;
        state.soul.y = 370;
        state.subPhaseLabel = '종합필살기 [3/5]: ⚠ 조작 반전(상하좌우 역전)! 360° 역방향 쌍둥이 블래스터!';
        state.blasters.push({
          x: 342, y: 370, offsetX: -58, angle: 0, rotSpeed: 1.9, chargeTime: 0.85, timer: 0, active: false, centerSpinner: true, scale: 0.9, beamLen: 220
        });
        state.blasters.push({
          x: 458, y: 370, offsetX: 58, angle: Math.PI, rotSpeed: -1.9, chargeTime: 0.85, timer: 0, active: false, centerSpinner: true, scale: 0.9, beamLen: 220
        });
        return;
      }
      if (t >= 14.5 && t < 21.5) {
        if (Math.floor(t / 1.05) > Math.floor(prevT / 1.05)) {
          const sides = ['LEFT', 'RIGHT', 'TOP', 'BOTTOM'];
          const side = sides[Math.floor(Math.random() * 4)];
          const spd = 215;
          let ax = 0, ay = 0, vx = 0, vy = 0;
          if (side === 'LEFT') { ax = b.x - 28; ay = state.soul.y; vx = spd; }
          if (side === 'RIGHT') { ax = b.x + b.w + 28; ay = state.soul.y; vx = -spd; }
          if (side === 'TOP') { ax = state.soul.x; ay = b.y - 28; vy = spd; }
          if (side === 'BOTTOM') { ax = state.soul.x; ay = b.y + b.h + 28; vy = -spd; }
          state.projectiles.push({
            type: 'TRACK_ARROW', side, x: ax, y: ay, vx, vy, angle: Math.atan2(vy, vx), color: '#ff55ff'
          });
        }
        return;
      }

      // [Stage 3: 21.5 ~ 28.0s] 필살기 2 고속 타워 등반
      if (prevT < 21.5 && t >= 21.5) {
        clearEntities();
        state.reverseControls = false;
        state.omniStage = 3;
        state.flashAlpha = 0.85;
        state.flashColor = '#2699ff';
        setupUlt2Tower();
        state.risingBoneY = 1140;
        state.subPhaseLabel = '종합필살기 [4/5]: 초고속 16층 발판 타워를 끝까지 올라가라!';
        return;
      }
      if (t >= 21.5 && t < 28.0) {
        for (let i = 0; i < state.platforms.length; i++) {
          const pl = state.platforms[i];
          if (pl.vx !== 0) {
            pl.x += pl.vx * 1.25 * dt;
            if (pl.x <= pl.minX) { pl.x = pl.minX; pl.vx = Math.abs(pl.vx); }
            else if (pl.x >= pl.maxX) { pl.x = pl.maxX; pl.vx = -Math.abs(pl.vx); }
          }
        }
        const maxCam = state.towerBottomY - (b.y + b.h);
        const desiredCam = Math.max(0, Math.min(maxCam, state.soul.y - (b.y + b.h * 0.46)));
        state.cameraY += (desiredCam - state.cameraY) * Math.min(1, dt * 8);
        state.risingBoneY -= 96 * dt;
        const maxLag = state.cameraY + b.y + b.h + 95;
        if (state.risingBoneY > maxLag) state.risingBoneY = maxLag;
        if (state.soul.y + 9 >= state.risingBoneY) {
          damagePlayer(10, 8);
          state.soul.y = Math.max(140, state.risingBoneY - 68);
          state.soul.vy = -350;
        }
        if (state.soul.y <= 106) {
          state.waveTimer = 28.0;
        }
        return;
      }

      // [Stage 4: 28.0 ~ 34.0s] 필살기 3 피날레 (전체 화면 소용돌이 뼈 + 12방향 2배 블래스터)
      if (prevT < 28.0 && t >= 28.0) {
        clearEntities();
        state.cameraY = 0;
        state.omniStage = 4;
        state.ult3BlasterFired = false;
        state.sans.targetX = 400;
        state.sans.pose = 'DUAL_HANDS';
        state.box.tx = 32;
        state.box.ty = 48;
        state.box.tw = 736;
        state.box.th = 472;
        setSoulMode('OMNI_FINAL');
        state.soul.x = 400;
        state.soul.y = 365;
        state.subPhaseLabel = '종합필살기 [5/5]: 전체 화면 영혼 흡수 & 12방향 2배 데미지 블래스터!';
        spawnUlt3VortexRing(0);
        return;
      }
      if (t >= 28.0) {
        const subT = t - 28.0;
        const prevSub = prevT - 28.0;
        if (subT < 3.6 && Math.floor(subT / 0.85) > Math.floor(prevSub / 0.85)) {
          spawnUlt3VortexRing(Math.floor(subT / 0.85));
        }
        if (!state.ult3BlasterFired && subT >= 4.0) {
          state.ult3BlasterFired = true;
          state.projectiles = [];
          spawnUlt3TwelveBlasters(2.0, true);
        }
        return;
      }
    }

    // -----------------------------------------------------------------------
    // ULTIMATE 3: 전체 화면 확대 -> 뼈 흡수(맞으면 HP 1) -> 12방향 2배 블래스터
    // -----------------------------------------------------------------------
    if (state.wavePattern === 'ULTIMATE_3') {
      if (t < 4.5 && Math.floor(t / 0.88) > Math.floor(prevT / 0.88)) {
        spawnUlt3VortexRing(Math.floor(t / 0.88));
      }
      if (!state.ult3BlasterFired && t >= 5.15) {
        state.ult3BlasterFired = true;
        state.projectiles = [];
        spawnUlt3TwelveBlasters(2.0, true);
      }
      return;
    }

    // -----------------------------------------------------------------------
    // ULTIMATE 2: 16-FLOOR VERTICAL TOWER CLIMB -> SINGLE-SHOT BLASTERS
    // -----------------------------------------------------------------------
    if (state.wavePattern === 'ULTIMATE_2') {
      if (state.ult2Phase === 'CLIMB') {
        for (let i = 0; i < state.platforms.length; i++) {
          const pl = state.platforms[i];
          if (pl.vx !== 0) {
            pl.x += pl.vx * dt;
            if (pl.x <= pl.minX) {
              pl.x = pl.minX;
              pl.vx = Math.abs(pl.vx);
            } else if (pl.x >= pl.maxX) {
              pl.x = pl.maxX;
              pl.vx = -Math.abs(pl.vx);
            }
          }
        }

        const maxCam = state.towerBottomY - (b.y + b.h);
        const desiredCam = Math.max(0, Math.min(maxCam, state.soul.y - (b.y + b.h * 0.46)));
        state.cameraY += (desiredCam - state.cameraY) * Math.min(1, dt * 7.5);

        // 하단 상승 뼈 속도 상향 (88px/s)
        const riseSpeed = 88;
        state.risingBoneY -= riseSpeed * dt;
        const maxBoneLagY = state.cameraY + b.y + b.h + 95;
        if (state.risingBoneY > maxBoneLagY) {
          state.risingBoneY = maxBoneLagY;
        }

        const boneInterval = 2.1;
        if (state.soul.y < 960 && state.soul.y > 210 && Math.floor(t / boneInterval) > Math.floor(prevT / boneInterval)) {
          const hazardWorldY = state.soul.y - 95;
          const gapLeft = Math.floor(t / boneInterval) % 2 === 0;
          const gapW = 86;
          if (gapLeft) {
            state.projectiles.push({
              type: 'BONE', x: b.x + gapW + 10, y: hazardWorldY,
              w: b.w - gapW - 14, h: 14, vx: 0, vy: 0, life: 1.55, color: '#ffffff'
            });
          } else {
            state.projectiles.push({
              type: 'BONE', x: b.x + 4, y: hazardWorldY,
              w: b.w - gapW - 14, h: 14, vx: 0, vy: 0, life: 1.55, color: '#ffffff'
            });
          }
          sfx.play('warn');
        }

        if (state.soul.y + 9 >= state.risingBoneY) {
          damagePlayer(9, 6);
          state.soul.y = Math.max(140, state.risingBoneY - 68);
          state.soul.vy = -345;
        }

        if (state.soul.y <= 106) {
          state.ult2Phase = 'SNIPE';
          state.waveTimer = 0;
          state.waveDuration = 11.5;
          state.platforms = [];
          state.projectiles = [];
          state.cameraY = 0;
          state.flashAlpha = 0.85;
          state.flashColor = '#2699ff';
          state.sans.targetX = 400;
          state.sans.pose = 'IDLE';
          sfx.play('heal');

          state.box.tx = 240;
          state.box.ty = 260;
          state.box.tw = 320;
          state.box.th = 200;
          setSoulMode('RED');
          state.soul.x = 400;
          state.soul.y = 360;
          state.subPhaseLabel = '필살기 2 [2단계]: 상자 복귀! 무작위 가스터 블래스터 1대씩 정밀 사격!';
        }
        return;
      }

      if (state.ult2Phase === 'SNIPE') {
        const interval = 0.72;
        if (state.ult2BlastersFired < state.ult2BlastersTotal && Math.floor(t / interval) > Math.floor(prevT / interval)) {
          state.ult2BlastersFired++;
          const ang = Math.random() * Math.PI * 2;
          const dist = 215;
          const gx = b.x + b.w / 2 + Math.cos(ang) * dist;
          const gy = b.y + b.h / 2 + Math.sin(ang) * (dist * 0.78);
          const aimAngle = Math.atan2(state.soul.y - gy, state.soul.x - gx);

          sfx.play('warn');
          state.blasters.push({
            x: gx,
            y: gy,
            angle: aimAngle,
            rotSpeed: 0,
            chargeTime: 0.54,
            timer: 0,
            active: false,
            scale: 1.0
          });
        }
        if (state.ult2BlastersFired >= state.ult2BlastersTotal && state.blasters.length === 0) {
          state.waveTimer = state.waveDuration;
        }
        return;
      }
    }

    // -----------------------------------------------------------------------
    // ULTIMATE 1: TWIN 8-DIRECTIONAL SHIELD -> 4-SOUL GAUNTLET
    // -----------------------------------------------------------------------
    if (state.wavePattern === 'ULTIMATE_1') {
      if (t < 10.8) {
        if (Math.floor(t / 1.0) > Math.floor(prevT / 1.0)) {
          spawnTwinShieldArrowWave(Math.floor(t / 1.0));
        }
      } else if (prevT < 10.8 && t >= 10.8) {
        clearEntities();
        state.soul.twinSplit = false;
        state.flashAlpha = 0.8;
        state.flashColor = '#00ff88';
        state.subPhaseLabel = '필살기 1 [2단계]: 영혼 재융합! 4색 연속 변환 러시 (파랑→보라→노랑→빨강)';
        setSoulMode('BLUE');
        triggerGravitySlam('DOWN');
      } else if (t >= 11.8) {
        const subT = t - 11.8;
        const stage = Math.floor(subT / 2.3);
        const prevStage = Math.floor((prevT - 11.8) / 2.3);
        if (stage !== prevStage) {
          if (stage === 0) {
            setSoulMode('BLUE');
            triggerGravitySlam('UP');
          } else if (stage === 1) {
            setSoulMode('PURPLE');
            for (let i = 0; i < 4; i++) {
              const row = (i + 1) % 3;
              const ry = b.y + b.h * (0.2 + row * 0.3) - 14;
              addWarning(b.x + b.w - 28, ry, 28, 28, 0.42, 'FLY_BONE_LEFT', '!');
            }
          } else if (stage === 2) {
            setSoulMode('YELLOW');
            spawnYellowBarrage(b, 1);
          } else if (stage >= 3) {
            setSoulMode('RED');
            for (let i = 0; i < 4; i++) {
              const ang = (i * Math.PI) / 2 + 0.4;
              state.blasters.push({
                x: b.x + b.w / 2 + Math.cos(ang) * 220,
                y: b.y + b.h / 2 + Math.sin(ang) * 160,
                angle: ang + Math.PI,
                rotSpeed: 0,
                chargeTime: 0.72,
                timer: 0,
                active: false,
                scale: 1.0
              });
            }
          }
        }
      }
      return;
    }

    // -----------------------------------------------------------------------
    // RED SOUL: BONE WAVES + GASTER BLASTERS
    // -----------------------------------------------------------------------
    if (state.wavePattern === 'P1_RED_BLASTER') {
      const interval = 1.15;
      if (Math.floor(t / interval) > Math.floor(prevT / interval)) {
        const idx = Math.floor(t / interval);
        if (idx % 2 === 0) {
          const gapY = b.y + 30 + Math.random() * (b.h - 90);
          const fromLeft = idx % 4 === 0;
          const bx = fromLeft ? b.x - 16 : b.x + b.w;
          const vx = (fromLeft ? 1 : -1) * 195;
          state.projectiles.push({ type: 'BONE', x: bx, y: b.y, w: 14, h: gapY - b.y, vx, vy: 0, color: '#ffffff' });
          state.projectiles.push({ type: 'BONE', x: bx, y: gapY + 56, w: 14, h: b.y + b.h - (gapY + 56), vx, vy: 0, color: '#ffffff' });
        } else {
          const fromLeft = Math.random() < 0.5;
          sfx.play('warn');
          state.blasters.push({
            x: fromLeft ? b.x - 42 : b.x + b.w + 42,
            y: state.soul.y,
            angle: fromLeft ? 0 : Math.PI,
            rotSpeed: 0,
            chargeTime: 0.68,
            timer: 0,
            active: false,
            scale: 1.0
          });
        }
      }
      return;
    }

    // -----------------------------------------------------------------------
    // BLUE SOUL: '!' SLAM + OVERHEAD '! TRAP !' ANTI-JUMP BONES
    // -----------------------------------------------------------------------
    if (state.wavePattern === 'P1_BLUE_TRAP' || state.wavePattern === 'P2_BLUE_SLAM_TRAP') {
      const interval = state.phase === 1 ? 1.55 : 1.25;
      if (Math.floor(t / interval) > Math.floor(prevT / interval)) {
        const stepIdx = Math.floor(t / interval);
        if (state.phase >= 2 && stepIdx % 3 === 0) {
          const dirs = ['DOWN', 'UP', 'LEFT', 'RIGHT'];
          triggerGravitySlam(dirs[stepIdx % 4]);
          return;
        }
        const fromRight = stepIdx % 2 === 0;
        const warnX = fromRight ? b.x + b.w - 28 : b.x;
        addWarning(warnX, b.y + b.h - 28, 28, 28, 0.45, fromRight ? 'LOW_BONE_L' : 'LOW_BONE_R', '!');
        addWarning(warnX, b.y, 28, b.h - 68, 0.45, fromRight ? 'TRAP_BONE_L' : 'TRAP_BONE_R', '! TRAP !', '#ff5566');
      }
      return;
    }

    // -----------------------------------------------------------------------
    // GREEN SOUL: CENTER LOCKED + 4-DIRECTIONAL SPEAR SHIELD DEFENSE
    // -----------------------------------------------------------------------
    if (state.wavePattern === 'P1_GREEN_SHIELD') {
      const interval = 0.72;
      if (Math.floor(t / interval) > Math.floor(prevT / interval)) {
        const dirs = [0, Math.PI / 2, Math.PI, -Math.PI / 2];
        const ang = dirs[Math.floor(Math.random() * dirs.length)];
        const dist = 175;
        const spd = 225;
        state.projectiles.push({
          type: 'TRACK_ARROW',
          side: 'NONE',
          x: state.soul.x + Math.cos(ang) * dist,
          y: state.soul.y + Math.sin(ang) * dist,
          vx: -Math.cos(ang) * spd,
          vy: -Math.sin(ang) * spd,
          angle: ang + Math.PI,
          color: '#2ce64b'
        });
      }
      return;
    }

    // -----------------------------------------------------------------------
    // YELLOW SOUL: 긴 블록 + 작은 정사각형 블록 + 십자 폭탄(+)
    // -----------------------------------------------------------------------
    if (state.wavePattern === 'P1_YELLOW_WALLS') {
      const interval = 1.45;
      if (Math.floor(t / interval) > Math.floor(prevT / interval)) {
        spawnYellowBarrage(b, Math.floor(t / interval));
      }
      return;
    }

    // -----------------------------------------------------------------------
    // PURPLE SOUL: 3 HORIZONTAL RAILS + '!' 3x3 GRID LASER WARNINGS
    // -----------------------------------------------------------------------
    if (state.wavePattern === 'P1_PURPLE_GRID') {
      const interval = 1.2;
      if (Math.floor(t / interval) > Math.floor(prevT / interval)) {
        const idx = Math.floor(t / interval);
        if (idx % 2 === 0) {
          const col = idx % 3;
          const cellW = b.w / 3;
          addWarning(b.x + col * cellW + 8, b.y, cellW - 16, b.h, 0.65, 'GRID_BEAM', '! BEAM !');
        } else {
          const row = Math.floor(Math.random() * 3);
          const ry = b.y + b.h * (0.2 + row * 0.3) - 14;
          addWarning(b.x + b.w - 28, ry, 28, 28, 0.42, 'FLY_BONE_LEFT', '!');
        }
      }
      return;
    }

    // -----------------------------------------------------------------------
    // HYBRID_RG: RED + GREEN SHIELD + 360° COUNTER-ROTATING TWIN BLASTERS
    // -----------------------------------------------------------------------
    if (state.soul.mode === 'HYBRID_RG') {
      const interval = state.phase === 2 ? 1.15 : 0.92;
      if (Math.floor(t / interval) > Math.floor(prevT / interval)) {
        const sides = ['LEFT', 'RIGHT', 'TOP', 'BOTTOM'];
        const side = sides[Math.floor(Math.random() * sides.length)];
        const spd = 175 + state.phase * 22;
        let ax = 0, ay = 0, vx = 0, vy = 0;
        if (side === 'LEFT')   { ax = b.x - 28; ay = state.soul.y; vx = spd; vy = 0; }
        if (side === 'RIGHT')  { ax = b.x + b.w + 28; ay = state.soul.y; vx = -spd; vy = 0; }
        if (side === 'TOP')    { ax = state.soul.x; ay = b.y - 28; vx = 0; vy = spd; }
        if (side === 'BOTTOM') { ax = state.soul.x; ay = b.y + b.h + 28; vx = 0; vy = -spd; }

        state.projectiles.push({
          type: 'TRACK_ARROW',
          side,
          x: ax,
          y: ay,
          vx,
          vy,
          angle: Math.atan2(vy, vx),
          color: '#2ce64b'
        });
      }
      return;
    }

    // -----------------------------------------------------------------------
    // HYBRID_BY: BLUE GRAVITY + YELLOW SHOOTER
    // -----------------------------------------------------------------------
    if (state.soul.mode === 'HYBRID_BY') {
      const interval = 1.6;
      if (Math.floor(t / interval) > Math.floor(prevT / interval)) {
        state.walls.push({ x: b.x + 12, y: b.y + 10, w: b.w - 24, h: 20, hp: 3, vy: 46 + state.phase * 8, vx: 0, isSmallSquare: false });
        const fromRight = Math.random() < 0.5;
        addWarning(fromRight ? b.x + b.w - 28 : b.x, b.y + b.h - 26, 28, 26, 0.45, fromRight ? 'LOW_BONE_L' : 'LOW_BONE_R', '!', '#2699ff');
      }
      return;
    }

    // -----------------------------------------------------------------------
    // HYBRID_PG: PURPLE RAILS + GREEN SHIELD
    // -----------------------------------------------------------------------
    if (state.soul.mode === 'HYBRID_PG') {
      const interval = 0.95;
      if (Math.floor(t / interval) > Math.floor(prevT / interval)) {
        const idx = Math.floor(t / interval);
        if (idx % 2 === 0) {
          const fromRight = Math.random() < 0.5;
          const dist = 185;
          const spd = 215;
          state.projectiles.push({
            type: 'TRACK_ARROW',
            side: 'NONE',
            x: state.soul.x + (fromRight ? dist : -dist),
            y: state.soul.y,
            vx: (fromRight ? -1 : 1) * spd,
            vy: 0,
            angle: fromRight ? Math.PI : 0,
            color: '#2ce64b'
          });
        } else {
          const row = Math.floor(Math.random() * 3);
          const ry = b.y + b.h * (0.2 + row * 0.3) - 14;
          addWarning(b.x + b.w - 28, ry, 28, 28, 0.42, 'FLY_BONE_LEFT', '!', '#b84dff');
        }
      }
      return;
    }

    // -----------------------------------------------------------------------
    // PHASE 3 ALL SOUL ROULETTE
    // -----------------------------------------------------------------------
    const cycle = Math.floor(t / 2.6);
    const prevCycle = Math.floor(prevT / 2.6);
    if (cycle !== prevCycle) {
      const modes = ['RED', 'BLUE', 'GREEN', 'PURPLE', 'HYBRID_RG'];
      const nextMode = modes[cycle % modes.length];
      setSoulMode(nextMode);
      if (nextMode === 'BLUE') {
        triggerGravitySlam('DOWN');
      } else if (nextMode === 'GREEN') {
        for (let k = 0; k < 4; k++) {
          const ang = (k * Math.PI) / 2;
          state.projectiles.push({
            type: 'TRACK_ARROW',
            side: 'NONE',
            x: state.soul.x + Math.cos(ang) * (150 + k * 45),
            y: state.soul.y + Math.sin(ang) * (150 + k * 45),
            vx: -Math.cos(ang) * 210,
            vy: -Math.sin(ang) * 210,
            angle: ang + Math.PI,
            color: '#2ce64b'
          });
        }
      } else {
        sfx.play('warn');
        state.blasters.push({
          x: b.x + (cycle % 2 === 0 ? -42 : b.w + 42),
          y: state.soul.y,
          angle: cycle % 2 === 0 ? 0 : Math.PI,
          rotSpeed: 0,
          chargeTime: 0.68,
          timer: 0,
          active: false,
          scale: 1.0
        });
      }
    }
  }

  // =========================================================================
  // 9. PLAYER SOUL PHYSICS & COLLISIONS
  // =========================================================================
  function damagePlayer(amount = 8, krAdd = 6) {
    if (state.invuln > 0) return;
    const mult = getDamageMultiplier();
    const totalDmg = Math.round(amount * mult);
    const totalKr = Math.round(krAdd * mult);
    state.hp = Math.max(1, state.hp - totalDmg);
    state.kr = Math.min(state.hp - 1, state.kr + totalKr);
    if (state.hp <= 1 && state.kr <= 0) state.hp = 0;
    state.invuln = 0.72;
    state.screenShake = 9;
    sfx.play('hurt');
    if (state.hp <= 0) {
      state.screen = 'GAMEOVER';
    }
  }

  // 필살기 3의 소용돌이 뼈에 맞으면 현재 체력과 무관하게 체력이 무조건 1이 됨
  function dropPlayerToOneHp() {
    if (state.invuln > 0) return;
    state.hp = 1;
    state.kr = 0;
    state.invuln = 0.68;
    state.screenShake = 14;
    state.flashAlpha = 0.45;
    state.flashColor = '#ff2255';
    sfx.play('hurt');
  }

  function updateSoul(dt) {
    const s = state.soul;
    const b = state.box;
    s.prevX = s.x;
    s.prevY = s.y;

    const slow = isHeld(['ShiftLeft', 'ShiftRight', 'KeyX']);
    const spd = slow ? 115 : 225;

    let up = isHeld(['ArrowUp', 'KeyW']);
    let down = isHeld(['ArrowDown', 'KeyS']);
    let left = isHeld(['ArrowLeft', 'KeyA']);
    let right = isHeld(['ArrowRight', 'KeyD']);

    if (state.reverseControls) {
      const tmpU = up; up = down; down = tmpU;
      const tmpL = left; left = right; right = tmpL;
    }

    // 1. 순수 초록 & 쌍둥이 초록 방패: 중앙 고정 상태에서 방패 회전
    if (s.mode === 'TWIN_GREEN' || s.mode === 'GREEN') {
      if (s.mode === 'GREEN') {
        s.x = b.x + b.w / 2;
        s.y = b.y + b.h / 2;
      }
      const bUp = isHeld(['ArrowUp', 'KeyW'], 85);
      const bDown = isHeld(['ArrowDown', 'KeyS'], 85);
      const bLeft = isHeld(['ArrowLeft', 'KeyA'], 85);
      const bRight = isHeld(['ArrowRight', 'KeyD'], 85);
      let dx = (bRight ? 1 : 0) - (bLeft ? 1 : 0);
      let dy = (bDown ? 1 : 0) - (bUp ? 1 : 0);
      if (state.reverseControls) { dx = -dx; dy = -dy; }
      if (dx !== 0 || dy !== 0) {
        s.shieldAngle = Math.atan2(dy, dx);
      }
      return;
    }

    // 2. 보라 레일 & 보라+초록 혼합
    if (s.mode === 'PURPLE' || s.mode === 'HYBRID_PG') {
      if (consumePress(['ArrowUp', 'KeyW'])) {
        s.railRow = Math.max(0, Math.min(2, s.railRow + (state.reverseControls ? 1 : -1)));
        sfx.play('select');
      }
      if (consumePress(['ArrowDown', 'KeyS'])) {
        s.railRow = Math.max(0, Math.min(2, s.railRow + (state.reverseControls ? -1 : 1)));
        sfx.play('select');
      }
      if (left) {
        s.x -= spd * dt;
        if (s.mode === 'HYBRID_PG' && !slow) s.shieldAngle = Math.PI;
      }
      if (right) {
        s.x += spd * dt;
        if (s.mode === 'HYBRID_PG' && !slow) s.shieldAngle = 0;
      }
      s.x = Math.max(b.x + 14, Math.min(b.x + b.w - 14, s.x));
      s.y = b.y + b.h * (0.2 + s.railRow * 0.3);
      return;
    }

    // 3. 파랑 중력 영혼 (및 8방향 중력)
    if (s.mode === 'BLUE' || s.mode === 'HYBRID_BY') {
      const isUlt2Climb =
        (state.wavePattern === 'ULTIMATE_2' && state.ult2Phase === 'CLIMB') ||
        (state.wavePattern === 'OMNI_FINAL' && state.omniStage === 3);
      const grav = 780;
      const jumpVel = isUlt2Climb ? -360 : -335;

      if (s.gravDir === 'DOWN') {
        if (left) s.x -= spd * dt;
        if (right) s.x += spd * dt;
        if (up && s.grounded) { s.vy = jumpVel; s.grounded = false; }
        if (!up && s.vy < -110) s.vy = -110;

        const prevY = s.y;
        s.vy += grav * dt;
        s.y += s.vy * dt;

        if (s.vy >= 0 && state.platforms.length > 0) {
          for (let i = 0; i < state.platforms.length; i++) {
            const pl = state.platforms[i];
            if (
              s.x + 8 >= pl.x &&
              s.x - 8 <= pl.x + pl.w &&
              prevY + 10 <= pl.y + 5 &&
              s.y + 10 >= pl.y
            ) {
              s.y = pl.y - 10;
              s.vy = 0;
              s.grounded = true;
              if (pl.vx !== 0) s.x += pl.vx * dt;
              break;
            }
          }
        }

        const floorBound = isUlt2Climb ? state.towerBottomY - 11 : b.y + b.h - 11;
        if (s.y >= floorBound) { s.y = floorBound; s.vy = 0; s.grounded = true; }
      } else if (s.gravDir === 'UP') {
        if (left) s.x -= spd * dt;
        if (right) s.x += spd * dt;
        if (down && s.grounded) { s.vy = -jumpVel; s.grounded = false; }
        if (!down && s.vy > 110) s.vy = 110;
        s.vy -= grav * dt;
        s.y += s.vy * dt;
        if (s.y <= b.y + 11) { s.y = b.y + 11; s.vy = 0; s.grounded = true; }
      } else if (s.gravDir === 'LEFT') {
        if (up) s.y -= spd * dt;
        if (down) s.y += spd * dt;
        if (right && s.grounded) { s.vx = -jumpVel; s.grounded = false; }
        if (!right && s.vx > 110) s.vx = 110;
        s.vx -= grav * dt;
        s.x += s.vx * dt;
        if (s.x <= b.x + 11) { s.x = b.x + 11; s.vx = 0; s.grounded = true; }
      } else if (s.gravDir === 'RIGHT') {
        if (up) s.y -= spd * dt;
        if (down) s.y += spd * dt;
        if (left && s.grounded) { s.vx = jumpVel; s.grounded = false; }
        if (!left && s.vx < -110) s.vx = -110;
        s.vx += grav * dt;
        s.x += s.vx * dt;
        if (s.x >= b.x + b.w - 11) { s.x = b.x + b.w - 11; s.vx = 0; s.grounded = true; }
      } else if (s.gravDir === 'DOWN_LEFT') {
        if (up || right) { s.x += spd * 0.7 * dt; s.y -= spd * 0.7 * dt; }
        if (down || left) { s.x -= spd * 0.7 * dt; s.y += spd * 0.7 * dt; }
        s.vx -= 520 * dt; s.vy += 520 * dt;
        s.x += s.vx * dt; s.y += s.vy * dt;
        if (s.x <= b.x + 11) { s.x = b.x + 11; s.vx = 0; }
        if (s.y >= b.y + b.h - 11) { s.y = b.y + b.h - 11; s.vy = 0; }
      } else if (s.gravDir === 'DOWN_RIGHT') {
        if (up || left) { s.x -= spd * 0.7 * dt; s.y -= spd * 0.7 * dt; }
        if (down || right) { s.x += spd * 0.7 * dt; s.y += spd * 0.7 * dt; }
        s.vx += 520 * dt; s.vy += 520 * dt;
        s.x += s.vx * dt; s.y += s.vy * dt;
        if (s.x >= b.x + b.w - 11) { s.x = b.x + b.w - 11; s.vx = 0; }
        if (s.y >= b.y + b.h - 11) { s.y = b.y + b.h - 11; s.vy = 0; }
      } else if (s.gravDir === 'UP_LEFT') {
        if (down || right) { s.x += spd * 0.7 * dt; s.y += spd * 0.7 * dt; }
        if (up || left) { s.x -= spd * 0.7 * dt; s.y -= spd * 0.7 * dt; }
        s.vx -= 520 * dt; s.vy -= 520 * dt;
        s.x += s.vx * dt; s.y += s.vy * dt;
        if (s.x <= b.x + 11) { s.x = b.x + 11; s.vx = 0; }
        if (s.y <= b.y + 11) { s.y = b.y + 11; s.vy = 0; }
      } else if (s.gravDir === 'UP_RIGHT') {
        if (down || left) { s.x -= spd * 0.7 * dt; s.y += spd * 0.7 * dt; }
        if (up || right) { s.x += spd * 0.7 * dt; s.y -= spd * 0.7 * dt; }
        s.vx += 520 * dt; s.vy -= 520 * dt;
        s.x += s.vx * dt; s.y += s.vy * dt;
        if (s.x >= b.x + b.w - 11) { s.x = b.x + b.w - 11; s.vx = 0; }
        if (s.y <= b.y + 11) { s.y = b.y + 11; s.vy = 0; }
      }

      s.x = Math.max(b.x + 11, Math.min(b.x + b.w - 11, s.x));
      const topBound = isUlt2Climb ? 68 : b.y + 11;
      const botBound = isUlt2Climb ? state.towerBottomY - 11 : b.y + b.h - 11;
      s.y = Math.max(topBound, Math.min(botBound, s.y));
      s.speed = Math.hypot(s.x - s.prevX, s.y - s.prevY) / Math.max(0.001, dt);

      if (s.mode === 'HYBRID_BY') handleShooterFire(dt);
      return;
    }

    // 4. 자유 8방향 이동 (RED / YELLOW / HYBRID_RG / ULT3_VOID / OMNI_FINAL)
    let dx = (right ? 1 : 0) - (left ? 1 : 0);
    let dy = (down ? 1 : 0) - (up ? 1 : 0);
    if (dx !== 0 && dy !== 0) {
      dx *= 0.7071;
      dy *= 0.7071;
    }
    s.x += dx * spd * dt;
    s.y += dy * spd * dt;
    s.x = Math.max(b.x + 11, Math.min(b.x + b.w - 11, s.x));
    s.y = Math.max(b.y + 11, Math.min(b.y + b.h - 11, s.y));
    s.speed = Math.hypot(s.x - s.prevX, s.y - s.prevY) / Math.max(0.001, dt);

    if (s.mode === 'HYBRID_RG' && !slow && (dx !== 0 || dy !== 0)) {
      s.shieldAngle = Math.atan2(dy, dx);
    }
    if (s.mode === 'YELLOW') {
      handleShooterFire(dt);
    }
  }

  function handleShooterFire(dt) {
    const s = state.soul;
    s.shootCooldown = Math.max(0, s.shootCooldown - dt);
    if (isHeld(['KeyZ', 'Enter', 'Space']) && s.shootCooldown <= 0) {
      s.shootCooldown = 0.16;
      sfx.play('shoot');
      state.projectiles.push({ type: 'PLAYER_SHOT', x: s.x, y: s.y - 12, vx: 0, vy: -560 });
    }
  }

  function angleDiff(a, b) {
    let d = a - b;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return Math.abs(d);
  }

  function updateEntities(dt) {
    const s = state.soul;
    const b = state.box;

    // '!' 경고 처리
    for (let i = state.warnings.length - 1; i >= 0; i--) {
      const w = state.warnings[i];
      w.timer -= dt;
      if (w.timer <= 0) {
        if (w.spawnType === 'WALL_BONES') {
          sfx.play('slam');
          state.projectiles.push({ type: 'BONE', x: w.x, y: w.y, w: w.w, h: w.h, vx: 0, vy: 0, life: 0.45, color: w.boneColor });
        } else if (w.spawnType === 'LOW_BONE_L' || w.spawnType === 'LOW_BONE_R') {
          const dir = w.spawnType === 'LOW_BONE_L' ? -1 : 1;
          state.projectiles.push({
            type: 'BONE',
            x: dir === -1 ? b.x + b.w : b.x - 14,
            y: b.y + b.h - 26,
            w: 14,
            h: 26,
            vx: dir * (190 + state.phase * 25),
            vy: 0,
            color: w.boneColor
          });
        } else if (w.spawnType === 'TRAP_BONE_L' || w.spawnType === 'TRAP_BONE_R') {
          const dir = w.spawnType === 'TRAP_BONE_L' ? -1 : 1;
          state.projectiles.push({
            type: 'BONE',
            x: dir === -1 ? b.x + b.w + 14 : b.x - 32,
            y: b.y,
            w: 18,
            h: b.h - 68,
            vx: dir * (190 + state.phase * 25),
            vy: 0,
            color: w.boneColor
          });
        } else if (w.spawnType === 'FLY_BONE_LEFT') {
          state.projectiles.push({
            type: 'BONE',
            x: b.x + b.w + 10,
            y: w.y,
            w: 14,
            h: 28,
            vx: -265,
            vy: 0,
            color: w.boneColor
          });
        } else if (w.spawnType === 'GRID_BEAM') {
          sfx.play('blasterFire');
          state.projectiles.push({ type: 'BEAM_RECT', x: w.x, y: w.y, w: w.w, h: w.h, life: 0.28, color: '#b84dff' });
        }
        state.warnings.splice(i, 1);
      }
    }

    // 노랑 영혼 블록 (긴 가로 블록 + 작은 정사각형 블록)
    for (let i = state.walls.length - 1; i >= 0; i--) {
      const wl = state.walls[i];
      wl.y += wl.vy * dt;
      if (wl.vx) {
        wl.x += wl.vx * dt;
        if (wl.x <= b.x + 8) { wl.x = b.x + 8; wl.vx = Math.abs(wl.vx); }
        else if (wl.x + wl.w >= b.x + b.w - 8) { wl.x = b.x + b.w - 8 - wl.w; wl.vx = -Math.abs(wl.vx); }
      }
      if (s.x + 6 > wl.x && s.x - 6 < wl.x + wl.w && Math.abs(s.y - (wl.y + wl.h / 2)) < wl.h / 2 + 7) {
        damagePlayer(9, 6);
        if (wl.isSmallSquare) {
          state.walls.splice(i, 1);
          continue;
        }
      }
      if (wl.y > b.y + b.h + 20) state.walls.splice(i, 1);
    }

    // 노랑 영혼 십자 폭탄(+) 업데이트
    for (let i = state.crossBombs.length - 1; i >= 0; i--) {
      const cb = state.crossBombs[i];
      cb.y += cb.vy * dt;
      cb.fuse -= dt;
      if (Math.hypot(s.x - cb.x, s.y - cb.y) < cb.r + 8) {
        detonateCrossBomb(cb);
        damagePlayer(9, 6);
        state.crossBombs.splice(i, 1);
        continue;
      }
      if (cb.fuse <= 0 || cb.y >= b.y + b.h - 14) {
        detonateCrossBomb(cb);
        state.crossBombs.splice(i, 1);
      }
    }

    // 십자 폭탄 레이저 충격파
    for (let i = state.shockwaves.length - 1; i >= 0; i--) {
      const sw = state.shockwaves[i];
      sw.life -= dt;
      if (sw.life > sw.maxLife * 0.35) {
        const hitH = Math.abs(s.y - sw.y) < sw.thickness * 0.45;
        const hitV = Math.abs(s.x - sw.x) < sw.thickness * 0.45;
        if (hitH || hitV) {
          damagePlayer(8, 5);
        }
      }
      if (sw.life <= 0) state.shockwaves.splice(i, 1);
    }

    // 가스터 블래스터
    for (let i = state.blasters.length - 1; i >= 0; i--) {
      const gb = state.blasters[i];
      gb.timer += dt;
      const beamScale = gb.scale || 1;
      if (gb.centerSpinner) {
        gb.x = b.x + b.w / 2 + (gb.offsetX || 0);
        gb.y = b.y + b.h / 2;
        if (gb.timer >= gb.chargeTime) {
          if (!gb.active) {
            gb.active = true;
            sfx.play('blasterFire');
          }
          gb.angle += gb.rotSpeed * dt;
        }
        if (gb.active && s.mode === 'HYBRID_RG') {
          const dx = s.x - gb.x;
          const dy = s.y - gb.y;
          const dist = Math.hypot(dx, dy);
          if (dist > 14) {
            const beamAng = Math.atan2(dy, dx);
            const perpDist = Math.abs(Math.sin(beamAng - gb.angle)) * dist;
            const forwardDot = Math.cos(beamAng - gb.angle) * dist;
            if (forwardDot > 0 && perpDist < 10 * beamScale) damagePlayer(8, 6);
          }
        }
      } else {
        if (gb.timer >= gb.chargeTime && !gb.active) {
          gb.active = true;
          sfx.play('blasterFire');
        }
        if (gb.active) {
          const dx = s.x - gb.x;
          const dy = s.y - gb.y;
          const dist = Math.hypot(dx, dy);
          const beamAng = Math.atan2(dy, dx);
          const perpDist = Math.abs(Math.sin(beamAng - gb.angle)) * dist;
          const forwardDot = Math.cos(beamAng - gb.angle) * dist;
          if (forwardDot > 0 && perpDist < 13 * beamScale) {
            const dmgVal = gb.doubleDmg ? 20 : 10;
            const krVal = gb.doubleDmg ? 14 : 7;
            damagePlayer(dmgVal, krVal);
          }
        }
        if (gb.timer > gb.chargeTime + 0.55) {
          state.blasters.splice(i, 1);
        }
      }
    }

    // 투사체 업데이트
    for (let i = state.projectiles.length - 1; i >= 0; i--) {
      const p = state.projectiles[i];
      if (p.life !== undefined) {
        p.life -= dt;
        if (p.life <= 0) {
          state.projectiles.splice(i, 1);
          continue;
        }
      }

      if (p.type === 'PLAYER_SHOT') {
        p.y += p.vy * dt;
        let hitTarget = false;
        for (let j = state.walls.length - 1; j >= 0; j--) {
          const wl = state.walls[j];
          if (p.x > wl.x && p.x < wl.x + wl.w && p.y < wl.y + wl.h && p.y > wl.y) {
            wl.hp--;
            hitTarget = true;
            if (wl.hp <= 0) {
              state.walls.splice(j, 1);
              sfx.play('break');
            } else {
              sfx.play('clang');
            }
            break;
          }
        }
        if (!hitTarget) {
          for (let j = state.crossBombs.length - 1; j >= 0; j--) {
            const cb = state.crossBombs[j];
            if (Math.hypot(p.x - cb.x, p.y - cb.y) < cb.r + 7) {
              hitTarget = true;
              detonateCrossBomb(cb);
              state.crossBombs.splice(j, 1);
              break;
            }
          }
        }
        if (hitTarget || p.y < b.y - 20) state.projectiles.splice(i, 1);
        continue;
      }

      // 필살기 3 & 종합필살기: 중앙으로 흡수되는 소용돌이 뼈 (맞으면 체력 무조건 1!)
      if (p.type === 'ABSORB_BONE') {
        p.radius -= p.radialSpeed * dt;
        p.angle += p.angularSpeed * dt;
        p.x = p.cx + Math.cos(p.angle) * p.radius;
        p.y = p.cy + Math.sin(p.angle) * p.radius;

        if (Math.hypot(s.x - p.x, s.y - p.y) < 13) {
          dropPlayerToOneHp();
          state.projectiles.splice(i, 1);
          continue;
        }
        if (p.radius <= 14) {
          state.projectiles.splice(i, 1);
          continue;
        }
        continue;
      }

      if (p.type === 'TRACK_ARROW' && s.mode === 'HYBRID_RG') {
        if (p.side === 'LEFT' || p.side === 'RIGHT') p.y += (s.y - p.y) * Math.min(1, dt * 7.5);
        else if (p.side === 'TOP' || p.side === 'BOTTOM') p.x += (s.x - p.x) * Math.min(1, dt * 7.5);
      }

      p.x += (p.vx || 0) * dt;
      p.y += (p.vy || 0) * dt;

      if (p.type === 'TWIN_ARROW' && s.mode === 'TWIN_GREEN') {
        const target = p.targetSoul === 'L' ? s.twinL : s.twinR;
        const dist = Math.hypot(p.x - target.x, p.y - target.y);
        const incomingAngle = Math.atan2(p.y - target.y, p.x - target.x);
        if (dist <= 27 && dist >= 14 && angleDiff(incomingAngle, s.shieldAngle) <= 0.88) {
          sfx.play('clang');
          state.projectiles.splice(i, 1);
          continue;
        }
        if (dist < 11) {
          damagePlayer(9, 6);
          state.projectiles.splice(i, 1);
          continue;
        }
      }

      if (p.type === 'TRACK_ARROW' && (s.mode === 'HYBRID_RG' || s.mode === 'HYBRID_PG' || s.mode === 'GREEN')) {
        const dist = Math.hypot(p.x - s.x, p.y - s.y);
        const incomingAngle = Math.atan2(p.y - s.y, p.x - s.x);
        if (dist <= 27 && dist >= 14 && angleDiff(incomingAngle, s.shieldAngle) <= 0.92) {
          sfx.play('clang');
          state.projectiles.splice(i, 1);
          continue;
        }
        if (dist < 10) {
          damagePlayer(8, 6);
          state.projectiles.splice(i, 1);
          continue;
        }
      }

      if (p.type === 'BONE' || p.type === 'BEAM_RECT') {
        const isUlt2Climb =
          (state.wavePattern === 'ULTIMATE_2' && state.ult2Phase === 'CLIMB') ||
          (state.wavePattern === 'OMNI_FINAL' && state.omniStage === 3);
        const halfR = 5;
        if (s.x + halfR > p.x && s.x - halfR < p.x + p.w && s.y + halfR > p.y && s.y - halfR < p.y + p.h) {
          damagePlayer(8, 6);
        }
        if (!isUlt2Climb && (p.x < b.x - 140 || p.x > b.x + b.w + 140 || p.y < b.y - 140 || p.y > b.y + b.h + 140)) {
          state.projectiles.splice(i, 1);
        }
      }
    }
  }

  // =========================================================================
  // 10. MAIN UPDATE LOOP
  // =========================================================================
  function update(dt) {
    sfx.updateBgm(
      dt,
      state.screen !== 'TITLE' && state.screen !== 'GAMEOVER' && state.screen !== 'VICTORY',
      state.phase,
      state.ultimateStage
    );

    const sans = state.sans;
    sans.x += (sans.targetX - sans.x) * Math.min(1, dt * 8);
    if (sans.dodgeTimer > 0) {
      sans.dodgeTimer = Math.max(0, sans.dodgeTimer - dt);
      sans.dodgeOffset = Math.sin((1 - sans.dodgeTimer / 0.55) * Math.PI) * -95;
    } else {
      sans.dodgeOffset = 0;
    }
    if (sans.shake > 0) {
      sans.shake = Math.max(0, sans.shake - dt * 32);
      if (sans.shake < 0.2) sans.shake = 0;
    }
    if (sans.poseTimer > 0) {
      sans.poseTimer = Math.max(0, sans.poseTimer - dt);
      if (sans.poseTimer <= 0 && !state.soul.twinSplit) sans.pose = 'IDLE';
    }

    const b = state.box;
    b.x += (b.tx - b.x) * Math.min(1, dt * 12);
    b.y += (b.ty - b.y) * Math.min(1, dt * 12);
    b.w += (b.tw - b.w) * Math.min(1, dt * 12);
    b.h += (b.th - b.h) * Math.min(1, dt * 12);

    state.bossDisplayHp += (state.bossHp - state.bossDisplayHp) * Math.min(1, dt * 8);
    if (state.screenShake > 0) state.screenShake = Math.max(0, state.screenShake - dt * 32);
    if (state.flashAlpha > 0) state.flashAlpha = Math.max(0, state.flashAlpha - dt * 2.2);
    if (state.invuln > 0) state.invuln = Math.max(0, state.invuln - dt);

    if (state.dmgPopup) {
      state.dmgPopup.timer -= dt;
      state.dmgPopup.y -= 26 * dt;
      if (state.dmgPopup.timer <= 0) state.dmgPopup = null;
    }

    if (state.kr > 0 && state.screen === 'DODGE') {
      state.krTimer += dt;
      if (state.krTimer >= 0.42) {
        state.krTimer = 0;
        state.kr -= 1;
        if (state.hp > 1) state.hp -= 1;
      }
    }

    if (state.screen === 'TITLE') {
      if (consumePress(['Digit1', 'KeyZ', 'Enter', 'Space'])) startNewGame(false);
      else if (consumePress(['Digit2'])) startNewGame(true);
      return;
    }

    if (state.screen === 'PHASE_TRANSITION') {
      state.phaseAnimTimer += dt;
      const pct = Math.min(1, state.phaseAnimTimer / 1.5);
      state.bossHp = Math.round(state.bossMaxHp * pct);
      if (state.phaseAnimTimer >= 1.8) {
        const curMax = state.bossMaxHp;
        const msg = state.phase === 2
          ? `* PHASE 2: [ONE FRAME LEFT]\n* 체력이 ${curMax} HP까지 완전히 재충전되었다! 혼합 영혼을 맛보아라.`
          : `* PHASE 3: [THE KING'S LAST GAMBIT]\n* 6개의 영혼이 해방되며 체력이 ${curMax} HP까지 완전히 재충전되었다!`;
        startDialogue(msg, () => beginBossTurn(0));
      }
      return;
    }

    if (state.screen === 'DIALOGUE') {
      state.dialogueTimer += dt;
      if (state.dialogueTimer >= 0.022) {
        state.dialogueTimer = 0;
        if (state.dialogueShown < state.dialogueFull.length) {
          state.dialogueShown++;
          if (state.dialogueShown % 3 === 0) sfx.play('voice');
        }
      }
      if (consumePress(['KeyZ', 'Enter', 'Space'])) {
        if (state.dialogueShown < state.dialogueFull.length) {
          state.dialogueShown = state.dialogueFull.length;
        } else if (state.afterDialogue) {
          const fn = state.afterDialogue;
          state.afterDialogue = null;
          fn();
        }
      }
      return;
    }

    if (state.screen === 'MENU') {
      if (!state.subMenuOpen) {
        if (consumePress(['ArrowLeft', 'KeyA'])) { state.menuIdx = (state.menuIdx + 3) % 4; sfx.play('select'); }
        if (consumePress(['ArrowRight', 'KeyD'])) { state.menuIdx = (state.menuIdx + 1) % 4; sfx.play('select'); }
        if (consumePress(['KeyZ', 'Enter', 'Space'])) {
          sfx.play('confirm');
          if (state.menuIdx === 0) {
            startPlayerAttack();
          } else if (state.menuIdx === 1) {
            state.subMenuOpen = true;
            state.subIdx = 0;
          } else if (state.menuIdx === 2) {
            if (state.items.length > 0) {
              state.subMenuOpen = true;
              state.subIdx = 0;
            }
          } else if (state.menuIdx === 3) {
            startDialogue('* 샌즈는 자비를 거부했다.\n* "지금 자비를 베풀면 넌 바로 끝장날 텐데?"', () => beginBossTurn(0));
          }
        }
      } else {
        const list = state.menuIdx === 1 ? state.actOptions : state.items;
        if (consumePress(['ArrowUp', 'KeyW'])) { state.subIdx = (state.subIdx + list.length - 1) % list.length; sfx.play('select'); }
        if (consumePress(['ArrowDown', 'KeyS'])) { state.subIdx = (state.subIdx + 1) % list.length; sfx.play('select'); }
        if (consumePress(['KeyX', 'Escape'])) { state.subMenuOpen = false; sfx.play('select'); }
        if (consumePress(['KeyZ', 'Enter', 'Space'])) {
          sfx.play('confirm');
          state.subMenuOpen = false;
          if (state.menuIdx === 1) {
            const act = state.actOptions[state.subIdx];
            if (state.subIdx === 1) {
              if (state.ult3Survived && !state.omniSurvived) {
                state.provoked = true;
                state.sans.sweat = 1;
                startDialogue(act.text, () => beginBossTurn(4));
              } else if (state.ult1Survived && !state.ult2Survived) {
                state.provoked = true;
                state.sans.sweat = 1;
                startDialogue(
                  '* 당신은 숨을 헐떡이는 샌즈를 끝까지 도발했다!\n* "...좋아. 내 비장의 수, 두 번째 필살기를 보여주지!"',
                  () => beginBossTurn(2)
                );
              } else {
                state.provoked = true;
                state.sans.sweat = 1;
                startDialogue(act.text, () => beginBossTurn(0));
              }
            } else if (state.subIdx === 2) {
              state.kr = 0;
              state.hp = Math.min(state.maxHp, state.hp + 15);
              sfx.play('heal');
              startDialogue(act.text, () => beginBossTurn(0));
            } else {
              startDialogue(act.text, () => beginBossTurn(0));
            }
          } else if (state.menuIdx === 2) {
            const it = state.items.splice(state.subIdx, 1)[0];
            state.hp = Math.min(state.maxHp, state.hp + it.heal);
            sfx.play('heal');
            startDialogue(`* ${it.name}을(를) 먹었다!\n* ${it.desc}`, () => beginBossTurn(0));
          }
        }
      }
      return;
    }

    if (state.screen === 'ATTACK_BAR') {
      state.atkBarX += state.atkBarDir * 520 * dt;
      if (state.atkBarX >= b.x + b.w - 16) {
        state.atkBarX = b.x + b.w - 16;
        state.atkBarDir = -1;
      } else if (state.atkBarX <= b.x + 16) {
        state.atkBarX = b.x + 16;
        state.atkBarDir = 1;
      }
      if (consumePress(['KeyZ', 'Enter', 'Space'])) {
        resolvePlayerAttack();
      }
      return;
    }

    if (state.screen === 'DODGE') {
      updateWaveSpawns(dt);
      updateSoul(dt);
      updateEntities(dt);

      if (state.waveTimer >= state.waveDuration) {
        clearEntities();
        state.soul.twinSplit = false;
        state.reverseControls = false;
        state.fakeCeiling = null;
        state.sans.pose = 'IDLE';
        state.sans.targetX = 400;

        if (state.ultimateStage === 1 && !state.ult1Survived) {
          state.ult1Survived = true;
          state.ultimateStage = 0;
          startDialogue(
            '* 헉... 헉... 쌍둥이 8방향 방패 필살기를 버텨냈다고?!\n* (샌즈가 거친 숨을 몰아쉰다. [행동 -> 도발하기]로 끝까지 몰아붙이자!)',
            () => openMenu()
          );
          return;
        }

        if (state.ultimateStage === 2 && !state.ult2Survived) {
          state.ult2Survived = true;
          state.ultimateStage = 0;
          state.provoked = true;
          startDialogue(
            '* 말도 안 돼... 16층 타워와 블래스터 연사까지 전부 피하다니...\n* (샌즈의 방어가 무너졌다! 지금 [전투]를 선택해 일격을 날리자!)',
            () => openMenu()
          );
          return;
        }

        if (state.ultimateStage === 3 && !state.ult3Survived) {
          state.ult3Survived = true;
          state.ultimateStage = 0;
          startDialogue(
            '* 허억... 허억... 전체 화면 영혼 흡수와 12방향 2배 블래스터까지 버텨내다니...\n* (샌즈가 무릎을 꿇었다. [행동 -> * X도발하기]로 최후의 결판을 내자!)',
            () => openMenu()
          );
          return;
        }

        if (state.ultimateStage === 4 && !state.omniSurvived) {
          state.omniSurvived = true;
          state.ultimateStage = 0;
          state.exhausted = true;
          state.provoked = true;
          startDialogue(
            '* ...끝이야... 내 모든 필살기를 합친 종합필살기마저 돌파했어...\n* 더 이상 피할 힘이 없어... 이제 네 [전투] 일격이 닿을 거다.',
            () => openMenu()
          );
          return;
        }

        const tip = state.provoked
          ? '* 샌즈가 분노로 흔들리고 있다! 지금 [전투]를 선택하면 공격이 적중한다!'
          : '* 샌즈의 눈 색깔과 ! 경고 표시를 주시하며 버텨내자.';
        startDialogue(tip, () => openMenu());
      }
      return;
    }

    if (state.screen === 'GAMEOVER' || state.screen === 'VICTORY') {
      if (consumePress(['KeyZ', 'Enter', 'Space', 'KeyR'])) {
        state.screen = 'TITLE';
      }
    }
  }

  // =========================================================================
  // 11. RENDERING (800 x 680 CANVAS)
  // =========================================================================
  function renderBossHud() {
    const barW = 440;
    const barH = 16;
    const bx = (W - barW) / 2;
    const by = 14;
    const track = BGM_TRACKS[state.phase] || BGM_TRACKS[1];

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 12px Courier New, monospace';
    ctx.textAlign = 'left';
    const ultNames = {
      1: 'FINAL ULTIMATE 1: TWIN SOUL OVERDRIVE',
      2: 'FINAL ULTIMATE 2: 16F TOWER & BLASTER',
      3: 'FINAL ULTIMATE 3: FULLSCREEN SOUL VORTEX',
      4: 'OMNI FINAL: ALL ULTIMATES COMBINED'
    };
    const enhPrefix = state.enhancedMode ? '[강화 2X] ' : '';
    const label = state.ultimateStage > 0
      ? ultNames[state.ultimateStage]
      : `${enhPrefix}PHASE ${state.phase}/3 — ${track.name}`;
    ctx.fillText(label, bx, by - 2);

    ctx.textAlign = 'right';
    ctx.fillText(`${Math.max(0, Math.round(state.bossDisplayHp))} / ${state.bossMaxHp} HP`, bx + barW, by - 2);
    ctx.textAlign = 'left';

    ctx.fillStyle = '#22080c';
    ctx.fillRect(bx, by + 3, barW, barH);
    const ratio = Math.max(0, Math.min(1, state.bossDisplayHp / state.bossMaxHp));
    ctx.fillStyle = state.ultimateStage > 0
      ? '#ff3388'
      : (state.phase === 3 ? '#ff2a2a' : (state.phase === 2 ? '#ff8800' : '#ffe629'));
    ctx.fillRect(bx, by + 3, barW * ratio, barH);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.strokeRect(bx, by + 3, barW, barH);

    if (state.exhausted) {
      ctx.fillStyle = '#2ce64b';
      ctx.fillRect(bx + barW + 10, by + 1, 148, 20);
      ctx.fillStyle = '#000000';
      ctx.font = 'bold 11px Malgun Gothic, monospace';
      ctx.fillText('★ 탈진 상태: 마무리 일격!', bx + barW + 15, by + 15);
    } else if (state.provoked) {
      ctx.fillStyle = '#ff2a2a';
      ctx.fillRect(bx + barW + 10, by + 1, 148, 20);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 11px Malgun Gothic, monospace';
      ctx.fillText('★ 도발됨: 다음 1턴 적중!', bx + barW + 15, by + 15);
    }
  }

  function renderArenaAndSoul() {
    const b = state.box;
    const s = state.soul;
    const meta = SOUL_META[s.mode] || SOUL_META.RED;

    // 1. 전투 상자 테두리 및 배경
    ctx.fillStyle = (state.ultimateStage === 3 || (state.ultimateStage === 4 && state.omniStage === 4))
      ? 'rgba(0, 0, 0, 0.72)'
      : '#000000';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = state.screen === 'DODGE' ? meta.color : '#ffffff';
    ctx.lineWidth = 4;
    ctx.strokeRect(b.x, b.y, b.w, b.h);

    // 필살기 3 & 종합필살기 5단계: 전체 화면 상자 위로 샌즈 스프라이트가 중앙에 선명히 나타나도록 렌더링
    if (
      state.screen === 'DODGE' &&
      (state.ultimateStage === 3 || (state.ultimateStage === 4 && state.omniStage === 4))
    ) {
      drawSans();
    }

    if (state.screen !== 'DODGE') return;

    ctx.fillStyle = meta.color;
    ctx.font = 'bold 13px Malgun Gothic, monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`[${meta.name}] ${state.subPhaseLabel}`, W / 2, b.y - 10);
    ctx.textAlign = 'left';

    const isUlt2Climb =
      (state.wavePattern === 'ULTIMATE_2' && state.ult2Phase === 'CLIMB') ||
      (state.wavePattern === 'OMNI_FINAL' && state.omniStage === 3);
    const camOffset = isUlt2Climb ? state.cameraY : 0;

    // 필살기 2 / 종합필살기 타워 등반 렌더링
    if (isUlt2Climb) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(b.x + 2, b.y + 2, b.w - 4, b.h - 4);
      ctx.clip();

      const goalScreenY = 58 - camOffset;
      if (goalScreenY + 42 >= b.y) {
        ctx.fillStyle = 'rgba(44, 230, 75, 0.24)';
        ctx.fillRect(b.x + 4, goalScreenY, b.w - 8, 40);
        ctx.strokeStyle = '#2ce64b';
        ctx.setLineDash([6, 4]);
        ctx.beginPath();
        ctx.moveTo(b.x + 4, goalScreenY + 40);
        ctx.lineTo(b.x + b.w - 4, goalScreenY + 40);
        ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = '#2ce64b';
        ctx.font = 'bold 13px Courier New, monospace';
        ctx.textAlign = 'center';
        ctx.fillText('▲ TOP GOAL ▲', b.x + b.w / 2, goalScreenY + 25);
        ctx.textAlign = 'left';
      }

      for (let i = 0; i < state.platforms.length; i++) {
        const pl = state.platforms[i];
        const py = pl.y - camOffset;
        if (py < b.y - 20 || py > b.y + b.h + 20) continue;
        ctx.fillStyle = pl.vx !== 0 ? '#55ffff' : '#ffffff';
        ctx.fillRect(pl.x, py, pl.w, pl.h);
        ctx.fillStyle = '#003344';
        ctx.fillRect(pl.x + 2, py + pl.h - 3, pl.w - 4, 3);
      }

      const boneTop = Math.max(b.y + 42, state.risingBoneY - camOffset);
      const boneBottom = b.y + b.h - 2;
      if (boneTop < boneBottom) {
        for (let bx = b.x + 6; bx < b.x + b.w - 8; bx += 18) {
          drawBone(bx, boneTop, 14, boneBottom - boneTop, '#ffffff');
        }
      }
      ctx.restore();

      const gaugeX = b.x + b.w + 14;
      const gaugeY = b.y + 10;
      const gaugeH = b.h - 20;
      const climbPct = Math.max(0, Math.min(1, (1166 - s.y) / (1166 - 106)));
      const bonePct = Math.max(0, Math.min(1, (1224 - state.risingBoneY) / (1166 - 106)));

      ctx.fillStyle = '#11111a';
      ctx.fillRect(gaugeX, gaugeY, 12, gaugeH);
      ctx.strokeStyle = '#777788';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(gaugeX, gaugeY, 12, gaugeH);

      ctx.fillStyle = 'rgba(255, 42, 42, 0.55)';
      ctx.fillRect(gaugeX + 1, gaugeY + gaugeH * (1 - bonePct), 10, gaugeH * bonePct);

      ctx.fillStyle = '#2699ff';
      ctx.fillRect(gaugeX - 2, gaugeY + gaugeH * (1 - climbPct) - 3, 16, 6);

      ctx.fillStyle = '#55ffff';
      ctx.font = 'bold 12px Malgun Gothic, monospace';
      ctx.fillText(`고도 ${Math.round(climbPct * 100)}%`, gaugeX + 18, gaugeY + gaugeH * (1 - climbPct) + 4);
    }

    // 페이크 천장 낙하 렌더링 (종합필살기)
    if (state.fakeCeiling) {
      const fc = state.fakeCeiling;
      ctx.fillStyle = fc.fallen ? '#ff2a2a' : 'rgba(255, 42, 42, 0.35)';
      ctx.fillRect(b.x + 4, fc.y, b.w - 8, 22);
      ctx.strokeStyle = '#ffe629';
      ctx.lineWidth = 2;
      ctx.strokeRect(b.x + 4, fc.y, b.w - 8, 22);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 12px Courier New, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(fc.fallen ? '▼ FAKE CEILING DROP! ▼' : '! CEILING WARNING !', b.x + b.w / 2, fc.y + 15);
      ctx.textAlign = 'left';
    }

    // 보라 3줄 거미줄 레일
    if (s.mode === 'PURPLE' || s.mode === 'HYBRID_PG') {
      ctx.strokeStyle = '#9933dd';
      ctx.lineWidth = 2;
      for (let r = 0; r < 3; r++) {
        const ry = b.y + b.h * (0.2 + r * 0.3);
        ctx.beginPath();
        ctx.moveTo(b.x + 8, ry);
        ctx.lineTo(b.x + b.w - 8, ry);
        ctx.stroke();
      }
    }

    // '!' 경고 표시
    for (let i = 0; i < state.warnings.length; i++) {
      const w = state.warnings[i];
      const flash = Math.floor(w.timer * 24) % 2 === 0;
      ctx.fillStyle = flash ? 'rgba(255, 42, 42, 0.32)' : 'rgba(255, 230, 41, 0.25)';
      ctx.fillRect(w.x, w.y, w.w, w.h);
      ctx.strokeStyle = flash ? '#ff2a2a' : '#ffe629';
      ctx.lineWidth = 2;
      ctx.strokeRect(w.x, w.y, w.w, w.h);

      ctx.fillStyle = flash ? '#ffe629' : '#ff2a2a';
      ctx.font = 'bold 16px Courier New, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(w.label, w.x + w.w / 2, w.y + w.h / 2 + 6);
      ctx.textAlign = 'left';
    }

    // 노랑 영혼 블록 (긴 가로 블록 + 작은 정사각형 블록)
    for (let i = 0; i < state.walls.length; i++) {
      const wl = state.walls[i];
      if (wl.isSmallSquare) {
        ctx.fillStyle = '#ffaa22';
        ctx.fillRect(wl.x, wl.y, wl.w, wl.h);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.strokeRect(wl.x, wl.y, wl.w, wl.h);
      } else {
        ctx.fillStyle = '#ffe629';
        ctx.fillRect(wl.x, wl.y, wl.w, wl.h);
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 2;
        ctx.strokeRect(wl.x, wl.y, wl.w, wl.h);
        ctx.fillStyle = '#000000';
        ctx.font = 'bold 11px monospace';
        ctx.fillText(`HP:${wl.hp}`, wl.x + wl.w / 2 - 14, wl.y + 14);
      }
    }

    // 십자 폭탄(+) 렌더링
    for (let i = 0; i < state.crossBombs.length; i++) {
      const cb = state.crossBombs[i];
      const flash = Math.floor(cb.fuse * 14) % 2 === 0;
      ctx.save();
      ctx.translate(cb.x, cb.y);
      ctx.fillStyle = flash ? '#ff3344' : '#222233';
      ctx.strokeStyle = '#ffe629';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, cb.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // 십자(+) 마크
      ctx.fillStyle = '#ffe629';
      ctx.fillRect(-7, -2, 14, 4);
      ctx.fillRect(-2, -7, 4, 14);
      ctx.restore();
    }

    // 십자 폭탄(+) 레이저 충격파 렌더링
    for (let i = 0; i < state.shockwaves.length; i++) {
      const sw = state.shockwaves[i];
      const alpha = Math.max(0, sw.life / sw.maxLife);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = '#ffe629';
      ctx.shadowColor = '#ff3344';
      ctx.shadowBlur = 16;
      ctx.fillRect(sw.boxX + 4, sw.y - sw.thickness / 2, sw.boxW - 8, sw.thickness);
      ctx.fillRect(sw.x - sw.thickness / 2, sw.boxY + 4, sw.thickness, sw.boxH - 8);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(sw.boxX + 4, sw.y - sw.thickness / 4, sw.boxW - 8, sw.thickness / 2);
      ctx.fillRect(sw.x - sw.thickness / 4, sw.boxY + 4, sw.thickness / 2, sw.boxH - 8);
      ctx.restore();
    }

    // 투사체
    for (let i = 0; i < state.projectiles.length; i++) {
      const p = state.projectiles[i];
      const py = p.y - camOffset;
      if (p.type === 'BONE') {
        drawBone(p.x, py, p.w, p.h, p.color || '#ffffff');
      } else if (p.type === 'ABSORB_BONE') {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.angle + Math.PI / 2);
        drawBone(-6, -15, 12, 30, p.color || '#ffffff');
        ctx.restore();
      } else if (p.type === 'BEAM_RECT') {
        ctx.fillStyle = p.color || '#b84dff';
        ctx.fillRect(p.x, py, p.w, p.h);
      } else if (p.type === 'PLAYER_SHOT') {
        ctx.fillStyle = '#ffe629';
        ctx.beginPath();
        ctx.arc(p.x, py, 4.5, 0, Math.PI * 2);
        ctx.fill();
      } else if (p.type === 'TWIN_ARROW' || p.type === 'TRACK_ARROW') {
        ctx.save();
        ctx.translate(p.x, py);
        ctx.rotate(p.angle);
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.moveTo(11, 0);
        ctx.lineTo(-4, -7);
        ctx.lineTo(-1, -2);
        ctx.lineTo(-12, -2);
        ctx.lineTo(-12, 2);
        ctx.lineTo(-1, 2);
        ctx.lineTo(-4, 7);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }
    }

    // 가스터 블래스터
    for (let i = 0; i < state.blasters.length; i++) {
      drawBlaster(state.blasters[i]);
    }

    // 플레이어 영혼
    const blink = state.invuln > 0 && Math.floor(state.invuln * 20) % 2 === 0;
    const drawSoulY = s.y - camOffset;
    if (!blink) {
      if (s.mode === 'TWIN_GREEN') {
        drawMiniHeart(s.twinL.x, s.twinL.y, 9, '#2ce64b');
        drawGreenShield(s.twinL.x, s.twinL.y, s.shieldAngle, 24);
        drawMiniHeart(s.twinR.x, s.twinR.y, 9, '#2ce64b');
        drawGreenShield(s.twinR.x, s.twinR.y, s.shieldAngle, 24);
      } else if (s.mode === 'HYBRID_RG') {
        drawMiniHeart(s.x, drawSoulY, 9, '#ff2a2a', false, '#2ce64b');
        drawGreenShield(s.x, drawSoulY, s.shieldAngle, 23);
      } else if (s.mode === 'HYBRID_BY') {
        drawMiniHeart(s.x, drawSoulY, 9, '#2699ff', true, '#ffe629');
      } else if (s.mode === 'HYBRID_PG') {
        drawMiniHeart(s.x, drawSoulY, 9, '#b84dff', false, '#2ce64b');
        drawGreenShield(s.x, drawSoulY, s.shieldAngle, 23);
      } else if (s.mode === 'GREEN') {
        drawMiniHeart(s.x, drawSoulY, 9, '#2ce64b');
        drawGreenShield(s.x, drawSoulY, s.shieldAngle, 23);
      } else if (s.mode === 'YELLOW') {
        drawMiniHeart(s.x, drawSoulY, 9, '#ffe629', true);
      } else {
        drawMiniHeart(s.x, drawSoulY, 9, meta.color);
      }

      if (isHeld(['ShiftLeft', 'ShiftRight', 'KeyX'])) {
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(s.x, drawSoulY, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function renderBottomHudAndMenus() {
    const b = state.box;

    ctx.save();
    ctx.beginPath();
    ctx.rect(b.x + 6, b.y + 6, b.w - 12, b.h - 12);
    ctx.clip();

    if (state.screen === 'DIALOGUE') {
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 17px Malgun Gothic, Courier New, monospace';
      drawWrappedBoxText(state.dialogueFull.slice(0, state.dialogueShown), b.x + 20, b.y + 38, b.w - 40, 28);
      ctx.fillStyle = '#888899';
      ctx.font = '12px Malgun Gothic, monospace';
      ctx.fillText('[Z / 터치] 계속', b.x + b.w - 125, b.y + b.h - 14);
    }

    if (state.screen === 'MENU') {
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 17px Malgun Gothic, Courier New, monospace';
      if (!state.subMenuOpen) {
        const msg = state.exhausted
          ? '* 샌즈는 완전히 탈진해 비틀거리고 있다!\n* 지금 [전투]를 선택해 최후의 일격을 가하자!'
          : (state.provoked
            ? '* 샌즈의 빈틈이 열려 있다!\n* 지금 [전투]를 선택하면 공격이 적중한다!'
            : (state.ult3Survived && !state.omniSurvived
              ? '* 샌즈가 거친 숨을 몰아쉬고 있다.\n* [행동 -> * X도발하기]를 선택해 최후의 결판을 내자!'
              : '* 샌즈가 당신의 영혼을 주시하며 비웃고 있다.\n* (평소엔 모든 공격 회피 — [행동 -> 도발하기]로 빈틈을 만들자)'));
        drawWrappedBoxText(msg, b.x + 20, b.y + 42, b.w - 40, 30);
      } else {
        const list = state.menuIdx === 1 ? state.actOptions : state.items;
        list.forEach((item, idx) => {
          const yy = b.y + 44 + idx * 32;
          if (idx === state.subIdx) {
            drawMiniHeart(b.x + 28, yy - 6, 7, '#ff2a2a');
            ctx.fillStyle = '#ffe629';
          } else {
            ctx.fillStyle = '#ffffff';
          }
          const extra = item.heal ? ` (+${item.heal} HP)` : '';
          ctx.fillText(`* ${item.name}${extra}`, b.x + 46, yy);
        });
        ctx.fillStyle = '#888899';
        ctx.font = '12px Malgun Gothic, monospace';
        ctx.fillText('[Z / 터치] 선택   [X] 뒤로', b.x + b.w - 175, b.y + b.h - 14);
      }
    }

    if (state.screen === 'ATTACK_BAR') {
      const cx = b.x + b.w / 2;
      ctx.strokeStyle = '#2ce64b';
      ctx.lineWidth = 3;
      ctx.strokeRect(cx - 24, b.y + 20, 48, b.h - 40);
      ctx.strokeStyle = '#ff9922';
      ctx.strokeRect(cx - 95, b.y + 32, 190, b.h - 64);

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(state.atkBarX - 5, b.y + 14, 10, b.h - 28);
      ctx.font = 'bold 14px Malgun Gothic, monospace';
      ctx.fillText('[Z / 터치] 타이밍에 맞춰 공격!', b.x + 20, b.y + b.h - 14);
    }

    ctx.restore();

    // 플레이어 HP / KR 바
    const hpY = 532;
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 17px Courier New, monospace';
    ctx.fillText(state.enhancedMode ? 'CHARA [CURSED]' : 'CHARA   LV 19', 85, hpY + 18);
    ctx.font = 'bold 13px Courier New, monospace';
    ctx.fillText('HP', 260, hpY + 17);

    const hpBarX = 290;
    const hpBarW = 140;
    ctx.fillStyle = '#aa0000';
    ctx.fillRect(hpBarX, hpY + 2, hpBarW, 20);
    const solidHp = Math.max(0, state.hp - state.kr);
    ctx.fillStyle = state.enhancedMode ? '#ff5566' : '#ffe629';
    ctx.fillRect(hpBarX, hpY + 2, hpBarW * (solidHp / state.maxHp), 20);
    if (state.kr > 0) {
      ctx.fillStyle = '#b84dff';
      ctx.fillRect(hpBarX + hpBarW * (solidHp / state.maxHp), hpY + 2, hpBarW * (state.kr / state.maxHp), 20);
    }

    ctx.fillStyle = state.kr > 0 ? '#d888ff' : '#ffffff';
    ctx.font = 'bold 17px Courier New, monospace';
    ctx.fillText(`KR  ${state.hp} / ${state.maxHp}`, hpBarX + hpBarW + 14, hpY + 18);

    // 하단 4개 버튼
    const cmds = ['전투', '행동', '아이템', '자비'];
    const btnW = 145;
    const btnH = 48;
    const startX = 80;
    const btnY = 584;

    cmds.forEach((label, idx) => {
      const bx = startX + idx * 165;
      const active = state.screen === 'MENU' && state.menuIdx === idx;
      ctx.strokeStyle = active ? '#ffe629' : '#ff8822';
      ctx.lineWidth = 3;
      ctx.strokeRect(bx, btnY, btnW, btnH);
      if (active) {
        drawMiniHeart(bx + 22, btnY + btnH / 2, 7.5, '#ff2a2a');
      }
      ctx.fillStyle = active ? '#ffe629' : '#ff8822';
      ctx.font = 'bold 20px Malgun Gothic, monospace';
      ctx.fillText(label, bx + 42, btnY + 31);
    });
  }

  function render() {
    ctx.save();
    if (state.screenShake > 0) {
      ctx.translate((Math.random() - 0.5) * state.screenShake, (Math.random() - 0.5) * state.screenShake);
    }

    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);

    if (state.screen === 'TITLE') {
      state.sans.x = 400;
      state.sans.y = 148;
      drawSans();

      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 27px Courier New, monospace';
      ctx.fillText('UNDERTALE: SANS — SOUL SOVEREIGN', W / 2, 286);
      ctx.fillStyle = '#55ffff';
      ctx.font = 'bold 14px Malgun Gothic, monospace';
      ctx.fillText('3페이즈 BGM & 체력 재충전 · 혼합 영혼 · 필살기 1·2·3 · 종합필살기', W / 2, 312);

      // 일반 시작 카드
      ctx.strokeStyle = '#ffe629';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(115, 332, W - 230, 68);
      ctx.fillStyle = '#ffe629';
      ctx.font = 'bold 17px Malgun Gothic, monospace';
      ctx.fillText('[1] 일반 샌즈 전투 시작 (화면 터치 / Z / Enter)', W / 2, 360);
      ctx.fillStyle = '#cccccc';
      ctx.font = '12px Malgun Gothic, monospace';
      ctx.fillText('2000 → 3500 → 4000 HP + 필살기 1 · 2 · 3 + 종합필살기 정식 진행', W / 2, 384);

      // 강화 버전 시작 카드
      ctx.strokeStyle = '#ff3344';
      ctx.lineWidth = 2.5;
      ctx.strokeRect(115, 412, W - 230, 74);
      ctx.fillStyle = '#ff4455';
      ctx.font = 'bold 17px Malgun Gothic, monospace';
      ctx.fillText('[2] ⚠ 강화 버전 전투 시작 (상단 강화 버튼과 동일)', W / 2, 442);
      ctx.fillStyle = '#ffaaaa';
      ctx.font = '12px Malgun Gothic, monospace';
      ctx.fillText('플레이어 HP 32 고정 · 샌즈 체력 2배(4000/7000/8000) & 공격력 2배!', W / 2, 466);

      ctx.fillStyle = '#888899';
      ctx.font = '12px Malgun Gothic, monospace';
      ctx.fillText('조작: 방향키 / WASD / 화면 드래그 · 정밀저속: X / Shift · 확인/사격: Z / 터치', W / 2, 526);
      ctx.textAlign = 'left';
      ctx.restore();
      return;
    }

    renderBossHud();
    if (
      state.screen !== 'DODGE' ||
      (state.ultimateStage !== 3 && !(state.ultimateStage === 4 && state.omniStage === 4))
    ) {
      drawSans();
    }

    if (state.dmgPopup) {
      ctx.fillStyle = state.dmgPopup.color;
      ctx.font = 'bold 26px Courier New, monospace';
      ctx.textAlign = 'center';
      ctx.fillText(state.dmgPopup.text, state.dmgPopup.x, state.dmgPopup.y);
      ctx.textAlign = 'left';
    }

    renderArenaAndSoul();
    renderBottomHudAndMenus();

    if (state.screen === 'PHASE_TRANSITION') {
      const track = BGM_TRACKS[state.phase] || BGM_TRACKS[1];
      ctx.fillStyle = 'rgba(0, 0, 0, 0.72)';
      ctx.fillRect(0, 232, W, 120);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#00ff88';
      ctx.font = 'bold 24px Courier New, monospace';
      ctx.fillText(`PHASE ${state.phase} — ${track.name}`, W / 2, 276);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 16px Malgun Gothic, monospace';
      ctx.fillText(`샌즈의 체력이 ${state.bossMaxHp} HP로 완전히 재충전되었다!`, W / 2, 312);
      ctx.textAlign = 'left';
    }

    if (state.screen === 'GAMEOVER') {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.86)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ff2a2a';
      ctx.font = 'bold 46px Courier New, monospace';
      ctx.fillText('GAME OVER', W / 2, 270);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 18px Malgun Gothic, monospace';
      ctx.fillText('의지를 잃지 마라... [Z / 터치] 타이틀로 복귀', W / 2, 335);
      ctx.textAlign = 'left';
    }

    if (state.screen === 'VICTORY') {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.86)';
      ctx.fillRect(0, 0, W, H);
      state.sans.x = 400;
      state.sans.y = 145;
      drawSans();
      ctx.textAlign = 'center';
      ctx.fillStyle = '#2ce64b';
      ctx.font = 'bold 32px Courier New, monospace';
      ctx.fillText(
        state.enhancedMode ? 'ENHANCED SOUL SOVEREIGN DEFEATED!' : 'VICTORY — SOUL SOVEREIGN DEFEATED!',
        W / 2,
        305
      );
      ctx.fillStyle = '#ffe629';
      ctx.font = 'bold 17px Malgun Gothic, monospace';
      ctx.fillText('* ...대단하군. 모든 혼합 영혼과 필살기 1·2·3, 종합필살기까지 돌파하다니.', W / 2, 355);
      ctx.fillStyle = '#cccccc';
      ctx.font = '15px Malgun Gothic, monospace';
      ctx.fillText('[Z / 터치] 타이틀 화면으로 돌아가기', W / 2, 410);
      ctx.textAlign = 'left';
    }

    if (state.flashAlpha > 0) {
      ctx.fillStyle = state.flashColor;
      ctx.globalAlpha = state.flashAlpha;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

  // =========================================================================
  // 12. GAME INITIALIZATION & TOP BAR BUTTON BINDINGS
  // =========================================================================
  function startNewGame(enhanced = false) {
    sfx.init();
    state.enhancedMode = Boolean(enhanced);
    updateEnhancedButtonUI();

    state.phase = 1;
    state.turn = 1;
    state.bossMaxHp = getBossHpForPhase(1);
    state.bossHp = state.bossMaxHp;
    state.bossDisplayHp = state.bossHp;
    state.provoked = false;
    state.exhausted = false;
    state.ultimateStage = 0;
    state.ult1Survived = false;
    state.ult2Survived = false;
    state.ult3Survived = false;
    state.omniSurvived = false;

    state.hp = state.enhancedMode ? 32 : 92;
    state.maxHp = state.enhancedMode ? 32 : 92;
    state.kr = 0;
    state.invuln = 0;
    state.items = DEFAULT_ITEMS.map((item) => ({ ...item }));
    state.sans.x = 400;
    state.sans.targetX = 400;
    state.sans.y = 142;
    state.sans.shake = 0;
    state.sans.dodgeTimer = 0;
    state.sans.sweat = state.enhancedMode ? 1 : 0;

    if (state.enhancedMode) {
      state.flashAlpha = 0.75;
      state.flashColor = '#ff2244';
      sfx.play('phaseUp');
      startDialogue(
        '* [⚠ 강화 버전 발동]\n* 플레이어 HP 32 고정! 체력 2배·공격력 2배로 강화된 샌즈와 전투를 시작한다!',
        () => openMenu()
      );
    } else {
      startDialogue(
        '* 맑은 날이야. 새들은 지저귀고, 꽃들은 피어나고...\n* 이런 날엔 네 영혼을 자유자재로 조종해 줄 수밖에 없겠지.',
        () => openMenu()
      );
    }
  }

  document.getElementById('btn-enhanced').addEventListener('click', () => {
    startNewGame(!state.enhancedMode);
  });
  document.getElementById('btn-bgm').addEventListener('click', (e) => {
    sfx.bgmOn = !sfx.bgmOn;
    e.target.textContent = `BGM:${sfx.bgmOn ? 'ON' : 'OFF'}`;
  });
  document.getElementById('btn-sfx').addEventListener('click', (e) => {
    sfx.sfxOn = !sfx.sfxOn;
    e.target.textContent = `SFX:${sfx.sfxOn ? 'ON' : 'OFF'}`;
  });
  document.getElementById('btn-pad').addEventListener('click', (e) => {
    const pad = document.getElementById('mobile-overlay-pad');
    pad.classList.toggle('hidden');
    e.target.textContent = `키패드:${pad.classList.contains('hidden') ? 'OFF' : 'ON'}`;
  });

  window.addEventListener('load', () => {
    fitCanvasToScreen();
    let lastTime = performance.now();
    function loop(now) {
      const dt = Math.min(0.05, (now - lastTime) / 1000);
      lastTime = now;
      update(dt);
      render();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  });
})();
</script>
</body>
</html>
