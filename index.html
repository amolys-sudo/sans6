<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>SANS: SOUL SOVEREIGN — 영혼의 지배자</title>
<style>
  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    min-height: 100dvh;
    background: #050508;
    color: #ffffff;
    font-family: "Courier New", "Malgun Gothic", monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    touch-action: none;
  }
  #app-shell {
    width: 100%;
    max-width: 760px;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: env(safe-area-inset-top, 4px) 6px env(safe-area-inset-bottom, 4px) 6px;
    gap: 4px;
  }
  #top-bar {
    width: 100%;
    display: flex;
    flex-wrap: wrap;
    gap: 4px 6px;
    align-items: center;
    justify-content: space-between;
    padding: 5px 8px;
    background: #0d0d14;
    border: 2px solid #38384a;
    border-radius: 6px;
    font-size: 11px;
    flex-shrink: 0;
  }
  .tb-group {
    display: flex;
    gap: 4px 6px;
    align-items: center;
    flex-wrap: wrap;
  }
  button.hud-btn {
    background: #151520;
    color: #ffffff;
    border: 1.5px solid #ff8c1a;
    border-radius: 5px;
    padding: 5px 8px;
    font-family: inherit;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    min-height: 30px;
    touch-action: manipulation;
  }
  button.hud-btn:active, button.hud-btn:hover {
    background: #ff8c1a;
    color: #000000;
  }

  #canvas-stage {
    flex: 1 1 auto;
    width: 100%;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #game-wrap {
    position: relative;
    width: 720px;
    height: 560px;
    background: #000000;
    border: 3px solid #ffffff;
    border-radius: 6px;
    box-shadow: 0 0 24px rgba(0, 180, 255, 0.22);
    overflow: hidden;
    flex-shrink: 0;
  }
  #game-wrap.enraged-border {
    border-color: #ff2a4b;
    box-shadow: 0 0 28px rgba(255, 42, 75, 0.45);
  }
  canvas#game {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
    touch-action: none;
  }

  #mobile-controls {
    width: 100%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 10px;
    background: #0c0c13;
    border: 2px solid #2c2c3d;
    border-radius: 8px;
    gap: 8px;
  }
  #mobile-controls.hidden {
    display: none;
  }
  .dpad {
    display: grid;
    grid-template-columns: repeat(3, 46px);
    grid-template-rows: repeat(3, 42px);
    gap: 4px;
    touch-action: none;
  }
  .m-btn {
    background: #171724;
    border: 2px solid #66667a;
    border-radius: 8px;
    color: #ffffff;
    font-family: inherit;
    font-size: 16px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: none;
  }
  .m-btn.pressed, .m-btn:active {
    background: #ffe629;
    border-color: #ffe629;
    color: #000000;
  }
  .touch-hint {
    flex: 1;
    text-align: center;
    font-size: 11px;
    color: #9aa0b4;
    line-height: 1.4;
  }
  .action-btns {
    display: flex;
    gap: 10px;
    align-items: center;
    touch-action: none;
  }
  .act-btn {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    font-family: inherit;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    touch-action: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1.15;
  }
  .act-btn.x-btn {
    background: #1c140a;
    border: 2.5px solid #ff9922;
    color: #ff9922;
  }
  .act-btn.z-btn {
    background: #0b1c10;
    border: 2.5px solid #2ce64b;
    color: #2ce64b;
  }
  .act-btn.pressed, .act-btn:active {
    background: #ffe629;
    border-color: #ffe629;
    color: #000000;
  }

  @media (max-width: 540px) {
    #top-bar {
      font-size: 10px;
      padding: 4px 6px;
    }
    button.hud-btn {
      font-size: 10px;
      padding: 4px 6px;
      min-height: 26px;
    }
    .dpad {
      grid-template-columns: repeat(3, 42px);
      grid-template-rows: repeat(3, 38px);
    }
    .act-btn {
      width: 52px;
      height: 52px;
      font-size: 12px;
    }
    .touch-hint {
      font-size: 10px;
    }
  }
</style>
</head>
<body>
<div id="app-shell">
  <div id="top-bar">
    <div class="tb-group">
      <strong style="color:#4deeea;">SANS: SOUL SOVEREIGN</strong>
      <span id="phase-badge" style="color:#ffe629; font-weight:bold;">[PHASE 1 / 3]</span>
      <span id="bgm-badge" style="color:#9effa9; font-size:11px;">♪ SANS THEME</span>
      <span id="provoke-badge" style="color:#ff6b6b;">도발 필요 ([행동]→[도발하기])</span>
    </div>
    <div class="tb-group">
      <button class="hud-btn" id="btn-bgm">BGM: ON</button>
      <button class="hud-btn" id="btn-pad">패드: ON</button>
      <button class="hud-btn" id="btn-normal">처음부터</button>
      <button class="hud-btn" id="btn-enraged" style="border-color:#ff2a4b; color:#ff6b81;">⚠ 강화 버전</button>
    </div>
  </div>

  <div id="canvas-stage">
    <div id="game-wrap">
      <canvas id="game" width="720" height="560"></canvas>
    </div>
  </div>

  <div id="mobile-controls">
    <div class="dpad">
      <div></div>
      <button class="m-btn" data-key="arrowup">▲</button>
      <div></div>
      <button class="m-btn" data-key="arrowleft">◀</button>
      <div></div>
      <button class="m-btn" data-key="arrowright">▶</button>
      <div></div>
      <button class="m-btn" data-key="arrowdown">▼</button>
      <div></div>
    </div>
    <div class="touch-hint">
      화면 직접 드래그·스와이프 이동/방패/사격 지원<br/>
      <span style="color:#ffe629;">Z</span> 확인·점프·발사 / <span style="color:#ff9922;">X</span> 취소·저속
    </div>
    <div class="action-btns">
      <button class="act-btn x-btn" data-key="x">X<span style="font-size:10px;">취소/저속</span></button>
      <button class="act-btn z-btn" data-key="z">Z<span style="font-size:10px;">확인/점프</span></button>
    </div>
  </div>
</div>

<script id="sovereign-core-script">
(() => {
  'use strict';

  const canvasStage = document.getElementById('canvas-stage');
  const gameWrap = document.getElementById('game-wrap');
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = 720;
  const H = 560;

  // 반응형 캔버스 래퍼 크기 맞춤 (모바일 세로/가로 및 데스크톱 대응)
  function fitGameWrap() {
    if (!canvasStage || !gameWrap) return;
    const rect = canvasStage.getBoundingClientRect();
    const availW = Math.max(240, rect.width - 4);
    const availH = Math.max(180, rect.height - 4);
    const aspect = W / H;
    let drawW = availW;
    let drawH = drawW / aspect;
    if (drawH > availH) {
      drawH = availH;
      drawW = drawH * aspect;
    }
    gameWrap.style.width = Math.floor(drawW) + 'px';
    gameWrap.style.height = Math.floor(drawH) + 'px';
  }
  window.addEventListener('resize', fitGameWrap);
  window.addEventListener('orientationchange', () => setTimeout(fitGameWrap, 80));
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(fitGameWrap).observe(canvasStage);
  }
  fitGameWrap();

  // =========================================================================
  // 1. 샌즈 71x54 픽셀 도트 스프라이트 (절대 불변 원본 유지)

  const SANS_SPRITE_71x54 = [

    ".........BBBBBWWWWBBWWWBWWBWWWBWWBWBWWWWBBWWBBB.......",
    "........BWWWBBWWWWWBBWWBWWBWWWBWWBBWWWWWBWWWWWWB......",
    ".......BWWWWWBBWWWWWWBBBWWBWWWBWBBWWWWWBWWWWWWB.......",
    ".......BWWWWWWBBWWWWWWWBBBBBBBBBWWWWWWBWWWWWWB........",
    "......BWBBBWWWWWBBWWWWWWWWWWWWWWWWWWBBBWWWWWWB........",

    "......BBBBBBBBBWWWBBBBBBBBBBBBBBBBBBWWWWBBBBBBBWWB....",

    "BWWBBBBBBBBWWWBBBBBWBBWBWWWWWBWBBWBBWWWBBBWBBBBBBBBBWB",
    "BWWBBBBBBBBWBBBBBBBWBWWBWWWWWBWWWWBWBBBBBBWWBBBBBBBBWB",
    "BWWBBBBBBBWBBBBBBBBWWBWBWWWWWBWBBWBWBBBBBBBWBBBBBBBBWB",
    ".BWWBBBBBBWBBBBBBBBWBBWBWWWWWBWBBWBWBBBBBBBWBBBBBBBBWB",
    "..BWWBBBBBWBBBBBBBBWBWWBWWWWWBWWWBWBBBBBBBBWBBBBBBBWWB",
    "...BWWBBBBWBBBBBBBBBWBWBWWWWWBWBWBWBBBBBBBBWBBBBBWWB..",
    "....BWWWBBWBBBBBBBBBWBWBWWWWWBWBWWBBBBBBBBBWBBBBBWWB..",
    ".....BWWBBWBBBBBBBBBWBWBBBBBBBWBWBBBBBBBBBWWBBBBWWB...",
    "......BWBBWWWBBBBBBBWWWWWWWWWWWWWBBBBBBBBWWWBWWWBB....",
    ".......BBWWWWWBBBBBBWWWWWBBBBBBWWWWWWWWWWWWBBWWB......",
    ".........BBWWWWWWWWWBBBBBBBBBBBBBBBBBBBBBWWBB.........",
    "...........BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB...........",
    "............BBBBBBBBBBBBBBBBBBBBBBWWBBBBBWB...........",
    "...........BWBBWWBBBBBBBBBBBBBBBBBWWBBBBBWB...........",
    "..........BWBBBWWBBBBBBBBBBBBBBBBBWWBBBBBBWB..........",
    "..........BWBBWWBBBBBBBBBBWBBBBBBBWWBBBBBBWB..........",
    "..........BWBBWWBBBBBBBBBBWBWBBBBBBWWBBBBBBWB..........",
    "..........BWBBWWBBBBBBBBBWBWBBBBBBWWWBBBBBWB..........",
    "..........BWBBWWBBBBBBBBBWBWBBBBBBWWWBBBBBBWB.........",
    ".........BWBBWWBBBBBBBBBBWBBWBBBBBWWWBBBBBBWB.........",
    ".........BWBBWWBBBBBBBBBBWWBBWBBBBBWWWBBBBBBWB.........",
    ".........BWBBWWBBBBBBBBBBWB.BWBBBBBBWWBBBBBBWB.........",
    ".........BWBBWWBBBBBBBBBBWB.BWBBBBBBWWBBBBBBWB.........",
    ".........BWBBWWBBBBBBBBBBWB.BWBBBBBBWWBBBBBBWB.........",
    ".........BWWWWWBBBBBBBBBWB.BWBBBBBBWWWBBWWWWB.........",
    "..........BBBBBWWWWWWWWWB...BWWWWWWWWWWWBBBB..........",
    "...............BBBBBBBBB.....BBBBBBBBBBB..............",
    ".........BBBB..BBBB.............BWBBBBBB...BBBB.......",
    "........BWWWWBBWWWWB............BWWWWWWWBBBWWWWB......",
    ".......BWWWWWWWBWWWB...........BWWWWWWWWBWWWWWWWB.....",
    "......BWWWWWWWWWBWWB...........BWWWWWWWWWBWWWWWWWB....",
    "......BWWWWWWWWWBBBB...........BBBBBBBBBBWWWWWWWWB....",
    "......BWWWWWWWWWWBWWB.........BWWWWWWWWWBWWWWWWWWB....",
    ".......BBBBBBBBBB.BB...........BBBBBBBBBBBBBBBBBB....."
  ];

  const sansSpriteCache = new Map();
  function getSansSpriteCanvas(eyeColor, twinGreen = false, enragedLeftEye = false) {
    const key = (eyeColor || 'NONE') + (twinGreen ? '_TWIN' : '') + (enragedLeftEye ? '_ENR' : '');
    if (sansSpriteCache.has(key)) return sansSpriteCache.get(key);

    const scale = 3;
    const sw = 54 * scale;
    const sh = 71 * scale;
    const off = document.createElement('canvas');
    off.width = sw;
    off.height = sh;
    const octx = off.getContext('2d');
    octx.imageSmoothingEnabled = false;

    for (let r = 0; r < 71; r++) {
      const row = SANS_SPRITE_71x54[r];
      for (let c = 0; c < 54; c++) {
        const ch = row[c];
        if (ch === '.') continue;
        const inLeftEye = (r >= 10 && r <= 16 && c >= 16 && c <= 23);
        const inRightEye = (r >= 10 && r <= 16 && c >= 30 && c <= 37);

        if (twinGreen && (inLeftEye || inRightEye)) {
          if ((r === 13 || r === 14) && ((c === 19 || c === 20) || (c === 33 || c === 34))) {
            octx.fillStyle = '#000000';
          } else if (ch === 'B') {
            octx.fillStyle = '#2ce64b';
          } else {
            octx.fillStyle = '#ffffff';
          }
          octx.fillRect(c * scale, r * scale, scale, scale);
          continue;
        }

        if (eyeColor || enragedLeftEye) {
          if (inLeftEye) {
            if ((r === 13 || r === 14) && (c === 19 || c === 20)) {
              octx.fillStyle = '#000000';
              octx.fillRect(c * scale, r * scale, scale, scale);
              continue;
            }
            if (enragedLeftEye && ch === 'B') {
              octx.fillStyle = '#ff2a4b';
              octx.fillRect(c * scale, r * scale, scale, scale);
              continue;
            }
          }
          if (inRightEye) {
            if ((r === 13 || r === 14) && (c === 33 || c === 34)) {
              octx.fillStyle = '#000000';
              octx.fillRect(c * scale, r * scale, scale, scale);
              continue;
            }
            if (eyeColor && ch === 'B') {
              octx.fillStyle = eyeColor;
              octx.fillRect(c * scale, r * scale, scale, scale);
              continue;
            }
          }
        }

        octx.fillStyle = (ch === 'B') ? '#000000' : '#ffffff';
        octx.fillRect(c * scale, r * scale, scale, scale);
      }
    }
    sansSpriteCache.set(key, off);
    return off;
  }

  // =========================================================================
  // 1-B. 가스터 블래스터 34x41 픽셀 도트 스프라이트
  // =========================================================================
  const GASTER_BLASTER_34x41 = [
    "................WW................",
    "................WW................",
    "...............WWWW...............",
    "..............WWWWWW..............",
    "......WW.....WWWWWWWW.....WW......",

    ".......WWWW............WWWW.......",
    "........WWWW..WWWWWW..WWWW........",
    "........WWWWWWWWWWWWWWWWWW........",
    ".........WWWWWWWWWWWWWWWW.........",
    ".........WWWWWWWWWWWWWWWW.........",
    "..........WWWWWWWWWWWWWW..........",
    "...........WWWWWWWWWWWW...........",
    "............WWWWWWWWWW............"
  ];

  const blasterSpriteCache = new Map();
  function getBlasterSpritePair(eyeColor) {
    const key = eyeColor || '#4deeea';
    if (blasterSpriteCache.has(key)) return blasterSpriteCache.get(key);

    const px = 2;
    const w = 34 * px;
    const h = 41 * px;

    const buildPart = (startRow, endRow) => {
      const off = document.createElement('canvas');
      off.width = w;
      off.height = h;
      const octx = off.getContext('2d');
      octx.imageSmoothingEnabled = false;
      for (let r = startRow; r <= endRow; r++) {
        const row = GASTER_BLASTER_34x41[r];
        for (let c = 0; c < 34; c++) {
          const ch = row[c];
          if (ch === '.') continue;
          const isPupil = (r === 17 || r === 18) && ((c === 8 || c === 9) || (c === 24 || c === 25));
          if (isPupil) {
            octx.fillStyle = key;
          } else {
            octx.fillStyle = (ch === 'B') ? '#000000' : '#ffffff';
          }
          octx.fillRect(c * px, r * px, px, px);
        }
      }
      return off;
    };

    const pair = {
      upper: buildPart(0, 32),
      jaw: buildPart(33, 40),
      w,
      h
    };
    blasterSpriteCache.set(key, pair);
    return pair;
  }

  // =========================================================================
  // 2. Web Audio API 레트로 효과음 & 페이즈별 BGM 시퀀서
  // =========================================================================
  const BGM_TRACKS = {

  const sfx = {
    ctx: null,
    bgmEnabled: true,
    bgmTimer: 0,
    bgmStep: 0,
    lastPhase: 1,
    init() {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) this.ctx = new AC();
      }
      if (this.ctx && this.ctx.state === 'suspended') {
        this.ctx.resume().catch(() => {});
      }
    },
    resetBgm() {
      this.bgmTimer = 0;
      this.bgmStep = 0;
    },
    updateBgm(dt, isPlaying, phase, enraged = false) {
      if (!this.bgmEnabled || !this.ctx || !isPlaying) return;
      if (this.ctx.state === 'suspended') return;
      if (this.lastPhase !== phase) {
        this.lastPhase = phase;
        this.bgmStep = 0;
        this.bgmTimer = 0;
      }

      const track = BGM_TRACKS[phase] || BGM_TRACKS[1];
      const bpm = enraged ? track.bpm * 1.12 : track.bpm;
      const stepDur = 60 / bpm / 4;
      this.bgmTimer += dt;
      if (this.bgmTimer < stepDur) return;
      this.bgmTimer -= stepDur;

      const idx = this.bgmStep % track.lead.length;
      const leadFreq = track.lead[idx];
      const bassFreq = track.bass[idx];
      const now = this.ctx.currentTime;

      try {
        if (leadFreq > 0) {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = enraged ? 'sawtooth' : track.leadWave;
          osc.frequency.setValueAtTime(leadFreq, now);
          const vol = phase === 1 ? 0.032 : (phase === 2 ? 0.026 : 0.028);
          gain.gain.setValueAtTime(vol, now);
          gain.gain.exponentialRampToValueAtTime(0.0008, now + stepDur * 1.15);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + stepDur * 1.2);
        }
        if (bassFreq > 0) {
          const bOsc = this.ctx.createOscillator();
          const bGain = this.ctx.createGain();
          bOsc.type = track.bassWave;
          bOsc.frequency.setValueAtTime(bassFreq, now);
          const bVol = phase === 3 ? 0.032 : 0.042;
          bGain.gain.setValueAtTime(bVol, now);
          bGain.gain.exponentialRampToValueAtTime(0.0008, now + stepDur * 1.35);
          bOsc.connect(bGain);
          bGain.connect(this.ctx.destination);
          bOsc.start(now);
          bOsc.stop(now + stepDur * 1.4);
        }
      } catch (_) {}

      this.bgmStep++;
    },
    tone(freq, dur = 0.08, type = 'square', vol = 0.07, slide = null) {
      if (!this.ctx) return;
      try {
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, slide), now + dur);
        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + dur);
      } catch (_) {}
    },
    voice() { this.tone(175 + Math.random() * 25, 0.04, 'square', 0.045); },
    select() { this.tone(520, 0.06, 'square', 0.055); },
    confirm() { this.tone(660, 0.07, 'square', 0.065, 880); },
    soulChange() { this.tone(420, 0.14, 'triangle', 0.08, 780); },
    warn() { this.tone(920, 0.09, 'square', 0.055, 620); },
    slam() { this.tone(130, 0.22, 'sawtooth', 0.055, 42); },
    block() { this.tone(740, 0.07, 'square', 0.055, 1040); },
    hurt() { this.tone(160, 0.18, 'sawtooth', 0.065, 55); },
    blasterCharge() { this.tone(240, 0.35, 'sawtooth', 0.04, 680); },
    blasterFire() {
      this.tone(150, 0.45, 'sawtooth', 0.065, 34);
      this.tone(75, 0.48, 'square', 0.045, 26);
    },
    slash() { this.tone(860, 0.15, 'sawtooth', 0.048, 140); },
    vortex() { this.tone(290, 0.22, 'triangle', 0.055, 610); },
    phaseUp() {
      [330, 440, 554, 659, 880].forEach((f, idx) => {
        setTimeout(() => this.tone(f, 0.16, 'sawtooth', 0.06), idx * 70);
      });
    }
  };

  function wrapTextLines(text, maxWidth) {
    const out = [];
    const paras = text.split('\n');
    ctx.font = 'bold 19px "Courier New", "Malgun Gothic", monospace';
    for (const p of paras) {
      let cur = '';
      for (const ch of p) {
        if (ctx.measureText(cur + ch).width > maxWidth && cur.length > 0) {
          out.push(cur);
          cur = ch;
        } else {
          cur += ch;
        }
      }
      if (cur.length > 0) out.push(cur);
    }
    return out;
  }

  function advanceDialogue() {
    const curLine = state.dialogueLines[state.dialogueIdx] || '';
    if (state.dialogueChar < curLine.length) {
      state.dialogueChar = curLine.length;
      return;
    }
    state.dialogueIdx++;
    if (state.dialogueIdx < state.dialogueLines.length) {
      state.dialogueChar = 0;
      state.dialogueTimer = 0;
    } else {
      const cb = state.onDialogueComplete;
      state.onDialogueComplete = null;
      if (cb) cb();
    }
  }

  function handleMenuSelect() {
    if (state.screen === 'DIALOGUE') {
      advanceDialogue();
      return;
    }

    if (state.screen === 'MENU') {
      if (!state.subMenuType) {
        sfx.confirm();
        if (state.mainMenuIdx === 0) {
          startPlayerAttack();
        } else if (state.mainMenuIdx === 1) {
          state.subMenuType = 'ACT';
          state.subMenuIdx = 0;
        } else if (state.mainMenuIdx === 2) {
          if (state.items.length > 0) {
            state.subMenuType = 'ITEM';
            state.subMenuIdx = 0;
          }
        } else if (state.mainMenuIdx === 3) {
          startDialogue([
            '* 자비를 베풀려 했지만 샌즈는 코웃음을 쳤다.',
            '* "지금 멈추면 재미없잖아? 끝까지 가보자고."'
          ], () => beginBossTurn(0));
        }
        return;
      }

      if (state.subMenuType === 'ACT') {
        const acts = getActOptions();
        const chosen = acts[state.subMenuIdx];
        state.subMenuType = null;
        sfx.confirm();

        if (chosen.id === 'CHECK') {
          startDialogue([
            state.enraged
              ? `* ENRAGED SANS [PHASE ${state.phase}/3] — 체력 2배 · 공격력 2배`
              : `* SANS [PHASE ${state.phase}/3] — ATK 1 DEF 1`,
            '* 평소에는 모든 공격을 회피한다. [도발하기]를 써야 일격이 닿는다!'
          ], () => beginBossTurn(0));
        } else if (chosen.id === 'PROVOKE') {
          if (state.ultimate1Survived && !state.ultimate2Survived) {
            state.provoked = true;
            state.sans.sweat = 1;
            updateHudBadges();
            startDialogue([
              '* 당신은 거친 숨을 몰아쉬는 샌즈를 향해 비웃으며 도발했다!',
              '* "...좋아. 네가 그렇게 원한다면, 두 번째 필살기를 보여주지!"'
            ], () => beginBossTurn(2));
          } else {
            state.provoked = true;
            state.sans.sweat = 1;
            updateHudBadges();
            startDialogue([
              '* 당신은 샌즈를 도발했다! 샌즈의 오른쪽 눈동자가 날카롭게 일렁인다.',
              '* "그 잘난 영혼으로 내 공격을 버틸 수 있을까?" [다음 1턴 공격 적중 가능!]'
            ], () => beginBossTurn(0));
          }
        } else if (chosen.id === 'FOCUS') {
          state.kr = 0;
          state.hp = Math.min(state.maxHp, state.hp + 15);
          state.focusBonus = 1;
          sfx.soulChange();
          startDialogue([
            '* 영혼을 가다듬어 카르마(KR) 독을 정화하고 HP를 15 회복했다!'
          ], () => beginBossTurn(0));
        } else if (chosen.id === 'X_PROVOKE') {
          state.sans.sweat = 1;
          updateHudBadges();
          startDialogue([
            '* 당신은 영혼의 한계를 끌어올려 금기의 [X도발하기]를 외쳤다!',
            '* "...하하, 미쳤군. 좋았어. 필살기 1·2·3과 8방향 중력을 전부 합친 종합필살기다!"'
          ], () => beginBossTurn(4));
        }
        return;
      }

      if (state.subMenuType === 'ITEM') {
        const item = state.items.splice(state.subMenuIdx, 1)[0];
        state.subMenuType = null;
        if (item) {
          state.hp = Math.min(state.maxHp, state.hp + item.heal);
          state.kr = Math.max(0, state.kr - Math.floor(item.heal * 0.5));
          sfx.soulChange();
          startDialogue([`* ${item.name}을(를) 먹었다! ${item.desc}`], () => beginBossTurn(0));
        }
        return;
      }
    }

    if (state.screen === 'ATTACK_BAR' && !state.attackBar.locked) {
      confirmAttackBar();
    }
  }

  function confirmAttackBar() {
    state.attackBar.locked = true;
    state.attackBar.timer = 0.85;
    sfx.slash();

    if (state.grandSurvived) {
      state.bossHp = 0;
      state.attackBar.dmgText = '9999999';
      state.sans.shake = 18;
      sfx.hurt();
      return;
    }

    if (state.ultimate2Survived && !state.ultimate3Survived) {
      state.attackBar.dmgText = 'MISS';
      state.sans.dodgeOffset = -86;
      state.sans.dodgeTimer = 0.7;
      return;
    }

    if (!state.provoked) {
      state.attackBar.dmgText = 'MISS';
      state.sans.dodgeOffset = -84;
      state.sans.dodgeTimer = 0.65;
      return;
    }

    state.provoked = false;
    updateHudBadges();

    const dist = Math.abs(state.attackBar.x - W / 2);
    const mult = Math.max(0.35, 1 - dist / 280);
    const baseDmg = state.phase === 1 ? 680 : (state.phase === 2 ? 980 : 1150);
    const dmg = Math.round(baseDmg * mult);

    if (state.phase === 3 && state.bossHp - dmg <= 1 && !state.ultimate1Survived) {
      state.bossHp = 1;
      state.attackBar.dmgText = String(dmg);
      state.sans.shake = 13;
      sfx.hurt();
    } else {
      state.bossHp = Math.max(0, state.bossHp - dmg);
      state.attackBar.dmgText = String(dmg);
      state.sans.shake = 12;
      sfx.hurt();
    }
  }

    state.warnings = [];
    state.bones = [];
    state.arrows = [];
    state.blasters = [];
    state.blocks = [];
    state.bullets = [];
    state.beams = [];
    state.vortexBones = [];
    state.particles = [];
    state.shockwaves = [];
  }

  function addWarning(x, y, w, h, timer, spawnType, label = '!', boneColor = '#ffffff') {
    state.warnings.push({ x, y, w, h, timer, spawnType, label, boneColor });
    sfx.warn();
  }

  function triggerGravitySlam(dir) {
    const b = state.box;
    const s = state.soul;
    s.gravDir = dir;
    s.grounded = false;
    sfx.slam();

    const slamSpd = 680;
    const warnTime = 0.48;
    const spikeThick = 30;

    if (dir === 'DOWN') {
      s.vy = slamSpd;
      addWarning(b.x, b.y + b.h - spikeThick, b.w, spikeThick, warnTime, 'GRAV_FLOOR_BONES', '! FLOOR !');
    } else if (dir === 'UP') {
      s.vy = -slamSpd;
      addWarning(b.x, b.y, b.w, spikeThick, warnTime, 'GRAV_FLOOR_BONES', '! CEILING !');
    } else if (dir === 'LEFT') {
      s.vx = -slamSpd;
      addWarning(b.x, b.y, spikeThick, b.h, warnTime, 'GRAV_FLOOR_BONES', '! LEFT !');
    } else if (dir === 'RIGHT') {
      s.vx = slamSpd;
      addWarning(b.x + b.w - spikeThick, b.y, spikeThick, b.h, warnTime, 'GRAV_FLOOR_BONES', '! RIGHT !');
    } else if (dir === 'DOWN_LEFT') {
      s.vx = -slamSpd * 0.78;
      s.vy = slamSpd * 0.78;
      addWarning(b.x, b.y + b.h - spikeThick, b.w, spikeThick, warnTime, 'GRAV_FLOOR_BONES', '! ◣ !');
      addWarning(b.x, b.y, spikeThick, b.h, warnTime, 'GRAV_FLOOR_BONES', '! ◣ !');
    } else if (dir === 'DOWN_RIGHT') {
      s.vx = slamSpd * 0.78;
      s.vy = slamSpd * 0.78;
      addWarning(b.x, b.y + b.h - spikeThick, b.w, spikeThick, warnTime, 'GRAV_FLOOR_BONES', '! ◢ !');
      addWarning(b.x + b.w - spikeThick, b.y, spikeThick, b.h, warnTime, 'GRAV_FLOOR_BONES', '! ◢ !');
    } else if (dir === 'UP_LEFT') {
      s.vx = -slamSpd * 0.78;
      s.vy = -slamSpd * 0.78;
      addWarning(b.x, b.y, b.w, spikeThick, warnTime, 'GRAV_FLOOR_BONES', '! ◤ !');
      addWarning(b.x, b.y, spikeThick, b.h, warnTime, 'GRAV_FLOOR_BONES', '! ◤ !');
    } else if (dir === 'UP_RIGHT') {
      s.vx = slamSpd * 0.78;
      s.vy = -slamSpd * 0.78;
      addWarning(b.x, b.y, b.w, spikeThick, warnTime, 'GRAV_FLOOR_BONES', '! ◥ !');
      addWarning(b.x + b.w - spikeThick, b.y, spikeThick, b.h, warnTime, 'GRAV_FLOOR_BONES', '! ◥ !');
    }
  }

  function setSoulMode(mode, silent = false) {
    state.soul.mode = mode;
    state.soul.gravDir = 'DOWN';
    state.soul.vx = 0;
    state.soul.vy = 0;
    state.soul.grounded = false;
    state.soul.twinSplit = false;
    if (!silent) sfx.soulChange();

    const cx = state.box.tx + state.box.tw / 2;
    const cy = state.box.ty + state.box.th / 2;
    if (mode === 'GREEN') {
      state.soul.x = cx;
      state.soul.y = cy;
    } else if (mode === 'PURPLE' || mode === 'HYBRID_GP') {
      state.soul.railIdx = 1;
      state.soul.x = cx;
      state.soul.y = state.box.ty + state.box.th * 0.5;
    }
  }

  function spawnGasterBlaster(opts) {
    sfx.blasterCharge();
    state.blasters.push({
      x: opts.x,
      y: opts.y,
      offsetX: opts.offsetX ?? 0,
      offsetY: opts.offsetY ?? 0,
      angle: opts.angle,
      chargeTime: opts.chargeTime ?? 0.56,
      fireDuration: opts.fireDuration ?? 0.42,
      timer: 0,
      fired: false,
      recoil: 0,
      beamWidth: opts.beamWidth ?? 24,
      damage: opts.damage ?? 11,
      scale: opts.scale ?? 1.0,
      color: opts.color ?? '#4deeea',
      rotSpeed: opts.rotSpeed ?? 0,
      centerSpin: opts.centerSpin ?? false
    });
  }

      { x: bx + 144, w: 94,  vx: -60 },

      { x: bx + 150, w: 84,  vx: -94 },
      { x: bx + 40,  w: 82,  vx: 88 },

      { x: bx + 86,  w: 92,  vx: 0 },
