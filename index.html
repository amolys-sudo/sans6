  function beginBossTurn(forceUltStage = 0) {
    state.screen = 'DODGE';
    clearEntities();
    state.timer = 0;
    state.waveTimer = 0;
    state.waveStep = 0;
    state.soul.reversed = false;
    state.soul.twinSplit = false;
    state.sans.targetX = 360;
    state.sans.targetY = 34;

    if (forceUltStage > 0) {
      state.isUltimate = true;
      state.ultimateStage = forceUltStage;
    } else {
      state.isUltimate = false;
      state.ultimateStage = 0;
    }
    updateHudBadges();

    // 1. 필살기 3: 전체화면 전환 + 중앙 샌즈 뼈 흡수(맞으면 HP 1) + 12방향 2배 블래스터
    if (state.ultimateStage === 3) {
      state.duration = 12.6;
      state.patternName = '✦ 필살기 3: 전체화면 뼈 흡수 & 12방향 2배 블래스터';
      state.ult3.phase = 'VORTEX';
      state.ult3.vortexTimer = 0;
      state.ult3.blasterVolley = 0;
      state.ult3.maxVolleys = 3;
      state.ult3.volleyTimer = 0;

      state.box.tx = 20;
      state.box.ty = 20;
      state.box.tw = 680;
      state.box.th = 520;
      state.sans.targetX = 360;
      state.sans.targetY = 142;

      setSoulMode('RED');
      state.soul.x = 360;
      state.soul.y = 435;
      sfx.vortex();
      return;
    }

    // 2. 필살기 2: 16층 발판 타워 등반 + 무작위 1대씩 블래스터
    if (state.ultimateStage === 2) {
      state.duration = 48.0;
      state.patternName = '▲ 필살기 2: 16층 발판 타워 등반 & 1대씩 블래스터';
      state.ult2.phase = 'CLIMB';
      state.ult2.cameraY = 0;
      state.ult2.towerBottomY = 1220;
      state.ult2.risingBoneY = 1224;
      state.ult2.blastersFired = 0;
      state.ult2.blastersTotal = 10;

      state.sans.targetX = 135;
      state.sans.targetY = 44;
      state.box.tx = 240;
      state.box.ty = 48;
      state.box.tw = 260;
      state.box.th = 415;

      setSoulMode('BLUE');
      state.soul.x = 370;
      state.soul.y = 1166;
      state.soul.grounded = true;
      setupTowerPlatforms(240, 260);
      sfx.slam();
      return;
    }

    // 3. 필살기 1: 쌍둥이 8방향 초록 방패 + 4색 영혼 러시
    if (state.ultimateStage === 1) {
      state.duration = 20.5;
      state.patternName = '★ 필살기 1: 쌍둥이 8방향 초록 방패 & 4색 러시';
      state.box.tx = 160;
      state.box.ty = 246;
      state.box.tw = 400;
      state.box.th = 206;
      setSoulMode('GREEN');
      state.soul.twinSplit = true;
      state.soul.twinL = { x: 265, y: 349 };
      state.soul.twinR = { x: 455, y: 349 };
      return;
    }

    // 4. 종합필살기: 필살기 1 → 필살기 2 → 필살기 3 → 8방향 중력 바닥 뼈 + 페이크 낙하 + 조작 반전
    if (state.ultimateStage === 4) {
      state.duration = 44.0;
      state.patternName = '❖ 종합필살기 [1단계]: 쌍둥이 8방향 방패';
      state.grand.subPhase = 'U1_SHIELD';
      state.grand.subTimer = 0;
      state.grand.gravStep = 0;
      state.grand.fakeTriggered = false;

      state.box.tx = 160;
      state.box.ty = 246;
      state.box.tw = 400;
      state.box.th = 206;
      setSoulMode('GREEN');
      state.soul.twinSplit = true;
      state.soul.twinL = { x: 265, y: 349 };
      state.soul.twinR = { x: 455, y: 349 };
      return;
    }

    // 5. 일반 전투 웨이브 (Phase 1 / Phase 2 / Phase 3)
    const p = state.phase;
    const t = state.turn;
    state.duration = p === 1 ? 8.0 : (p === 2 ? 9.0 : 10.0);

    if (p === 1) {
      state.box.tx = 210;
      state.box.ty = 256;
      state.box.tw = 300;
      state.box.th = 196;
      const modes = ['RED', 'BLUE', 'GREEN', 'YELLOW', 'PURPLE'];
      const m = modes[(t - 1) % modes.length];
      setSoulMode(m);
      state.patternName = SOUL_NAMES[m];
      if (m === 'BLUE') {
        triggerGravitySlam('DOWN');
      }
    } else if (p === 2) {
      state.box.tx = 195;
      state.box.ty = 250;
      state.box.tw = 330;
      state.box.th = 202;
      const hybrids = ['HYBRID_RG', 'HYBRID_BY', 'HYBRID_GP'];
      const h = hybrids[(t - 1) % hybrids.length];
      setSoulMode(h);
      state.patternName = SOUL_NAMES[h];
      if (h === 'HYBRID_RG') {
        spawnGasterBlaster({
          x: 328,
          y: 351,
          offsetX: -32,
          offsetY: 0,
          angle: 0,
          chargeTime: 0.9,
          fireDuration: 9.2,
          beamWidth: 15,
          damage: 9,
          scale: 0.9,
          color: '#ff2a4b',
          rotSpeed: 1.45,
          centerSpin: true
        });
        spawnGasterBlaster({
          x: 392,
          y: 351,
          offsetX: 32,
          offsetY: 0,
          angle: Math.PI,
          chargeTime: 0.9,
          fireDuration: 9.2,
          beamWidth: 15,
          damage: 9,
          scale: 0.9,
          color: '#2ce64b',
          rotSpeed: -1.45,
          centerSpin: true
        });
      } else if (h === 'HYBRID_BY') {
        triggerGravitySlam('DOWN');
      }
    } else {
      state.box.tx = 195;
      state.box.ty = 250;
      state.box.tw = 330;
      state.box.th = 202;
      setSoulMode('RED');
      state.patternName = '각성 영혼 폭주 (실시간 전환)';
    }

    state.turn++;
  }

  function spawnTwinShieldArrowWave(idx) {
    const L = state.soul.twinL;
    const R = state.soul.twinR;
    const dirs = [
      { dx: 0, dy: -1 },
      { dx: 0.707, dy: -0.707 },
      { dx: 1, dy: 0 },
      { dx: 0.707, dy: 0.707 },
      { dx: 0, dy: 1 },
      { dx: -0.707, dy: 0.707 },
      { dx: -1, dy: 0 },
      { dx: -0.707, dy: -0.707 }
    ];
    const tiers = [
      { speed: 325, color: '#2699ff' },
      { speed: 220, color: '#2ce64b' },
      { speed: 150, color: '#ffe629' }
    ];

    const dL = dirs[(idx * 3 + Math.floor(Math.random() * 3)) % 8];
    const dR = dirs[(idx * 5 + 2 + Math.floor(Math.random() * 3)) % 8];
    const tL = tiers[idx % 3];
    const tR = tiers[(idx + 1 + (idx % 2)) % 3];
    const dist = 168;

    state.arrows.push({
      targetSoul: 'L',
      x: L.x + dL.dx * dist,
      y: L.y + dL.dy * dist,
      vx: -dL.dx * tL.speed,
      vy: -dL.dy * tL.speed,
      angle: Math.atan2(-dL.dy, -dL.dx),
      color: tL.color
    });
    state.arrows.push({
      targetSoul: 'R',
      x: R.x + dR.dx * dist,
      y: R.y + dR.dy * dist,
      vx: -dR.dx * tR.speed,
      vy: -dR.dy * tR.speed,
      angle: Math.atan2(-dR.dy, -dR.dx),
      color: tR.color
    });
  }

  function spawnVortexRing(cx, cy, count, baseAngle) {
    for (let i = 0; i < count; i++) {
      const ang = baseAngle + (i * Math.PI * 2) / count;
      const dist = 340 + (i % 2) * 35;
      state.vortexBones.push({
        cx,
        cy,
        angle: ang,
        dist,
        radialSpeed: 138,
        spinSpeed: 2.25,
        len: 30,
        thick: 8
      });
    }
  }

  function spawnTwelveWayBlasterVolley(cx, cy, rotOffset, dmg = 22) {
    const count = 12;
    for (let i = 0; i < count; i++) {
      const outAng = rotOffset + (i * Math.PI * 2) / count;
      const radius = 235;
      const bx = cx + Math.cos(outAng) * radius;
      const by = cy + Math.sin(outAng) * radius;
      spawnGasterBlaster({
        x: bx,
        y: by,
        angle: outAng + Math.PI,
        chargeTime: 0.54,
        fireDuration: 0.44,
        beamWidth: 23,
        damage: dmg,
        scale: 1.08,
        color: '#ff2a4b'
      });
    }
  }

  // =========================================================================
  // 6. 물리 & 충돌 & 업데이트 루프
  // =========================================================================
  function damagePlayer(amount = 8, krAdd = 6) {
    if (state.invuln > 0) return;
    const mult = state.enraged ? 2 : 1;
    const finalDmg = amount * mult;
    const finalKr = krAdd * mult;
    state.hp = Math.max(0, state.hp - finalDmg);
    state.kr = Math.min(Math.max(0, state.hp - 1), state.kr + finalKr);
    state.invuln = state.enraged ? 0.55 : 0.72;
    state.screenShake = Math.max(state.screenShake, 8);
    sfx.hurt();
    if (state.hp <= 0) {
      state.screen = 'GAMEOVER';
    }
  }

  function updateWaveSpawns(dt) {
    const prevT = state.waveTimer;
    state.waveTimer += dt;
    const t = state.waveTimer;
    const b = state.box;

    // -----------------------------------------------------------------------
    // A. 필살기 3: 전체화면 뼈 흡수(피격 시 HP 1) + 12방향 2배 블래스터
    // -----------------------------------------------------------------------
    if (state.ultimateStage === 3) {
      const cx = 360;
      const cy = 248;
      if (state.ult3.phase === 'VORTEX') {
        state.ult3.vortexTimer += dt;
        if (Math.floor(state.ult3.vortexTimer / 0.62) > Math.floor((state.ult3.vortexTimer - dt) / 0.62)) {
          spawnVortexRing(cx, cy, 8, state.ult3.vortexTimer * 1.9);
          sfx.vortex();
        }
        if (state.ult3.vortexTimer >= 4.2) {
          state.ult3.phase = 'BLASTERS';
          state.ult3.blasterVolley = 0;
          state.ult3.volleyTimer = 0.2;
          state.vortexBones = [];
          state.flashAlpha = 0.75;
          state.patternName = '✦ 필살기 3 [2단계]: 12방향 초고속 2배 가스터 블래스터!';
        }
      } else if (state.ult3.phase === 'BLASTERS') {
        state.ult3.volleyTimer -= dt;
        if (state.ult3.blasterVolley < state.ult3.maxVolleys && state.ult3.volleyTimer <= 0) {
          spawnTwelveWayBlasterVolley(cx, cy, state.ult3.blasterVolley * (Math.PI / 12), 22);
          state.ult3.blasterVolley++;
          state.ult3.volleyTimer = 1.15;
        }
      }
      return;
    }

    // -----------------------------------------------------------------------
    // B. 필살기 2: 16층 발판 타워 등반 + 상자 복귀 후 1대씩 블래스터
    // -----------------------------------------------------------------------
    if (state.ultimateStage === 2) {
      if (state.ult2.phase === 'CLIMB') {
        for (const pl of state.platforms) {
          if (pl.vx !== 0) {
            pl.x += pl.vx * dt;
            if (pl.x <= pl.minX) {
              pl.x = pl.minX;
              pl.vx = Math.abs(pl.vx);
            } else if (pl.x >= pl.maxX) {
              pl.x = pl.maxX;
              pl.vx = -Math.abs(pl.vx);
            }
          }
        }

        const maxCam = state.ult2.towerBottomY - (b.y + b.h);
        const desiredCam = Math.max(0, Math.min(maxCam, state.soul.y - (b.y + b.h * 0.46)));
        state.ult2.cameraY += (desiredCam - state.ult2.cameraY) * Math.min(1, dt * 7.5);

        state.ult2.risingBoneY -= 88 * dt;
        const maxLag = state.ult2.cameraY + b.y + b.h + 115;
        if (state.ult2.risingBoneY > maxLag) state.ult2.risingBoneY = maxLag;

        if (state.soul.y < 960 && state.soul.y > 210 && Math.floor(t / 2.2) > Math.floor(prevT / 2.2)) {
          const hazardY = state.soul.y - 95;
          const gapLeft = Math.floor(t / 2.2) % 2 === 0;
          const gapW = 86;
          if (gapLeft) {
            state.bones.push({ x: b.x + gapW + 10, y: hazardY, w: b.w - gapW - 14, h: 14, vx: 0, vy: 0, life: 1.5, color: '#ffffff' });
          } else {
            state.bones.push({ x: b.x + 4, y: hazardY, w: b.w - gapW - 14, h: 14, vx: 0, vy: 0, life: 1.5, color: '#ffffff' });
          }
          sfx.warn();
        }

        if (state.soul.y + 9 >= state.ult2.risingBoneY) {
          damagePlayer(9, 6);
          state.soul.y = Math.max(140, state.ult2.risingBoneY - 68);
          state.soul.vy = -340;
        }

        if (state.soul.y <= 106) {
          state.ult2.phase = 'SNIPE';
          state.timer = 0;
          state.duration = 10.5;
          state.waveTimer = 0;
          state.platforms = [];
          state.bones = [];
          state.ult2.cameraY = 0;
          state.flashAlpha = 0.8;
          state.sans.targetX = 360;
          state.sans.targetY = 34;

          state.box.tx = 200;
          state.box.ty = 250;
          state.box.tw = 320;
          state.box.th = 200;
          setSoulMode('RED');
          state.soul.x = 360;
          state.soul.y = 350;
          state.patternName = '▲ 필살기 2 [2단계]: 무작위 1대씩 블래스터 사격!';
        }
        return;
      }

      if (state.ult2.phase === 'SNIPE') {
        if (state.ult2.blastersFired < state.ult2.blastersTotal && Math.floor(t / 0.72) > Math.floor(prevT / 0.72)) {
          state.ult2.blastersFired++;
          const ang = Math.random() * Math.PI * 2;
          const gx = b.x + b.w / 2 + Math.cos(ang) * 205;
          const gy = b.y + b.h / 2 + Math.sin(ang) * 165;
          spawnGasterBlaster({
            x: gx,
            y: gy,
            angle: Math.atan2(state.soul.y - gy, state.soul.x - gx),
            chargeTime: 0.54,
            fireDuration: 0.38,
            beamWidth: 22,
            damage: 11,
            color: '#2699ff'
          });
        }
        if (state.ult2.blastersFired >= state.ult2.blastersTotal && state.blasters.length === 0) {
          state.timer = state.duration;
        }
        return;
      }
    }

    // -----------------------------------------------------------------------
    // C. 필살기 1: 쌍둥이 8방향 초록 방패 + 4색 영혼 러시
    // -----------------------------------------------------------------------
    if (state.ultimateStage === 1) {
      if (t < 10.5) {
        if (Math.floor(t / 0.96) > Math.floor(prevT / 0.96)) {
          spawnTwinShieldArrowWave(Math.floor(t / 0.96));
        }
      } else if (prevT < 10.5 && t >= 10.5) {
        clearEntities();
        state.soul.twinSplit = false;
        state.flashAlpha = 0.75;
        state.patternName = '★ 필살기 1 [2단계]: 4색 영혼 연속 변환 러시!';
        setSoulMode('BLUE');
        triggerGravitySlam('DOWN');
      } else if (t >= 11.4) {
        const subT = t - 11.4;
        const stg = Math.floor(subT / 2.2);
        const prevStg = Math.floor((prevT - 11.4) / 2.2);
        if (stg !== prevStg) {
          if (stg === 0) {
            setSoulMode('BLUE');
            triggerGravitySlam('UP');
          } else if (stg === 1) {
            setSoulMode('PURPLE');
            for (let i = 0; i < 4; i++) {
              const row = (i + 1) % 3;
              const ry = b.y + b.h * (0.2 + row * 0.3) - 14;
              addWarning(b.x + b.w - 28, ry, 28, 28, 0.42, 'FLY_BONE_LEFT', '!');
            }
          } else if (stg === 2) {
            setSoulMode('YELLOW');
            state.blocks.push({ kind: 'BAR', x: b.x + 20, y: b.y + 32, w: b.w - 40, h: 18, hp: 3, vy: 56 });
          } else if (stg >= 3) {
            setSoulMode('RED');
            for (let i = 0; i < 4; i++) {
              const ang = (i * Math.PI) / 2 + 0.4;
              spawnGasterBlaster({
                x: b.x + b.w / 2 + Math.cos(ang) * 210,
                y: b.y + b.h / 2 + Math.sin(ang) * 150,
                angle: ang + Math.PI,
                chargeTime: 0.65,
                fireDuration: 0.42,
                beamWidth: 22,
                damage: 11,
                color: '#2ce64b'
              });
            }
          }
        }
      }
      return;
    }

    // -----------------------------------------------------------------------
    // D. 종합필살기: 필살기 1 → 필살기 2 → 필살기 3 → 8방향 중력 바닥 뼈 + 페이크 + 반전
    // -----------------------------------------------------------------------
    if (state.ultimateStage === 4) {
      state.grand.subTimer += dt;
      const gt = state.grand.subTimer;
      const prevGt = gt - dt;

      if (state.grand.subPhase === 'U1_SHIELD') {
        if (Math.floor(gt / 0.9) > Math.floor(prevGt / 0.9)) {
          spawnTwinShieldArrowWave(Math.floor(gt / 0.9));
        }
        if (gt >= 6.8) {
          clearEntities();
          state.soul.twinSplit = false;
          state.grand.subPhase = 'U2_CLIMB';
          state.grand.subTimer = 0;
          state.ult2.phase = 'CLIMB';
          state.ult2.cameraY = 0;
          state.ult2.towerBottomY = 1220;
          state.ult2.risingBoneY = 1224;
          state.sans.targetX = 135;
          state.sans.targetY = 44;
          state.box.tx = 240;
          state.box.ty = 48;
          state.box.tw = 260;
          state.box.th = 415;
          setSoulMode('BLUE');
          state.soul.x = 370;
          state.soul.y = 1166;
          state.soul.grounded = true;
          setupTowerPlatforms(240, 260);
          state.patternName = '❖ 종합필살기 [2단계]: 16층 발판 타워 급속 등반!';
        }
      } else if (state.grand.subPhase === 'U2_CLIMB') {
        for (const pl of state.platforms) {
          if (pl.vx !== 0) {
            pl.x += pl.vx * 1.15 * dt;
            if (pl.x <= pl.minX) { pl.x = pl.minX; pl.vx = Math.abs(pl.vx); }
            else if (pl.x >= pl.maxX) { pl.x = pl.maxX; pl.vx = -Math.abs(pl.vx); }
          }
        }
        const maxCam = state.ult2.towerBottomY - (b.y + b.h);
        const desiredCam = Math.max(0, Math.min(maxCam, state.soul.y - (b.y + b.h * 0.46)));
        state.ult2.cameraY += (desiredCam - state.ult2.cameraY) * Math.min(1, dt * 8);

        state.ult2.risingBoneY -= 96 * dt;
        const maxLag = state.ult2.cameraY + b.y + b.h + 115;
        if (state.ult2.risingBoneY > maxLag) state.ult2.risingBoneY = maxLag;

        if (state.soul.y + 9 >= state.ult2.risingBoneY) {
          damagePlayer(9, 6);
          state.soul.y = Math.max(140, state.ult2.risingBoneY - 68);
          state.soul.vy = -350;
        }

        if (state.soul.y <= 106 || gt >= 14.5) {
          clearEntities();
          state.ult2.cameraY = 0;
          state.grand.subPhase = 'U3_FULLSCREEN';
          state.grand.subTimer = 0;
          state.ult3.phase = 'VORTEX';
          state.ult3.vortexTimer = 0;
          state.ult3.blasterVolley = 0;
          state.ult3.volleyTimer = 0;
          state.box.tx = 20;
          state.box.ty = 20;
          state.box.tw = 680;
          state.box.th = 520;
          state.sans.targetX = 360;
          state.sans.targetY = 142;
          setSoulMode('RED');
          state.soul.x = 360;
          state.soul.y = 435;
          state.patternName = '❖ 종합필살기 [3단계]: 전체화면 뼈 흡수 & 12방향 블래스터!';
        }
      } else if (state.grand.subPhase === 'U3_FULLSCREEN') {
        const cx = 360;
        const cy = 248;
        if (state.ult3.phase === 'VORTEX') {
          state.ult3.vortexTimer += dt;
          if (Math.floor(state.ult3.vortexTimer / 0.65) > Math.floor((state.ult3.vortexTimer - dt) / 0.65)) {
            spawnVortexRing(cx, cy, 8, state.ult3.vortexTimer * 2.0);
            sfx.vortex();
          }
          if (state.ult3.vortexTimer >= 3.0) {
            state.ult3.phase = 'BLASTERS';
            state.vortexBones = [];
            spawnTwelveWayBlasterVolley(cx, cy, 0, 22);
            state.ult3.blasterVolley = 1;
            state.ult3.volleyTimer = 1.1;
          }
        } else {
          state.ult3.volleyTimer -= dt;
          if (state.ult3.blasterVolley < 2 && state.ult3.volleyTimer <= 0) {
            spawnTwelveWayBlasterVolley(cx, cy, Math.PI / 12, 22);
            state.ult3.blasterVolley++;
            state.ult3.volleyTimer = 1.25;
          }
          if (gt >= 6.4) {
            clearEntities();
            state.grand.subPhase = 'GRAVITY_8WAY';
            state.grand.subTimer = 0;
            state.grand.gravStep = 0;
            state.sans.targetX = 360;
            state.sans.targetY = 34;
            state.box.tx = 195;
            state.box.ty = 246;
            state.box.tw = 330;
            state.box.th = 210;
            setSoulMode('BLUE');
            state.soul.x = 360;
            state.soul.y = 350;
            state.soul.reversed = true;
            state.patternName = '❖ 종합필살기 [최종]: 8방향 중력 바닥 뼈 + 페이크 + ⇄ 조작 반전!';
            triggerGravitySlam('DOWN');
          }
        }
      } else if (state.grand.subPhase === 'GRAVITY_8WAY') {
        const dirs8 = ['DOWN', 'UP', 'LEFT', 'RIGHT', 'DOWN_LEFT', 'DOWN_RIGHT', 'UP_LEFT', 'UP_RIGHT'];
        const step = Math.floor(gt / 1.15);
        const prevStep = Math.floor(prevGt / 1.15);
        if (step !== prevStep && step < dirs8.length) {
          const d = dirs8[step];
          if (step === 2 || step === 5) {
            // 페이크: 바닥 경고를 띄운 뒤 실제로는 천장에서 뼈가 낙하!
            sfx.warn();
            addWarning(b.x, b.y + b.h - 24, b.w, 24, 0.45, 'FAKE_CEILING_DROP', 'FAKE! ▲ 위에서 낙하!', '#ff4d6d');
          } else {
            triggerGravitySlam(d);
          }
        }
        if (gt >= 10.5) {
          state.timer = state.duration;
        }
      }
      return;
    }

    // -----------------------------------------------------------------------
    // E. 일반 턴 웨이브 스폰 (Phase 1 / 2 / 3)
    // -----------------------------------------------------------------------
    state.waveTimer += dt;
    if (state.waveTimer < 0.72) return;
    state.waveTimer = 0;
    state.waveStep++;
    const m = state.soul.mode;

    if (state.phase === 3 && state.waveStep % 3 === 0) {
      const cycleModes = ['RED', 'BLUE', 'GREEN', 'YELLOW', 'PURPLE'];
      const nextM = cycleModes[(state.waveStep / 3) % cycleModes.length];
      setSoulMode(nextM);
      state.patternName = '각성 전환: ' + SOUL_NAMES[nextM];
      if (nextM === 'BLUE') triggerGravitySlam('DOWN');
      return;
    }

    if (m === 'RED') {
      if (state.waveStep % 2 === 1) {
        const gapY = b.y + 30 + Math.random() * (b.h - 86);
        const fromLeft = state.waveStep % 4 === 1;
        const bx = fromLeft ? b.x - 16 : b.x + b.w;
        const vx = (fromLeft ? 1 : -1) * (185 + state.phase * 25);
        state.bones.push({ x: bx, y: b.y, w: 14, h: gapY - b.y, vx, vy: 0, color: '#ffffff' });
        state.bones.push({ x: bx, y: gapY + 54, w: 14, h: b.y + b.h - (gapY + 54), vx, vy: 0, color: '#ffffff' });
      } else {
        const fromLeft = Math.random() < 0.5;
        spawnGasterBlaster({
          x: fromLeft ? b.x - 42 : b.x + b.w + 42,
          y: state.soul.y,
          angle: fromLeft ? 0 : Math.PI,
          chargeTime: 0.62,
          fireDuration: 0.38,
          beamWidth: 22,
          damage: 10
        });
      }
    } else if (m === 'BLUE') {
      const fromRight = state.waveStep % 2 === 1;
      const wx = fromRight ? b.x + b.w - 26 : b.x;
      addWarning(wx, b.y + b.h - 26, 26, 26, 0.44, fromRight ? 'LOW_BONE_L' : 'LOW_BONE_R', '!');
      addWarning(wx, b.y, 26, b.h - 66, 0.44, fromRight ? 'TRAP_BONE_L' : 'TRAP_BONE_R', '! TRAP !', '#ff5566');
    } else if (m === 'GREEN') {
      const dirs = [0, Math.PI / 2, Math.PI, -Math.PI / 2];
      const ang = dirs[Math.floor(Math.random() * dirs.length)];
      const spd = 215 + state.phase * 20;
      state.arrows.push({
        x: state.soul.x + Math.cos(ang) * 165,
        y: state.soul.y + Math.sin(ang) * 165,
        vx: -Math.cos(ang) * spd,
        vy: -Math.sin(ang) * spd,
        angle: ang + Math.PI,
        color: '#2ce64b'
      });
    } else if (m === 'YELLOW') {
      state.waveTimer = -0.45;
      const patternRoll = state.waveStep % 3;
      if (patternRoll === 1) {
        state.blocks.push({
          kind: 'BAR',
          x: b.x + 14,
          y: b.y + 8,
          w: b.w - 28,
          h: 18,
          hp: 3,
          vy: 62
        });
        const bombX = b.x + 36 + Math.random() * (b.w - 102);
        state.blocks.push({
          kind: 'CROSS_BOMB',
          x: bombX,
          y: b.y + 32,
          w: 30,
          h: 30,
          hp: 1,
          vy: 74,
          fuse: 2.35
        });
      } else if (patternRoll === 2) {
        const cols = 4;
        const cellW = (b.w - 24) / cols;
        for (let c = 0; c < cols; c++) {
          const sqX = b.x + 12 + c * cellW + (cellW - 28) / 2;
          state.blocks.push({
            kind: 'SQUARE',
            x: sqX,
            y: b.y + 8 + (c % 2) * 18,
            w: 28,
            h: 28,
            hp: 2,
            vy: 76 + (c % 2) * 14,
            swayPhase: c * 1.4
          });
        }
        state.blocks.push({
          kind: 'CROSS_BOMB',
          x: b.x + b.w / 2 - 15,
          y: b.y + 38,
          w: 30,
          h: 30,
          hp: 1,
          vy: 68,
          fuse: 2.2
        });
      } else {
        state.blocks.push({
          kind: 'SQUARE',
          x: b.x + 28,
          y: b.y + 10,
          w: 28,
          h: 28,
          hp: 2,
          vy: 82,
          swayPhase: 0.5
        });
        state.blocks.push({
          kind: 'SQUARE',
          x: b.x + b.w - 56,
          y: b.y + 10,
          w: 28,
          h: 28,
          hp: 2,
          vy: 82,
          swayPhase: 2.3
        });
        state.blocks.push({
          kind: 'CROSS_BOMB',
          x: b.x + b.w * 0.35 - 15,
          y: b.y + 24,
          w: 30,
          h: 30,
          hp: 1,
          vy: 72,
          fuse: 2.15
        });
        state.blocks.push({
          kind: 'CROSS_BOMB',
          x: b.x + b.w * 0.65 - 15,
          y: b.y + 24,
          w: 30,
          h: 30,
          hp: 1,
          vy: 72,
          fuse: 2.55
        });
      }
    } else if (m === 'PURPLE') {
      if (state.waveStep % 2 === 1) {
        const col = state.waveStep % 3;
        const cw = b.w / 3;
        addWarning(b.x + col * cw + 8, b.y, cw - 16, b.h, 0.62, 'GRID_BEAM', '! BEAM !');
      } else {
        const row = Math.floor(Math.random() * 3);
        const ry = b.y + b.h * (0.2 + row * 0.3) - 14;
        addWarning(b.x + b.w - 26, ry, 26, 26, 0.42, 'FLY_BONE_LEFT', '!');
      }
    } else if (m === 'HYBRID_RG') {
      const sides = ['LEFT', 'RIGHT', 'TOP', 'BOTTOM'];
      const side = sides[Math.floor(Math.random() * sides.length)];
      const spd = 210;
      let ax = 0, ay = 0, vx = 0, vy = 0;
      if (side === 'LEFT')   { ax = b.x - 24; ay = state.soul.y; vx = spd; }
      if (side === 'RIGHT')  { ax = b.x + b.w + 24; ay = state.soul.y; vx = -spd; }
      if (side === 'TOP')    { ax = state.soul.x; ay = b.y - 24; vy = spd; }
      if (side === 'BOTTOM') { ax = state.soul.x; ay = b.y + b.h + 24; vy = -spd; }
      state.arrows.push({ x: ax, y: ay, vx, vy, angle: Math.atan2(vy, vx), color: '#2ce64b' });
    } else if (m === 'HYBRID_BY') {
      state.blocks.push({
        kind: 'BAR',
        x: b.x + 14,
        y: b.y + 8,
        w: b.w - 28,
        h: 18,
        hp: 2,
        vy: 56
      });
      const fromRight = state.waveStep % 2 === 0;
      const wx = fromRight ? b.x + b.w - 26 : b.x;
      addWarning(wx, b.y + b.h - 26, 26, 26, 0.44, fromRight ? 'LOW_BONE_L' : 'LOW_BONE_R', '! BONE !', '#2699ff');
    } else if (m === 'HYBRID_GP') {
      if (state.waveStep % 2 === 1) {
        const col = state.waveStep % 3;
        const cw = b.w / 3;
        addWarning(b.x + col * cw + 8, b.y, cw - 16, b.h, 0.62, 'GRID_BEAM', '! BEAM !', '#b84dff');
      } else {
        const fromRight = Math.random() < 0.5;
        const spd = 215;
        state.arrows.push({
          x: state.soul.x + (fromRight ? 175 : -175),
          y: state.soul.y,
          vx: (fromRight ? -1 : 1) * spd,
          vy: 0,
          angle: fromRight ? Math.PI : 0,
          color: '#2ce64b'
        });
      }
    }
  }

  function updateSoul(dt) {
    const s = state.soul;
    const b = state.box;

    let up = keys['arrowup'] || keys['w'];
    let down = keys['arrowdown'] || keys['s'];
    let left = keys['arrowleft'] || keys['a'];
    let right = keys['arrowright'] || keys['d'];
    const slow = keys['shift'] || keys['x'];

    if (s.reversed) {
      const tmpU = up, tmpL = left;
      up = down; down = tmpU;
      left = right; right = tmpL;
    }

    const spd = slow ? 115 : 225;

    // 1. 순수 초록 영혼 및 쌍둥이 초록 방패는 중앙에 고정되고 방패 각도만 8방향 회전
    if (s.twinSplit || s.mode === 'GREEN') {
      if (!s.twinSplit) {
        s.x = b.x + b.w / 2;
        s.y = b.y + b.h / 2;
      }
      const dx = (right ? 1 : 0) - (left ? 1 : 0);
      const dy = (down ? 1 : 0) - (up ? 1 : 0);
      if (dx !== 0 || dy !== 0) {
        s.shieldAngle = Math.atan2(dy, dx);
      }
      return;
    }

    // 2. 보라 영혼 & 보라+초록 혼합 영혼
    if (s.mode === 'PURPLE' || s.mode === 'HYBRID_GP') {
      if (justPressed['arrowup'] || justPressed['w']) {
        s.railIdx = Math.max(0, s.railIdx - 1);
        sfx.select();
      }
      if (justPressed['arrowdown'] || justPressed['s']) {
        s.railIdx = Math.min(2, s.railIdx + 1);
        sfx.select();
      }
      if (left) {
        s.x -= spd * dt;
        if (s.mode === 'HYBRID_GP' && !slow) s.shieldAngle = Math.PI;
      }
      if (right) {
        s.x += spd * dt;
        if (s.mode === 'HYBRID_GP' && !slow) s.shieldAngle = 0;
      }
      s.x = Math.max(b.x + 14, Math.min(b.x + b.w - 14, s.x));
      s.y = b.y + b.h * (0.2 + s.railIdx * 0.3);
      return;
    }

    // 3. 파랑 중력 영혼 & 파랑+노랑 혼합 영혼 & 필살기 2 타워 등반
    if (s.mode === 'BLUE' || s.mode === 'HYBRID_BY') {
      const isUlt2Climb =
        (state.ultimateStage === 2 && state.ult2.phase === 'CLIMB') ||
        (state.ultimateStage === 4 && state.grand.subPhase === 'U2_CLIMB');
      const grav = 780;
      const jumpVel = isUlt2Climb ? -365 : -335;
      const d = s.gravDir;

      if (d === 'DOWN' || d === 'UP') {
        if (left) s.x -= spd * dt;
        if (right) s.x += spd * dt;
        const jumpKey = d === 'DOWN' ? up : down;
        const sign = d === 'DOWN' ? 1 : -1;
        if (jumpKey && s.grounded) {
          s.vy = jumpVel * sign;
          s.grounded = false;
        }
        if (!jumpKey && s.vy * sign < -110) s.vy = -110 * sign;

        const prevY = s.y;
        s.vy += grav * sign * dt;
        s.y += s.vy * dt;

        if (d === 'DOWN' && s.vy >= 0 && state.platforms.length > 0) {
          for (const pl of state.platforms) {
            if (s.x + 8 >= pl.x && s.x - 8 <= pl.x + pl.w && prevY + 10 <= pl.y + 5 && s.y + 10 >= pl.y) {
              s.y = pl.y - 10;
              s.vy = 0;
              s.grounded = true;
              if (pl.vx !== 0) s.x += pl.vx * dt;
              break;
            }
          }
        }

        const floorY = isUlt2Climb ? state.ult2.towerBottomY - 11 : b.y + b.h - 11;
        const ceilY = isUlt2Climb ? 68 : b.y + 11;
        if (d === 'DOWN' && s.y >= floorY) { s.y = floorY; s.vy = 0; s.grounded = true; }
        if (d === 'UP' && s.y <= ceilY) { s.y = ceilY; s.vy = 0; s.grounded = true; }
      } else if (d === 'LEFT' || d === 'RIGHT') {
        if (up) s.y -= spd * dt;
        if (down) s.y += spd * dt;
        const jumpKey = d === 'LEFT' ? right : left;
        const sign = d === 'LEFT' ? -1 : 1;
        if (jumpKey && s.grounded) {
          s.vx = jumpVel * sign;
          s.grounded = false;
        }
        if (!jumpKey && s.vx * sign < -110) s.vx = -110 * sign;
        s.vx += grav * sign * dt;
        s.x += s.vx * dt;
        if (d === 'LEFT' && s.x <= b.x + 11) { s.x = b.x + 11; s.vx = 0; s.grounded = true; }
        if (d === 'RIGHT' && s.x >= b.x + b.w - 11) { s.x = b.x + b.w - 11; s.vx = 0; s.grounded = true; }
      } else {
        // 4대각선 중력 (DOWN_LEFT, DOWN_RIGHT, UP_LEFT, UP_RIGHT)
        const gx = d.includes('LEFT') ? -1 : 1;
        const gy = d.includes('UP') ? -1 : 1;
        const jumpDiag = up || down || left || right;
        if (jumpDiag && s.grounded) {
          s.vx = -gx * 255;
          s.vy = -gy * 255;
          s.grounded = false;
        }
        s.vx += gx * 560 * dt;
        s.vy += gy * 560 * dt;
        s.x += s.vx * dt;
        s.y += s.vy * dt;

        let touchX = false, touchY = false;
        if (gx < 0 && s.x <= b.x + 11) { s.x = b.x + 11; s.vx = 0; touchX = true; }
        if (gx > 0 && s.x >= b.x + b.w - 11) { s.x = b.x + b.w - 11; s.vx = 0; touchX = true; }
        if (gy < 0 && s.y <= b.y + 11) { s.y = b.y + 11; s.vy = 0; touchY = true; }
        if (gy > 0 && s.y >= b.y + b.h - 11) { s.y = b.y + b.h - 11; s.vy = 0; touchY = true; }
        if (touchX || touchY) s.grounded = true;
      }

      s.x = Math.max(b.x + 11, Math.min(b.x + b.w - 11, s.x));
      const topB = isUlt2Climb ? 68 : b.y + 11;
      const botB = isUlt2Climb ? state.ult2.towerBottomY - 11 : b.y + b.h - 11;
      s.y = Math.max(topB, Math.min(botB, s.y));

      if (s.mode === 'HYBRID_BY') handleShooterFire(dt);
      return;
    }

    // 4. 자유 8방향 이동 (RED, YELLOW, HYBRID_RG)
    let dx = (right ? 1 : 0) - (left ? 1 : 0);
    let dy = (down ? 1 : 0) - (up ? 1 : 0);
    if (dx !== 0 && dy !== 0) {
      dx *= 0.7071;
      dy *= 0.7071;
    }
    s.x += dx * spd * dt;
    s.y += dy * spd * dt;
    s.x = Math.max(b.x + 11, Math.min(b.x + b.w - 11, s.x));
    s.y = Math.max(b.y + 11, Math.min(b.y + b.h - 11, s.y));

    if (s.mode === 'HYBRID_RG' && !slow && (dx !== 0 || dy !== 0)) {
      s.shieldAngle = Math.atan2(dy, dx);
    }
    if (s.mode === 'YELLOW') {
      handleShooterFire(dt);
    }
  }

  function handleShooterFire(dt) {
    const s = state.soul;
    s.shootCd = Math.max(0, s.shootCd - dt);
    if ((keys['z'] || keys['enter'] || keys[' ']) && s.shootCd <= 0) {
      s.shootCd = 0.16;
      sfx.select();
      state.bullets.push({ x: s.x, y: s.y - 12, vy: -560 });
    }
  }

  function angleDiff(a, b) {
    let d = a - b;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return Math.abs(d);
  }

  function detonateCrossBomb(bomb) {
    const b = state.box;
    const cx = bomb.x + bomb.w / 2;
    const cy = bomb.y + bomb.h / 2;
    sfx.blasterFire();
    state.screenShake = Math.max(state.screenShake, 8);
    state.shockwaves.push({ x: cx, y: cy, r: 8, maxR: 75, alpha: 0.95, color: '#ff6b2b' });

    // 십자(+) 방향 빔 생성
    state.beams.push({ x: b.x + 2, y: cy - 11, w: b.w - 4, h: 22, life: 0.3, color: '#ff5522' });
    state.beams.push({ x: cx - 11, y: b.y + 2, w: 22, h: b.h - 4, life: 0.3, color: '#ff5522' });

    // 주변 일반/정사각형 블록 연쇄 파괴
    for (let k = state.blocks.length - 1; k >= 0; k--) {
      const other = state.blocks[k];
      if (other === bomb || other.kind === 'CROSS_BOMB') continue;
      const ocx = other.x + other.w / 2;
      const ocy = other.y + other.h / 2;
      if (Math.hypot(ocx - cx, ocy - cy) <= 105) {
        state.blocks.splice(k, 1);
      }
    }
  }

  function updateEntities(dt) {
    const s = state.soul;
    const b = state.box;

    // 1. 경고 표식 해석
    for (let i = state.warnings.length - 1; i >= 0; i--) {
      const w = state.warnings[i];
      w.timer -= dt;
      if (w.timer <= 0) {
        if (w.spawnType === 'GRAV_FLOOR_BONES') {
          sfx.slam();
          state.bones.push({ x: w.x, y: w.y, w: w.w, h: w.h, vx: 0, vy: 0, life: 0.44, color: w.boneColor });
        } else if (w.spawnType === 'FAKE_CEILING_DROP') {
          sfx.slam();
          state.bones.push({ x: b.x + 4, y: b.y, w: b.w - 8, h: 22, vx: 0, vy: 280, life: 0.9, color: '#ff4d6d' });
        } else if (w.spawnType === 'LOW_BONE_L' || w.spawnType === 'LOW_BONE_R') {
          const dir = w.spawnType === 'LOW_BONE_L' ? -1 : 1;
          state.bones.push({
            x: dir === -1 ? b.x + b.w : b.x - 14,
            y: b.y + b.h - 26,
            w: 14,
            h: 26,
            vx: dir * (190 + state.phase * 25),
            vy: 0,
            color: w.boneColor
          });
        } else if (w.spawnType === 'TRAP_BONE_L' || w.spawnType === 'TRAP_BONE_R') {
          const dir = w.spawnType === 'TRAP_BONE_L' ? -1 : 1;
          state.bones.push({
            x: dir === -1 ? b.x + b.w + 14 : b.x - 32,
            y: b.y,
            w: 18,
            h: b.h - 66,
            vx: dir * (190 + state.phase * 25),
            vy: 0,
            color: w.boneColor
          });
        } else if (w.spawnType === 'FLY_BONE_LEFT') {
          state.bones.push({
            x: b.x + b.w + 10,
            y: w.y,
            w: 14,
            h: 26,
            vx: -260,
            vy: 0,
            color: w.boneColor
          });
        } else if (w.spawnType === 'GRID_BEAM') {
          sfx.blasterFire();
          state.beams.push({ x: w.x, y: w.y, w: w.w, h: w.h, life: 0.28, color: w.boneColor || '#b84dff' });
        }
        state.warnings.splice(i, 1);
      }
    }

    // 2. 뼈 탄막
    for (let i = state.bones.length - 1; i >= 0; i--) {
      const bn = state.bones[i];
      if (bn.life !== undefined) {
        bn.life -= dt;
        if (bn.life <= 0) {
          state.bones.splice(i, 1);
          continue;
        }
      }
      bn.x += (bn.vx || 0) * dt;
      bn.y += (bn.vy || 0) * dt;
      if (s.x + 5 > bn.x && s.x - 5 < bn.x + bn.w && s.y + 5 > bn.y && s.y - 5 < bn.y + bn.h) {
        damagePlayer(8, 6);
      }
      const isClimb =
        (state.ultimateStage === 2 && state.ult2.phase === 'CLIMB') ||
        (state.ultimateStage === 4 && state.grand.subPhase === 'U2_CLIMB');
      if (!isClimb && (bn.x < b.x - 140 || bn.x > b.x + b.w + 140 || bn.y < b.y - 140 || bn.y > b.y + b.h + 140)) {
        state.bones.splice(i, 1);
      }
    }

    // 3. 격자 레이저 빔
    for (let i = state.beams.length - 1; i >= 0; i--) {
      const bm = state.beams[i];
      bm.life -= dt;
      if (s.x + 5 > bm.x && s.x - 5 < bm.x + bm.w && s.y + 5 > bm.y && s.y - 5 < bm.y + bm.h) {
        damagePlayer(9, 6);
      }
      if (bm.life <= 0) state.beams.splice(i, 1);
    }

    // 4. 필살기 3 & 종합필살기 소용돌이 흡수 뼈 (맞으면 체력 즉시 1!)
    for (let i = state.vortexBones.length - 1; i >= 0; i--) {
      const vb = state.vortexBones[i];
      vb.angle += vb.spinSpeed * dt;
      vb.dist -= vb.radialSpeed * dt;
      const vx = vb.cx + Math.cos(vb.angle) * vb.dist;
      const vy = vb.cy + Math.sin(vb.angle) * vb.dist;

      if (Math.hypot(s.x - vx, s.y - vy) < 14 && state.invuln <= 0) {
        state.hp = 1;
        state.kr = 0;
        state.invuln = 0.65;
        state.screenShake = Math.max(state.screenShake, 10);
        sfx.hurt();
        state.vortexBones.splice(i, 1);
        continue;
      }
      if (vb.dist <= 18) {
        state.vortexBones.splice(i, 1);
      }
    }

    // 5. 초록 방패용 화살표
    for (let i = state.arrows.length - 1; i >= 0; i--) {
      const ar = state.arrows[i];
      ar.x += ar.vx * dt;
      ar.y += ar.vy * dt;

      if (s.twinSplit) {
        const tgt = ar.targetSoul === 'L' ? s.twinL : s.twinR;
        const dist = Math.hypot(ar.x - tgt.x, ar.y - tgt.y);
        const inc = Math.atan2(ar.y - tgt.y, ar.x - tgt.x);
        if (dist <= 27 && dist >= 13 && angleDiff(inc, s.shieldAngle) <= 0.9) {
          sfx.block();
          state.arrows.splice(i, 1);
          continue;
        }
        if (dist < 11) {
          damagePlayer(9, 6);
          state.arrows.splice(i, 1);
          continue;
        }
      } else {
        const dist = Math.hypot(ar.x - s.x, ar.y - s.y);
        const inc = Math.atan2(ar.y - s.y, ar.x - s.x);
        if ((s.mode === 'GREEN' || s.mode === 'HYBRID_RG' || s.mode === 'HYBRID_GP') && dist <= 27 && dist >= 13 && angleDiff(inc, s.shieldAngle) <= 0.92) {
          sfx.block();
          state.arrows.splice(i, 1);
          continue;
        }
        if (dist < 10) {
          damagePlayer(8, 6);
          state.arrows.splice(i, 1);
          continue;
        }
      }
      if (ar.x < -60 || ar.x > W + 60 || ar.y < -60 || ar.y > H + 60) {
        state.arrows.splice(i, 1);
      }
    }

    // 6. 노랑 영혼 파괴 가능 블록 & 십자 폭탄 & 총알
    for (let i = state.blocks.length - 1; i >= 0; i--) {
      const bl = state.blocks[i];
      bl.y += bl.vy * dt;
      if (bl.kind === 'SQUARE' && bl.swayPhase !== undefined) {
        bl.swayPhase += dt * 3.2;
        bl.x += Math.cos(bl.swayPhase) * 28 * dt;
        bl.x = Math.max(b.x + 6, Math.min(b.x + b.w - bl.w - 6, bl.x));
      }
      if (bl.kind === 'CROSS_BOMB') {
        bl.fuse -= dt;
        if (bl.fuse <= 0 || bl.y + bl.h >= b.y + b.h - 6) {
          state.blocks.splice(i, 1);
          detonateCrossBomb(bl);
          continue;
        }
      }
      if (s.x + 5 > bl.x && s.x - 5 < bl.x + bl.w && s.y + 5 > bl.y && s.y - 5 < bl.y + bl.h) {
        if (bl.kind === 'CROSS_BOMB') {
          state.blocks.splice(i, 1);
          detonateCrossBomb(bl);
          continue;
        }
        damagePlayer(9, 6);
      }
      if (bl.y > b.y + b.h + 24) state.blocks.splice(i, 1);
    }

    for (let i = state.bullets.length - 1; i >= 0; i--) {
      const bul = state.bullets[i];
      bul.y += bul.vy * dt;
      let hit = false;
      for (let j = state.blocks.length - 1; j >= 0; j--) {
        const bl = state.blocks[j];
        if (bul.x > bl.x && bul.x < bl.x + bl.w && bul.y < bl.y + bl.h && bul.y > bl.y) {
          bl.hp--;
          hit = true;
          if (bl.hp <= 0) {
            state.blocks.splice(j, 1);
            if (bl.kind === 'CROSS_BOMB') {
              detonateCrossBomb(bl);
            } else {
              sfx.block();
            }
          } else {
            sfx.select();
          }
          break;
        }
      }
      if (hit || bul.y < b.y - 20) state.bullets.splice(i, 1);
    }

    // 7. 가스터 블래스터 (고출력 충격파 + 반동 + 빔 판정)
    for (let i = state.blasters.length - 1; i >= 0; i--) {
      const gb = state.blasters[i];
      gb.timer += dt;
      gb.recoil = Math.max(0, gb.recoil - dt * 42);

      if (gb.centerSpin) {
        gb.x = b.x + b.w / 2 + (gb.offsetX || 0);
        gb.y = b.y + b.h / 2 + (gb.offsetY || 0);
        if (gb.timer >= gb.chargeTime) {
          if (!gb.fired) {
            gb.fired = true;
            gb.recoil = 10;
            sfx.blasterFire();
            state.shockwaves.push({ x: gb.x, y: gb.y, r: 8, maxR: 72, alpha: 0.9, color: gb.color });
          }
          gb.angle += gb.rotSpeed * dt;
        }
      } else if (gb.timer >= gb.chargeTime && !gb.fired) {
        gb.fired = true;
        gb.recoil = 14;
        sfx.blasterFire();
        state.screenShake = Math.max(state.screenShake, 9);
        state.shockwaves.push({ x: gb.x, y: gb.y, r: 10, maxR: 92, alpha: 0.95, color: gb.color });
      }

      if (gb.fired) {
        const dx = s.x - gb.x;
        const dy = s.y - gb.y;
        const dist = Math.hypot(dx, dy);
        if (dist > 14) {
          const bAng = Math.atan2(dy, dx);
          const perp = Math.abs(Math.sin(bAng - gb.angle)) * dist;
          const fwd = Math.cos(bAng - gb.angle) * dist;
          if (fwd > 0 && perp < gb.beamWidth * 0.52) {
            damagePlayer(gb.damage, Math.round(gb.damage * 0.65));
          }
        }
      }

      if (!gb.centerSpin && gb.timer > gb.chargeTime + gb.fireDuration) {
        state.blasters.splice(i, 1);
      }
    }

    // 8. 충격파 링 업데이트
    for (let i = state.shockwaves.length - 1; i >= 0; i--) {
      const sw = state.shockwaves[i];
      sw.r += 240 * dt;
      sw.alpha -= 2.2 * dt;
      if (sw.alpha <= 0 || sw.r >= sw.maxR) state.shockwaves.splice(i, 1);
    }
  }

  function update(dt) {
    if (state.enraged) {
      if (state.maxHp !== 32) state.maxHp = 32;
      if (state.hp > 32) state.hp = 32;
    }

    const bgmActive = state.screen !== 'TITLE' && state.screen !== 'GAMEOVER' && state.screen !== 'VICTORY';
    sfx.updateBgm(dt, bgmActive, state.phase, state.enraged);

    // 샌즈 위치 & 흔들림/회피 감쇠
    state.sans.x += (state.sans.targetX - state.sans.x) * Math.min(1, dt * 8);
    state.sans.y += (state.sans.targetY - state.sans.y) * Math.min(1, dt * 8);
    if (state.sans.dodgeTimer > 0) {
      state.sans.dodgeTimer = Math.max(0, state.sans.dodgeTimer - dt);
      state.sans.dodgeOffset = Math.sin((1 - state.sans.dodgeTimer / 0.65) * Math.PI) * -90;
    } else {
      state.sans.dodgeOffset = 0;
    }
    if (state.sans.shake > 0) {
      state.sans.shake = Math.max(0, state.sans.shake - dt * 34);
    }

    // 전투 상자 크기 보간
    const b = state.box;
    b.x += (b.tx - b.x) * Math.min(1, dt * 12);
    b.y += (b.ty - b.y) * Math.min(1, dt * 12);
    b.w += (b.tw - b.w) * Math.min(1, dt * 12);
    b.h += (b.th - b.h) * Math.min(1, dt * 12);

    state.bossDisplayHp += (state.bossHp - state.bossDisplayHp) * Math.min(1, dt * 9);
    if (state.screenShake > 0) state.screenShake = Math.max(0, state.screenShake - dt * 34);
    if (state.flashAlpha > 0) state.flashAlpha = Math.max(0, state.flashAlpha - dt * 2.2);
    if (state.invuln > 0) state.invuln = Math.max(0, state.invuln - dt);

    // KR 독 감소
    if (state.kr > 0 && state.screen === 'DODGE' && Math.random() < dt * 2.4) {
      state.kr--;
      if (state.hp > 1) state.hp--;
    }

    if (state.screen === 'DIALOGUE') {
      state.dialogueTimer += dt;
      if (state.dialogueTimer >= 0.024) {
        state.dialogueTimer = 0;
        const curLine = state.dialogueLines[state.dialogueIdx] || '';
        if (state.dialogueChar < curLine.length) {
          state.dialogueChar++;
          if (state.dialogueChar % 3 === 0) sfx.voice();
        }
      }
      return;
    }

    if (state.screen === 'ATTACK_BAR') {
      if (!state.attackBar.locked) {
        state.attackBar.x += state.attackBar.dir * state.attackBar.speed * dt;
        if (state.attackBar.x >= W - 70) { state.attackBar.x = W - 70; state.attackBar.dir = -1; }
        if (state.attackBar.x <= 70) { state.attackBar.x = 70; state.attackBar.dir = 1; }
      } else {
        state.attackBar.timer -= dt;
        if (state.attackBar.timer <= 0) {
          if (state.bossHp <= 0) {
            if (state.phase < 3) {
              state.phase++;
              state.bossMaxHp = getPhaseMaxHp(state.phase);
              state.bossHp = state.bossMaxHp;
              state.bossDisplayHp = 0;
              state.screen = 'PHASE_TRANSITION';
              state.phaseTransition = { timer: 0 };
              sfx.phaseUp();
              updateHudBadges();
            } else {
              state.screen = 'VICTORY';
            }
          } else if (state.phase === 3 && state.bossHp === 1 && !state.ultimate1Survived) {
            startDialogue([
              '* ...하아, 하아... 체력이 1 남았나.',
              '* 그렇다면 내 모든 영혼 지배력을 해방한다! 첫 번째 필살기다!'
            ], () => beginBossTurn(1));
          } else if (state.ultimate2Survived && !state.ultimate3Survived && state.attackBar.dmgText === 'MISS') {
            startDialogue([
              '* 헛스윙이군! 아직 끝난 게 아니야.',
              '* 받아라, 세 번째 필살기 — 전체화면 12방향 블래스터!'
            ], () => beginBossTurn(3));
          } else {
            beginBossTurn(0);
          }
        }
      }
      return;
    }

    if (state.screen === 'PHASE_TRANSITION') {
      state.phaseTransition.timer += dt;
      if (state.phaseTransition.timer >= 1.55) {
        const msg = state.phase === 2
          ? `* PHASE 2 시작! 샌즈의 체력이 ${getPhaseMaxHp(2)} HP로 회복되었다!`
          : `* PHASE 3 최종 각성! 샌즈의 체력이 ${getPhaseMaxHp(3)} HP로 회복되었다!`;
        startDialogue([msg], () => beginBossTurn(0));
      }
      return;
    }

    if (state.screen === 'DODGE') {
      state.timer += dt;
      updateWaveSpawns(dt);
      updateSoul(dt);
      updateEntities(dt);

      if (state.timer >= state.duration) {
        clearEntities();
        state.soul.twinSplit = false;
        state.soul.reversed = false;
        state.sans.targetX = 360;
        state.sans.targetY = 34;

        if (state.ultimateStage === 1 && !state.ultimate1Survived) {
          state.ultimate1Survived = true;
          state.isUltimate = false;
          state.ultimateStage = 0;
          updateHudBadges();
          startDialogue([
            '* 헉... 헉... 첫 번째 필살기를 버텨냈다고?!',
            '* (샌즈가 지친 기색을 보인다. [행동 → 도발하기]로 몰아붙이자!)'
          ], () => openMenu());
        } else if (state.ultimateStage === 2 && !state.ultimate2Survived) {
          state.ultimate2Survived = true;
          state.isUltimate = false;
          state.ultimateStage = 0;
          updateHudBadges();
          startDialogue([
            '* 16층 발판 타워와 블래스터 연사까지 전부 피하다니...',
            '* (지금 [전투]로 공격해 보자!)'
          ], () => openMenu());
        } else if (state.ultimateStage === 3 && !state.ultimate3Survived) {
          state.ultimate3Survived = true;
          state.isUltimate = false;
          state.ultimateStage = 0;
          updateHudBadges();
          startDialogue([
            '* 말도 안 돼... 전체화면 12방향 블래스터까지 뚫어냈다고?!',
            '* ([행동] 메뉴에 금기의 [* X도발하기]가 개방되었다!)'
          ], () => openMenu());
        } else if (state.ultimateStage === 4 && !state.grandSurvived) {
          state.grandSurvived = true;
          state.isUltimate = false;
          state.ultimateStage = 0;
          updateHudBadges();
          startDialogue([
            '* 하아... 하아... 모든 필살기와 8방향 중력까지 전부 버텨내다니...',
            '* 이제 피할 힘이 없어... 네 [전투] 일격으로 끝내라.'
          ], () => openMenu());
        } else {
          openMenu();
        }
      }
    }
  }

  // =========================================================================
  // 7. 렌더링 (하트, 샌즈, 가스터 블래스터, 뼈, UI)
  // =========================================================================
  function drawHeart(x, y, r, color, upsideDown = false, splitColor2 = null) {
    ctx.save();
    ctx.translate(x, y);
    if (upsideDown) ctx.scale(1, -1);

    const path = () => {
      ctx.beginPath();
      ctx.moveTo(0, r * 0.85);
      ctx.bezierCurveTo(-r * 1.25, r * 0.1, -r * 1.25, -r * 0.85, 0, -r * 0.35);
      ctx.bezierCurveTo(r * 1.25, -r * 0.85, r * 1.25, r * 0.1, 0, r * 0.85);
      ctx.closePath();
    };

    if (!splitColor2) {
      ctx.fillStyle = color;
      path();
      ctx.fill();
    } else {
      ctx.save();
      ctx.beginPath();
      ctx.rect(-r * 2, -r * 2, r * 2, r * 4);
      ctx.clip();
      ctx.fillStyle = color;
      path();
      ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.beginPath();
      ctx.rect(0, -r * 2, r * 2, r * 4);
      ctx.clip();
      ctx.fillStyle = splitColor2;
      path();
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  function drawSans() {
    const sx = state.sans.x + state.sans.dodgeOffset + (state.sans.shake > 0 ? (Math.random() - 0.5) * state.sans.shake : 0);
    const sy = state.sans.y + (state.sans.shake > 0 ? (Math.random() - 0.5) * state.sans.shake : 0);

    let eyeCol = null;
    if (state.screen === 'DODGE') {
      const m = state.soul.mode;
      if (m === 'HYBRID_RG') eyeCol = Math.floor(performance.now() / 110) % 2 === 0 ? '#ff2a2a' : '#2ce64b';
      else if (m === 'HYBRID_BY') eyeCol = Math.floor(performance.now() / 110) % 2 === 0 ? '#2699ff' : '#ffe629';
      else if (m === 'HYBRID_GP') eyeCol = Math.floor(performance.now() / 110) % 2 === 0 ? '#2ce64b' : '#b84dff';
      else eyeCol = SOUL_COLORS[m] || '#4deeea';
    }

    const spr = getSansSpriteCanvas(eyeCol, state.soul.twinSplit, state.enraged);

    // 강화 버전 붉은 오라
    if (state.enraged) {
      const pulse = 0.55 + 0.35 * Math.sin(performance.now() * 0.008);
      ctx.save();
      ctx.globalAlpha = pulse;
      ctx.fillStyle = 'rgba(255, 42, 75, 0.28)';
      ctx.beginPath();
      ctx.ellipse(sx, sy + spr.height * 0.52, 74, 96, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 3페이즈: 빨강을 제외한 6개의 영혼(하늘·주황·파랑·보라·초록·노랑)이 샌즈 주위를 공전
    if (state.phase === 3) {
      const sixSouls = ['#4deeea', '#ff8c1a', '#2699ff', '#b84dff', '#2ce64b', '#ffe629'];
      const t = performance.now() * 0.0022;
      const cx = sx;
      const cy = sy + spr.height * 0.5;
      for (let i = 0; i < 6; i++) {
        const ang = t + (i * Math.PI * 2) / 6;
        const ox = cx + Math.cos(ang) * 112;
        const oy = cy + Math.sin(ang) * 44;
        if (Math.sin(ang) < 0) drawHeart(ox, oy, 7, sixSouls[i]);
      }
    }

    ctx.drawImage(spr, Math.round(sx - spr.width / 2), Math.round(sy));

    // 2페이즈 이상: 가슴 대각선 상처 스프라이트
    if (state.phase >= 2) {
      const ox = Math.round(sx - spr.width / 2);
      const oy = Math.round(sy);
      ctx.save();
      ctx.strokeStyle = '#ff1e38';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(ox + 17 * 3, oy + 30 * 3);
      ctx.lineTo(ox + 37 * 3, oy + 45 * 3);
      ctx.stroke();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(ox + 18 * 3, oy + 31 * 3);
      ctx.lineTo(ox + 36 * 3, oy + 44 * 3);
      ctx.stroke();
      ctx.restore();
    }

    if (state.phase === 3) {
      const sixSouls = ['#4deeea', '#ff8c1a', '#2699ff', '#b84dff', '#2ce64b', '#ffe629'];
      const t = performance.now() * 0.0022;
      const cx = sx;
      const cy = sy + spr.height * 0.5;
      for (let i = 0; i < 6; i++) {
        const ang = t + (i * Math.PI * 2) / 6;
        const ox = cx + Math.cos(ang) * 112;
        const oy = cy + Math.sin(ang) * 44;
        if (Math.sin(ang) >= 0) drawHeart(ox, oy, 7, sixSouls[i]);
      }
    }
  }

  function drawBlaster(gb) {
    const pair = getBlasterSpritePair(gb.color);
    const sc = gb.scale || 1.0;

    ctx.save();
    ctx.translate(gb.x, gb.y);
    ctx.rotate(gb.angle);
    ctx.translate(-(gb.recoil || 0), 0);

    if (!gb.fired) {
      const pct = Math.min(1, gb.timer / gb.chargeTime);
      ctx.strokeStyle = gb.color;
      ctx.globalAlpha = 0.25 + pct * 0.55;
      ctx.lineWidth = 1.5 + pct * 2.5;
      ctx.setLineDash([8, 6]);
      ctx.beginPath();
      ctx.moveTo(24 * sc, 0);
      ctx.lineTo(780, 0);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.globalAlpha = 1;

      const orbR = 3 + pct * 11;
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = gb.color;
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(28 * sc, 0, orbR, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    } else {
      const fade = Math.max(0, 1 - Math.max(0, gb.timer - gb.chargeTime) / gb.fireDuration);
      const bw = gb.beamWidth * (0.7 + 0.3 * fade);
      ctx.save();
      ctx.globalAlpha = Math.min(1, fade * 1.4);
      ctx.shadowColor = gb.color;
      ctx.shadowBlur = 22;
      ctx.fillStyle = gb.color;
      ctx.fillRect(22 * sc, -bw * 0.65, 820, bw * 1.3);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(22 * sc, -bw * 0.36, 820, bw * 0.72);
      ctx.restore();
    }

    // 첨부 이미지 기반 34x41 가스터 블래스터 도트 스프라이트
    ctx.save();
    ctx.rotate(-Math.PI / 2);
    ctx.scale(sc, sc);
    const jawOpen = gb.fired ? 9 : Math.min(5, (gb.timer / gb.chargeTime) * 4);
    ctx.drawImage(pair.upper, -pair.w / 2, -pair.h / 2);
    ctx.drawImage(pair.jaw, -pair.w / 2, -pair.h / 2 + jawOpen);
    ctx.restore();

    ctx.restore();
  }

  function drawBone(x, y, w, h, color = '#ffffff') {
    ctx.fillStyle = color;
    if (h >= w) {
      ctx.fillRect(x + 3, y + 3, Math.max(4, w - 6), Math.max(2, h - 6));
      ctx.fillRect(x, y, w, 5);
      ctx.fillRect(x, y + h - 5, w, 5);
    } else {
      ctx.fillRect(x + 3, y + 3, Math.max(2, w - 6), Math.max(4, h - 6));
      ctx.fillRect(x, y, 5, h);
      ctx.fillRect(x + w - 5, y, 5, h);
    }
  }

  function render() {
    ctx.save();
    if (state.screenShake > 0) {
      ctx.translate((Math.random() - 0.5) * state.screenShake, (Math.random() - 0.5) * state.screenShake);
    }

    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);

    // 1. 타이틀 화면
    if (state.screen === 'TITLE') {
      state.sans.x = W / 2;
      state.sans.y = 78;
      drawSans();

      ctx.save();
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 28px "Courier New", "Malgun Gothic", monospace';
      ctx.fillText('SANS: SOUL SOVEREIGN', W / 2, 326);

      ctx.fillStyle = '#4deeea';
      ctx.font = 'bold 14px "Courier New", "Malgun Gothic", monospace';
      ctx.fillText('영혼의 지배자 — 3페이즈 & 필살기 1·2·3 & 종합필살기', W / 2, 352);

      ctx.fillStyle = '#ffe629';
      ctx.font = 'bold 18px "Courier New", "Malgun Gothic", monospace';
      ctx.fillText('[ Z / Enter / 화면 터치 ] 일반 전투 시작', W / 2, 392);

      ctx.fillStyle = '#ff6b81';
      ctx.font = 'bold 16px "Courier New", "Malgun Gothic", monospace';
      ctx.fillText('[ 2 / 상단 ⚠ 강화 버전 버튼 ] 강화 샌즈 도전 (HP 32 · 2배)', W / 2, 424);

      ctx.fillStyle = '#b0b8cc';
      ctx.font = 'bold 13px "Courier New", "Malgun Gothic", monospace';
      ctx.fillText('※ [행동] → [도발하기]를 사용해야 샌즈에게 공격이 적중합니다.', W / 2, 460);
      ctx.restore();
      return;
    }

    // 2. 보스 체력 게이지 (상단)
    const barW = 420;
    const barX = (W - barW) / 2;
    const barY = 14;
    ctx.fillStyle = '#330000';
    ctx.fillRect(barX, barY, barW, 14);
    const ratio = Math.max(0, Math.min(1, state.bossDisplayHp / state.bossMaxHp));
    ctx.fillStyle = state.enraged ? '#ff2a4b' : (state.phase === 3 ? '#ff4d6d' : '#2ce64b');
    ctx.fillRect(barX, barY, barW * ratio, 14);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(barX, barY, barW, 14);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 12px "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.fillText(
      `${state.enraged ? 'ENRAGED ' : ''}SANS [P${state.phase}]  ${Math.ceil(state.bossDisplayHp)} / ${state.bossMaxHp}`,
      W / 2,
      barY + 11
    );
    ctx.textAlign = 'left';

    const isFullscreenUlt3 =
      state.screen === 'DODGE' &&
      (state.ultimateStage === 3 || (state.ultimateStage === 4 && state.grand.subPhase === 'U3_FULLSCREEN'));

    if (!isFullscreenUlt3) {
      drawSans();
    }

    // 3. 전투 상자 테두리
    const b = state.box;
    ctx.fillStyle = '#000000';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = state.enraged ? '#ff2a4b' : '#ffffff';
    ctx.lineWidth = 4;
    ctx.strokeRect(b.x, b.y, b.w, b.h);

    if (isFullscreenUlt3) {
      drawSans();
    }

    // 4. 회피(전투) 화면 렌더링
    if (state.screen === 'DODGE') {
      const isUlt2Climb =
        (state.ultimateStage === 2 && state.ult2.phase === 'CLIMB') ||
        (state.ultimateStage === 4 && state.grand.subPhase === 'U2_CLIMB');
      const camOffset = isUlt2Climb ? state.ult2.cameraY : 0;

      ctx.fillStyle = '#ffe629';
      ctx.font = 'bold 13px "Courier New", "Malgun Gothic", monospace';
      ctx.textAlign = 'center';
      ctx.fillText(state.patternName, W / 2, Math.max(38, b.y - 8));
      ctx.textAlign = 'left';

      // 보라 영혼 3줄 거미줄 레일
      if (state.soul.mode === 'PURPLE' || state.soul.mode === 'HYBRID_GP') {
        ctx.strokeStyle = '#9933dd';
        ctx.lineWidth = 2;
        for (let r = 0; r < 3; r++) {
          const ry = b.y + b.h * (0.2 + r * 0.3);
          ctx.beginPath();
          ctx.moveTo(b.x + 8, ry);
          ctx.lineTo(b.x + b.w - 8, ry);
          ctx.stroke();
        }
      }

      // 필살기 2 타워 등반 플랫폼 & 상승 뼈
      if (isUlt2Climb) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(b.x + 2, b.y + 2, b.w - 4, b.h - 4);
        ctx.clip();

        const goalY = 58 - camOffset;
        if (goalY + 40 >= b.y) {
          ctx.fillStyle = 'rgba(44, 230, 75, 0.25)';
          ctx.fillRect(b.x + 4, goalY, b.w - 8, 38);
          ctx.fillStyle = '#2ce64b';
          ctx.font = 'bold 13px "Courier New", monospace';
          ctx.textAlign = 'center';
          ctx.fillText('▲ TOP GOAL ▲', b.x + b.w / 2, goalY + 24);
          ctx.textAlign = 'left';
        }

        for (const pl of state.platforms) {
          const py = pl.y - camOffset;
          if (py < b.y - 20 || py > b.y + b.h + 20) continue;
          ctx.fillStyle = pl.vx !== 0 ? '#4deeea' : '#ffffff';
          ctx.fillRect(pl.x, py, pl.w, pl.h);
        }

        const boneTop = Math.max(b.y + 36, state.ult2.risingBoneY - camOffset);
        const boneBot = b.y + b.h - 2;
        if (boneTop < boneBot) {
          for (let bx = b.x + 6; bx < b.x + b.w - 8; bx += 18) {
            drawBone(bx, boneTop, 14, boneBot - boneTop, '#ffffff');
          }
        }
        ctx.restore();
      }

      // 경고 표식
      for (const w of state.warnings) {
        const flash = Math.floor(w.timer * 24) % 2 === 0;
        ctx.fillStyle = flash ? 'rgba(255, 42, 42, 0.32)' : 'rgba(255, 230, 41, 0.25)';
        ctx.fillRect(w.x, w.y, w.w, w.h);
        ctx.strokeStyle = flash ? '#ff2a2a' : '#ffe629';
        ctx.lineWidth = 2;
        ctx.strokeRect(w.x, w.y, w.w, w.h);
        ctx.fillStyle = flash ? '#ffe629' : '#ff2a2a';
        ctx.font = 'bold 14px "Courier New", "Malgun Gothic", monospace';
        ctx.textAlign = 'center';
        ctx.fillText(w.label, w.x + w.w / 2, w.y + w.h / 2 + 5);
        ctx.textAlign = 'left';
      }

      // 뼈 & 레이저 빔
      for (const bn of state.bones) {
        drawBone(bn.x, bn.y - camOffset, bn.w, bn.h, bn.color || '#ffffff');
      }
      for (const bm of state.beams) {
        ctx.fillStyle = bm.color || '#b84dff';
        ctx.fillRect(bm.x, bm.y, bm.w, bm.h);
      }

      // 소용돌이 흡수 뼈
      for (const vb of state.vortexBones) {
        const vx = vb.cx + Math.cos(vb.angle) * vb.dist;
        const vy = vb.cy + Math.sin(vb.angle) * vb.dist;
        ctx.save();
        ctx.translate(vx, vy);
        ctx.rotate(vb.angle + Math.PI / 2);
        drawBone(-vb.thick / 2, -vb.len / 2, vb.thick, vb.len, '#ff4d6d');
        ctx.restore();
      }

      // 노랑 영혼 블록 & 십자 폭탄 & 총알
      for (const bl of state.blocks) {
        if (bl.kind === 'CROSS_BOMB') {
          const urgent = bl.fuse < 0.7 && Math.floor(bl.fuse * 24) % 2 === 0;
          ctx.fillStyle = urgent ? '#ffe629' : '#cc2233';
          ctx.fillRect(bl.x, bl.y, bl.w, bl.h);
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.strokeRect(bl.x, bl.y, bl.w, bl.h);
          ctx.fillStyle = urgent ? '#cc2233' : '#ffe629';
          ctx.fillRect(bl.x + bl.w / 2 - 3, bl.y + 5, 6, bl.h - 10);
          ctx.fillRect(bl.x + 5, bl.y + bl.h / 2 - 3, bl.w - 10, 6);
        } else if (bl.kind === 'SQUARE') {
          ctx.fillStyle = bl.hp === 1 ? '#ffae33' : '#ffe629';
          ctx.fillRect(bl.x, bl.y, bl.w, bl.h);
          ctx.strokeStyle = '#000000';
          ctx.lineWidth = 2;
          ctx.strokeRect(bl.x, bl.y, bl.w, bl.h);
          if (bl.hp === 1) {
            ctx.beginPath();
            ctx.moveTo(bl.x + 4, bl.y + 4);
            ctx.lineTo(bl.x + bl.w - 4, bl.y + bl.h - 4);
            ctx.stroke();
          }
        } else {
          ctx.fillStyle = '#ffe629';
          ctx.fillRect(bl.x, bl.y, bl.w, bl.h);
          ctx.strokeStyle = '#000000';
          ctx.lineWidth = 2;
          ctx.strokeRect(bl.x, bl.y, bl.w, bl.h);
        }
      }
      for (const bul of state.bullets) {
        ctx.fillStyle = '#ffe629';
        ctx.beginPath();
        ctx.arc(bul.x, bul.y, 4.5, 0, Math.PI * 2);
        ctx.fill();
      }

      // 초록 방패용 화살표
      for (const ar of state.arrows) {
        ctx.save();
        ctx.translate(ar.x, ar.y);
        ctx.rotate(ar.angle);
        ctx.fillStyle = ar.color || '#2ce64b';
        ctx.beginPath();
        ctx.moveTo(10, 0);
        ctx.lineTo(-6, -6);
        ctx.lineTo(-3, 0);
        ctx.lineTo(-6, 6);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      }

      // 가스터 블래스터 & 충격파
      for (const gb of state.blasters) drawBlaster(gb);
      for (const sw of state.shockwaves) {
        ctx.save();
        ctx.globalAlpha = Math.max(0, sw.alpha);
        ctx.strokeStyle = sw.color;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // 플레이어 영혼 하트 & 방패
      const blink = state.invuln > 0 && Math.floor(state.invuln * 20) % 2 === 0;
      const s = state.soul;
      const drawY = s.y - camOffset;
      if (!blink) {
        const drawShieldArc = (sx, sy) => {
          ctx.save();
          ctx.translate(sx, sy);
          ctx.strokeStyle = '#2ce64b';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(0, 0, 22, s.shieldAngle - 0.85, s.shieldAngle + 0.85);
          ctx.stroke();
          ctx.restore();
        };

        if (s.twinSplit) {
          drawHeart(s.twinL.x, s.twinL.y, 9, '#2ce64b');
          drawShieldArc(s.twinL.x, s.twinL.y);
          drawHeart(s.twinR.x, s.twinR.y, 9, '#2ce64b');
          drawShieldArc(s.twinR.x, s.twinR.y);
        } else if (s.mode === 'HYBRID_RG') {
          drawHeart(s.x, drawY, 9, '#ff2a2a', false, '#2ce64b');
          drawShieldArc(s.x, drawY);
        } else if (s.mode === 'HYBRID_BY') {
          drawHeart(s.x, drawY, 9, '#2699ff', true, '#ffe629');
        } else if (s.mode === 'HYBRID_GP') {
          drawHeart(s.x, drawY, 9, '#b84dff', false, '#2ce64b');
          drawShieldArc(s.x, drawY);
        } else if (s.mode === 'GREEN') {
          drawHeart(s.x, drawY, 9, '#2ce64b');
          drawShieldArc(s.x, drawY);
        } else if (s.mode === 'YELLOW') {
          drawHeart(s.x, drawY, 9, '#ffe629', true);
        } else {
          drawHeart(s.x, drawY, 9, SOUL_COLORS[s.mode] || '#ff2a2a');
        }
      }
    }

    // 5. 대화 / 메뉴 / 공격 바 렌더링
    if (state.screen === 'DIALOGUE') {
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 18px "Courier New", "Malgun Gothic", monospace';
      const curText = (state.dialogueLines[state.dialogueIdx] || '').slice(0, state.dialogueChar);
      const wrapped = wrapTextLines(curText, b.w - 44);
      wrapped.forEach((ln, idx) => ctx.fillText(ln, b.x + 22, b.y + 42 + idx * 28));
    }

    if (state.screen === 'MENU') {
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 18px "Courier New", "Malgun Gothic", monospace';
      if (!state.subMenuType) {
        const prompt = state.grandSurvived
          ? '* 샌즈가 완전히 탈진했다! 지금 [전투]로 끝내자!'
          : (state.provoked
            ? '* 샌즈가 도발에 걸려들었다! 지금 [전투] 공격이 적중한다!'
            : '* 샌즈가 당신의 영혼을 주시하고 있다. ([행동] → [도발하기] 필요)');
        wrapTextLines(prompt, b.w - 44).forEach((ln, idx) => ctx.fillText(ln, b.x + 22, b.y + 42 + idx * 28));
      } else {
        const list = state.subMenuType === 'ACT' ? getActOptions() : state.items;
        list.forEach((it, idx) => {
          const yy = b.y + 44 + idx * 34;
          if (idx === state.subMenuIdx) {
            drawHeart(b.x + 28, yy - 6, 7, '#ff2a2a');
            ctx.fillStyle = '#ffe629';
          } else {
            ctx.fillStyle = '#ffffff';
          }
          const lbl = it.label || `* ${it.name} (+${it.heal} HP)`;
          ctx.fillText(lbl, b.x + 46, yy);
        });
      }
    }

    if (state.screen === 'ATTACK_BAR') {
      const cx = b.x + b.w / 2;
      ctx.strokeStyle = '#2ce64b';
      ctx.lineWidth = 3;
      ctx.strokeRect(cx - 22, b.y + 18, 44, b.h - 36);
      ctx.strokeStyle = '#ff8c1a';
      ctx.strokeRect(cx - 90, b.y + 30, 180, b.h - 60);

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(state.attackBar.x - 5, b.y + 12, 10, b.h - 24);

      if (state.attackBar.dmgText) {
        ctx.fillStyle = state.attackBar.dmgText === 'MISS' ? '#cccccc' : '#ff2a4b';
        ctx.font = 'bold 34px "Courier New", monospace';
        ctx.textAlign = 'center';
        ctx.fillText(state.attackBar.dmgText, state.sans.x, 120);
        ctx.textAlign = 'left';
      }
    }

    // 6. 하단 플레이어 HP 바 & 4대 커맨드 버튼
    if (!isFullscreenUlt3) {
      const hpY = 466;
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 16px "Courier New", monospace';
      ctx.fillText(state.enraged ? 'CHARA  LV 19 [CURSED]' : 'CHARA  LV 19', 44, hpY + 16);
      ctx.font = 'bold 13px "Courier New", monospace';
      ctx.fillText('HP', 248, hpY + 16);

      const bx = 276;
      const bw = 136;
      ctx.fillStyle = '#880000';
      ctx.fillRect(bx, hpY + 2, bw, 18);
      const solid = Math.max(0, state.hp - state.kr);
      ctx.fillStyle = '#ffe629';
      ctx.fillRect(bx, hpY + 2, bw * (solid / state.maxHp), 18);
      if (state.kr > 0) {
        ctx.fillStyle = '#b84dff';
        ctx.fillRect(bx + bw * (solid / state.maxHp), hpY + 2, bw * (state.kr / state.maxHp), 18);
      }

      ctx.fillStyle = state.kr > 0 ? '#d888ff' : '#ffffff';
      ctx.font = 'bold 16px "Courier New", monospace';
      ctx.fillText(`KR ${state.hp} / ${state.maxHp}`, bx + bw + 14, hpY + 16);

      const cmds = ['전투', '행동', '아이템', '자비'];
      cmds.forEach((lbl, idx) => {
        const cx = 44 + idx * 162;
        const cy = 500;
        const active = state.screen === 'MENU' && state.mainMenuIdx === idx;
        ctx.strokeStyle = active ? '#ffe629' : '#ff8c1a';
        ctx.lineWidth = 3;
        ctx.strokeRect(cx, cy, 144, 44);
        if (active) drawHeart(cx + 22, cy + 22, 7, '#ff2a2a');
        ctx.fillStyle = active ? '#ffe629' : '#ff8c1a';
        ctx.font = 'bold 19px "Courier New", "Malgun Gothic", monospace';
        ctx.fillText(lbl, cx + 42, cy + 29);
      });
    }

    // 7. 페이즈 전환 / 게임오버 / 승리 오버레이
    if (state.screen === 'PHASE_TRANSITION') {
      ctx.fillStyle = 'rgba(0,0,0,0.72)';
      ctx.fillRect(0, 220, W, 110);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#2ce64b';
      ctx.font = 'bold 26px "Courier New", monospace';
      ctx.fillText(`PHASE ${state.phase} — FULL HP RECOVERED!`, W / 2, 268);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 15px "Malgun Gothic", monospace';
      ctx.fillText(`샌즈의 체력이 ${state.bossMaxHp} HP로 완전히 회복되었다!`, W / 2, 302);
      ctx.textAlign = 'left';
    }

    if (state.screen === 'GAMEOVER') {
      ctx.fillStyle = 'rgba(0,0,0,0.88)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ff2a4b';
      ctx.font = 'bold 46px "Courier New", monospace';
      ctx.fillText('GAME OVER', W / 2, 240);
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 17px "Malgun Gothic", monospace';
      ctx.fillText('[Z / Enter / 화면 터치] 타이틀로 복귀', W / 2, 305);
      ctx.textAlign = 'left';
    }

    if (state.screen === 'VICTORY') {
      ctx.fillStyle = 'rgba(0,0,0,0.88)';
      ctx.fillRect(0, 0, W, H);
      state.sans.x = W / 2;
      state.sans.y = 78;
      drawSans();
      ctx.textAlign = 'center';
      ctx.fillStyle = '#2ce64b';
      ctx.font = 'bold 30px "Courier New", monospace';
      ctx.fillText('VICTORY — SOUL SOVEREIGN DEFEATED!', W / 2, 330);
      ctx.fillStyle = '#ffe629';
      ctx.font = 'bold 16px "Malgun Gothic", monospace';
      ctx.fillText('* ...대단하군. 모든 영혼과 필살기를 돌파하다니.', W / 2, 372);
      ctx.fillStyle = '#cccccc';
      ctx.font = '14px "Malgun Gothic", monospace';
      ctx.fillText('[Z / Enter / 화면 터치] 타이틀 화면으로 돌아가기', W / 2, 418);
      ctx.textAlign = 'left';
    }

    if (state.flashAlpha > 0) {
      ctx.fillStyle = '#ffffff';
      ctx.globalAlpha = state.flashAlpha;
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }

    ctx.restore();
  }

  // =========================================================================
  // 8. 게임 초기화 & 입력 (키보드 / 모바일 터치 패드 / 화면 직접 드래그)
  // =========================================================================
  function startNewGame(ultStage = 0, forceEnraged = false) {
    sfx.init();
    state.enraged = Boolean(forceEnraged);

    state.turn = 1;
    state.phase = ultStage > 0 ? 3 : 1;
    state.provoked = false;
    state.focusBonus = 0;
    state.bossMaxHp = getPhaseMaxHp(state.phase);
    state.bossHp = ultStage > 0 ? 1 : state.bossMaxHp;
    state.bossDisplayHp = state.bossHp;

    state.maxHp = state.enraged ? 32 : 92;
    state.hp = state.maxHp;
    state.kr = 0;
    state.invuln = 0;
    state.items = ITEMS.map(x => ({ ...x }));
    state.ultimate1Survived = (ultStage >= 2);
    state.ultimate2Survived = (ultStage >= 3);
    state.ultimate3Survived = (ultStage >= 4);
    state.grandSurvived = false;
    state.sans.sweat = (ultStage > 0 || state.enraged) ? 1 : 0;
    state.sans.x = W / 2;
    state.sans.targetX = W / 2;
    state.sans.y = 34;
    state.sans.targetY = 34;
    sfx.resetBgm();
    updateHudBadges();

    if (state.enraged) {
      sfx.phaseUp();
      startDialogue([
        '* ...강화 버전을 직접 선택했군. 후회하지 마라.',
        '* 봐줄 생각은 전혀 없어. [강화 샌즈: 플레이어 HP 32 / 체력·공격력 2배!]'
      ], () => openMenu());
    } else {
      startDialogue([
        '* 맑은 날이야. 새들은 지저귀고, 꽃들은 피어나고...',
        '* 이런 날엔 네 영혼을 자유자재로 조종해 줄 수밖에 없겠지.'
      ], () => openMenu());
    }
  }

  const keys = {};
  const justPressed = {};

  function triggerVirtualPress(k) {
    sfx.init();
    if (!keys[k]) justPressed[k] = true;
    keys[k] = true;

    const isConfirm = (k === 'z' || k === 'enter' || k === ' ');
    const isCancel = (k === 'x' || k === 'escape');

    if (state.screen === 'TITLE') {
      if (isConfirm || k === '1') startNewGame(0, false);
      else if (k === '2') startNewGame(0, true);
      return;
    }

    if (state.screen === 'GAMEOVER' || state.screen === 'VICTORY') {
      if (isConfirm || k === 'r') state.screen = 'TITLE';
      return;
    }

    if (state.screen === 'DIALOGUE') {
      if (isConfirm) advanceDialogue();
      return;
    }

    if (state.screen === 'MENU') {
      if (!state.subMenuType) {
        if (k === 'arrowleft' || k === 'a') { state.mainMenuIdx = (state.mainMenuIdx + 3) % 4; sfx.select(); }
        else if (k === 'arrowright' || k === 'd') { state.mainMenuIdx = (state.mainMenuIdx + 1) % 4; sfx.select(); }
        else if (isConfirm) handleMenuSelect();
      } else {
        const list = state.subMenuType === 'ACT' ? getActOptions() : state.items;
        if (k === 'arrowup' || k === 'w') { state.subMenuIdx = (state.subMenuIdx + list.length - 1) % list.length; sfx.select(); }
        else if (k === 'arrowdown' || k === 's') { state.subMenuIdx = (state.subMenuIdx + 1) % list.length; sfx.select(); }
        else if (isCancel) { state.subMenuType = null; sfx.select(); }
        else if (isConfirm) handleMenuSelect();
      }
      return;
    }

    if (state.screen === 'ATTACK_BAR' && isConfirm) {
      handleMenuSelect();
    }
  }

  function releaseVirtualKey(k) {
    keys[k] = false;
  }

  window.addEventListener('keydown', (e) => {
    const k = e.key.toLowerCase();
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(k)) e.preventDefault();
    triggerVirtualPress(k);
  });

  window.addEventListener('keyup', (e) => {
    releaseVirtualKey(e.key.toLowerCase());
  });

  // 모바일 가상 패드 멀티터치/포인터 바인딩
  document.querySelectorAll('[data-key]').forEach((btn) => {
    const k = btn.getAttribute('data-key');
    const down = (e) => {
      e.preventDefault();
      btn.classList.add('pressed');
      triggerVirtualPress(k);
    };
    const up = (e) => {
      e.preventDefault();
      btn.classList.remove('pressed');
      releaseVirtualKey(k);
    };
    btn.addEventListener('touchstart', down, { passive: false });
    btn.addEventListener('touchend', up, { passive: false });
    btn.addEventListener('touchcancel', up, { passive: false });
    btn.addEventListener('mousedown', down);
    btn.addEventListener('mouseup', up);
    btn.addEventListener('mouseleave', up);
  });

  // 캔버스 직접 터치/드래그/탭 지원
  let dragActive = false;
  let lastTouchPt = null;

  function toCanvasCoords(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (clientX - rect.left) * (W / rect.width),
      y: (clientY - rect.top) * (H / rect.height)
    };
  }

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    sfx.init();
    const pt = toCanvasCoords(e.clientX, e.clientY);

    if (state.screen === 'TITLE') {
      if (pt.y >= 406 && pt.y <= 440) startNewGame(0, true);
      else startNewGame(0, false);
      return;
    }
    if (state.screen === 'GAMEOVER' || state.screen === 'VICTORY') {
      state.screen = 'TITLE';
      return;
    }
    if (state.screen === 'DIALOGUE' || state.screen === 'ATTACK_BAR') {
      handleMenuSelect();
      return;
    }
    if (state.screen === 'MENU') {
      if (pt.y >= 496 && pt.y <= 548) {
        for (let i = 0; i < 4; i++) {
          const cx = 44 + i * 162;
          if (pt.x >= cx && pt.x <= cx + 144) {
            state.mainMenuIdx = i;
            state.subMenuType = null;
            handleMenuSelect();
            return;
          }
        }
      } else if (state.subMenuType) {
        const list = state.subMenuType === 'ACT' ? getActOptions() : state.items;
        for (let i = 0; i < list.length; i++) {
          const yy = state.box.y + 44 + i * 34;
          if (pt.y >= yy - 24 && pt.y <= yy + 12) {
            state.subMenuIdx = i;
            handleMenuSelect();
            return;
          }
        }
      }
      return;
    }

    if (state.screen === 'DODGE') {
      dragActive = true;
      lastTouchPt = pt;
      const s = state.soul;
      if (s.mode === 'YELLOW' || s.mode === 'HYBRID_BY') {
        keys['z'] = true;
      }
      if ((s.mode === 'BLUE' || s.mode === 'HYBRID_BY') && s.grounded) {
        triggerVirtualPress('arrowup');
        setTimeout(() => releaseVirtualKey('arrowup'), 140);
      }
      if (s.mode === 'GREEN' || s.twinSplit) {
        const cx = state.box.x + state.box.w / 2;
        const cy = state.box.y + state.box.h / 2;
        s.shieldAngle = Math.atan2(pt.y - cy, pt.x - cx);
      }
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!dragActive || state.screen !== 'DODGE') return;
    e.preventDefault();
    const pt = toCanvasCoords(e.clientX, e.clientY);
    const s = state.soul;
    const b = state.box;

    if (s.mode === 'GREEN' || s.twinSplit) {
      const cx = b.x + b.w / 2;
      const cy = b.y + b.h / 2;
      s.shieldAngle = Math.atan2(pt.y - cy, pt.x - cx);
      lastTouchPt = pt;
      return;
    }

    if (lastTouchPt) {
      let dx = pt.x - lastTouchPt.x;
      let dy = pt.y - lastTouchPt.y;
      if (s.reversed) { dx = -dx; dy = -dy; }

      if (s.mode === 'PURPLE' || s.mode === 'HYBRID_GP') {
        s.x = Math.max(b.x + 14, Math.min(b.x + b.w - 14, s.x + dx));
        if (Math.abs(dy) > 18) {
          s.railIdx = Math.max(0, Math.min(2, s.railIdx + (dy > 0 ? 1 : -1)));
          s.y = b.y + b.h * (0.2 + s.railIdx * 0.3);
          lastTouchPt = pt;
          return;
        }
      } else if (s.mode === 'BLUE' || s.mode === 'HYBRID_BY') {
        s.x = Math.max(b.x + 11, Math.min(b.x + b.w - 11, s.x + dx));
        if (dy < -16 && s.grounded) {
          triggerVirtualPress('arrowup');
          setTimeout(() => releaseVirtualKey('arrowup'), 150);
        }
      } else {
        s.x = Math.max(b.x + 11, Math.min(b.x + b.w - 11, s.x + dx));
        s.y = Math.max(b.y + 11, Math.min(b.y + b.h - 11, s.y + dy));
        if (s.mode === 'HYBRID_RG' && Math.hypot(dx, dy) > 2) {
          s.shieldAngle = Math.atan2(dy, dx);
        }
      }
    }
    lastTouchPt = pt;
  });

  const endCanvasDrag = () => {
    dragActive = false;
    lastTouchPt = null;
    keys['z'] = false;
  };
  canvas.addEventListener('pointerup', endCanvasDrag);
  canvas.addEventListener('pointercancel', endCanvasDrag);

  // 상단 HUD 버튼 이벤트
  document.getElementById('btn-bgm').addEventListener('click', (e) => {
    sfx.init();
    sfx.bgmEnabled = !sfx.bgmEnabled;
    e.target.textContent = `BGM: ${sfx.bgmEnabled ? 'ON' : 'OFF'}`;
    updateHudBadges();
  });

  document.getElementById('btn-pad').addEventListener('click', (e) => {
    const pad = document.getElementById('mobile-controls');
    pad.classList.toggle('hidden');
    e.target.textContent = `패드: ${pad.classList.contains('hidden') ? 'OFF' : 'ON'}`;
    setTimeout(fitGameWrap, 20);
  });

  document.getElementById('btn-normal').addEventListener('click', () => startNewGame(0, false));
  document.getElementById('btn-enraged').addEventListener('click', () => startNewGame(0, true));

  // 메인 애니메이션 루프
  let lastTime = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - lastTime) / 1000);
    lastTime = now;
    update(dt);
    render();
    for (const k in justPressed) justPressed[k] = false;
    requestAnimationFrame(loop);
  }
  updateHudBadges();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
